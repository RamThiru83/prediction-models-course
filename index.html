      html: `
<h3>Unordered categories</h3>
<p>A categorical predictor with k levels is entered with k − 1 <b>dummy variables</b> (0/1 indicators), each comparing one level with a chosen <b>reference category</b>. In the GUSTO-I trial of myocardial infarction, smoking was recorded as never (1), past (2), current (3). Two dummies are created: past versus never and current versus never. Each coefficient is a log odds ratio against the reference level.</p>
<p>The reference category matters for interpretation but not for prediction. Statistical programs usually take the lowest or highest code as reference. If that category is small, the comparisons against it are imprecise and may look non-significant even though the variable has a real overall effect. Choosing a larger category as reference gives more stable individual coefficients. The predicted risks from the model are identical whichever reference is chosen.</p>
<h3>Combining categories</h3>
<p>Small categories can be merged. A cancer study with many sub-stages (T1a, T1b, T1c, T2a, and so on) might collapse them into T1 to T4, or pool rare levels into an "other" group. The warning is that merging guided by the outcome, for example joining the levels that happen to have similar risk in the sample, produces an optimistic model. Merging should be based on frequency tables or on similarity of meaning, while blind to the outcome, or on codings used in previous studies. If small categories are kept separate, shrinkage or penalised estimation (Module 10) is needed to obtain reliable coefficients.</p>
<h3>Ordered categories</h3>
<p>Ordered predictors are often reduced to two groups. Table 1 shows what that costs in GUSTO-I (n = 40,830). The model chi-square is the gain from adding the predictor to a model without it.</p>
<div class="callout book"><b>Book example: GUSTO-I, effect of coding categorical predictors on model chi-square</b>
<table class="data">
<tr><th>Predictor</th><th>Coding</th><th>df</th><th>Model χ²</th></tr>
<tr><td>Location of infarct</td><td>Anterior vs other</td><td>1</td><td>343</td></tr>
<tr><td></td><td>Anterior / inferior / other</td><td>2</td><td>361</td></tr>
<tr><td>Killip class (I to IV, left ventricular function)</td><td>Shock (class 3/4 vs 1/2)</td><td>1</td><td>861</td></tr>
<tr><td></td><td>Linear (scores 1 to 4)</td><td>1</td><td>1,388</td></tr>
<tr><td></td><td>Linear + square</td><td>2</td><td>1,388</td></tr>
<tr><td></td><td>Factor (three dummies)</td><td>3</td><td>1,389</td></tr>
<tr><td>Smoking</td><td>Never / past / current (two dummies)</td><td>2</td><td>483</td></tr>
<tr><td></td><td>Linear (1 to 3)</td><td>1</td><td>482</td></tr>
</table>
<p>Source: Ch. 9, Table 9.1. The infarct location data show that the third category, only 3% of patients, still adds information in a very large trial; in a small study the inferior and other groups might be pooled.</p></div>
<p>Three lessons follow from the table. First, collapsing the four Killip classes to shock versus no shock throws away most of the information (861 versus 1,388). Second, simply treating the ordered classes as a straight line recovers essentially all of what the full factor coding captures (1,388 versus 1,389) with 1 df instead of 3. Third, even for a weakly ordered variable such as smoking, the linear coding performed as well as the factor coding (482 versus 483) and used one parameter fewer. Linear coding of an ordinal predictor is therefore a reasonable starting point, after which a squared term can be added as a check on non-linearity. More advanced estimation methods that force the effect to be monotone (always rising or always falling) exist but are more flexible than a linear coding.</p>
<div class="callout mch"><b>Illustrative (synthetic): place of antenatal booking</b><p>A district cohort records place of first antenatal visit as sub-centre (62%), primary health centre (30%), private clinic (7%) and tertiary hospital (1%). Using the 1% tertiary group as the reference category would give a coefficient with a very wide interval for every comparison. Taking sub-centre as the reference gives stable comparisons, and the 1% group can be merged with private clinic on the grounds of similar service level, a decision made without looking at preterm-birth rates.</p></div>
<p class="src">Source: Ch. 9, §9.1 and Table 9.1</p>

      title: 'Continuous predictors: why dichotomising is a bad idea',
      html: `
<p>Splitting a continuous predictor into "high" and "low" is very common, mainly because it simplifies presentation. For prediction it has several concrete disadvantages.</p>
<h3>The step is unnatural</h3>
<p>A model with age dichotomised at 65 years assumes that a woman or man who turned 65 yesterday has a clearly higher risk than one who turns 65 tomorrow, and that all people below 65 share one risk and all above share another. A patient aged 40 is assumed to have the same risk as one aged 64, and a patient aged 90 the same as one aged 66. In the GUSTO-I analysis (Fig. 9.1 of the book) the dichotomised fit is two flat levels, and it agrees with the straight-line fit at only two points on the age axis, which are the only places where the dichotomy approximates the continuous model well.</p>
<p>The result also depends on who is in the sample. If the data contained no patients older than 70, the same step function would take a quite different shape, whereas the continuous model, which conditions on every age value, would stay much the same. A cut-point model is therefore less portable between populations.</p>
<h3>Information is lost</h3>
<div class="callout book"><b>Book example: GUSTO-I, age and ST elevation</b>
<table class="data">
<tr><th>Predictor</th><th>Coding</th><th>df</th><th>Model χ²</th></tr>
<tr><td>Age</td><td>≤65 vs &gt;65 years</td><td>1</td><td>1,463</td></tr>
<tr><td></td><td>≤60, 61 to 70, ≥71</td><td>2</td><td>1,775</td></tr>
<tr><td></td><td>Linear</td><td>1</td><td>2,099</td></tr>
<tr><td></td><td>Linear + square</td><td>2</td><td>2,112</td></tr>
<tr><td></td><td>Restricted cubic spline, 5 knots</td><td>4</td><td>2,122</td></tr>
<tr><td>ST elevation (number of leads, 0 to 11)</td><td>&gt;4 vs ≤4</td><td>1</td><td>259</td></tr>
<tr><td></td><td>Linear</td><td>1</td><td>281</td></tr>
<tr><td></td><td>Linear + square</td><td>2</td><td>306</td></tr>
<tr><td></td><td>Linear + square + cubic</td><td>3</td><td>339</td></tr>
<tr><td></td><td>Restricted cubic spline, 5 knots</td><td>4</td><td>350</td></tr>
<tr><td></td><td>Factor (one level per count)</td><td>11</td><td>367</td></tr>
</table>
<p>Source: Ch. 9, Table 9.2.</p></div>
<p>For age, the single cut at 65 captures 1,463 out of 2,099 (70%) of what a straight line captures; three categories recover 1,775, which the book reports as 85% of the information in age as a linear variable. Adding a square term or a spline adds little for age (2,112 and 2,122), so for this predictor the straight line is already a good description.</p>
<h3>Non-monotone relationships are lost completely</h3>
<p>ST elevation shows a more complex pattern. Thirty-day mortality in GUSTO-I was 7.1% with 0 elevated leads, fell to 4.7% with 3 leads, and then rose steadily to about 12% with 7 to 9 leads. The relationship is U-shaped. A split at more than 4 leads performs worst of all the codings (259), because risks within the "low" group fall and then rise, and risk within the "high" group climbs steeply, yet each group is assigned one constant risk.</p>
<div class="callout book"><b>Book example: GUSTO-I, mortality by number of leads with ST elevation</b>
<table class="data">
<tr><th>Leads</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th></tr>
<tr><td>30-day mortality (%)</td><td>7.1</td><td>6.9</td><td>5.1</td><td>4.7</td><td>6.5</td><td>7.4</td><td>9.3</td><td>12</td><td>12</td><td>12</td></tr>
</table>
<p>Source: Ch. 9, Table 9.3 (counts of patients per category range from 333 to 12,744 for 0 to 9 leads; the 10 and 11-lead groups are tiny).</p></div>
<div class="callout warn"><b>Critical:</b><p>If the cut-point is chosen by looking for the split that best separates the outcome in the development data, the resulting model is biased in a specific direction: the apparent effect is exaggerated and will not reproduce in new patients. The book lists the search for an "optimal" cut-point among the data-driven choices that cause optimism (Chapter 5). Categories (for example quartiles) are acceptable as an exploratory step to look at a predictor-outcome relationship, or to illustrate an effect to readers, but should not be used in the final prediction model.</p></div>
<p>Even an intermediate approach, such as four or five categories, remains a step function. Jumps in predictions at the category borders are unnatural, and the borders themselves depend on the choice of cut-points and on the distribution of the predictor in the sample. Smooth relationships are biologically far more plausible.</p>
<p class="src">Source: Ch. 9, §9.2</p>

      html: `
<p>When a straight line is too restrictive, a continuous predictor X can be entered through a set of terms that together allow a curve. Each option below is a way of spending df to purchase flexibility.</p>
<h3>Polynomials and simple transformations</h3>
<p>The most common extension adds a square term (X and X²) or a cubic term (X, X², X³). The extension can be tested within nested models. Other transformations may be used instead of the linear term or in addition to it: inverse (1/X), square root (X<sup>0.5</sup>), logarithm and exponential. A transformation such as the logarithm is often a robust summary of a laboratory measurement, for example a hormone concentration. A polynomial of low order can only take a limited set of shapes, and its tails can behave erratically.</p>
<h3>Fractional polynomials</h3>
<p>A <b>fractional polynomial</b> (FP) builds a function from powers X<sup>p</sup> where p is chosen from the set {−2, −1, −0.5, 0, 0.5, 1, 2, 3}, with X<sup>0</sup> defined as log X. That gives 8 "FP1" functions of a single power (1 df for the coefficient, plus one more degree of freedom for searching the power). An "FP2" function combines two powers, X<sup>p1</sup> + X<sup>p2</sup>; if the two powers are equal it takes the form X<sup>p</sup> + X<sup>p</sup> log X. That gives 28 + 8 = 36 FP2 functions, using 4 df in all. For medical problems an FP2 is usually flexible enough. Limitations noted in the book: values in the tails of the predictor distribution can distort the fitted shape, FP functions are not invariant to a change of origin of the variable, and negative values cannot be handled without a shift. The width of confidence intervals is too narrow if the search for the powers is ignored.</p>
<h3>Restricted cubic splines</h3>
<p>A <b>spline</b> joins separate low-order polynomials end to end at points called <b>knots</b>. A cubic spline uses cubic pieces. A <b>restricted cubic spline</b> (RCS) adds the constraint that the curve is a straight line beyond the outer knots, which stabilises behaviour at the extremes of the predictor distribution where data are sparse. The number of parameters is the number of knots minus 1:</p>
<table class="data">
<tr><th>Knots</th><th>df</th><th>When to consider</th></tr>
<tr><td>3</td><td>2</td><td>Small datasets, or when there is no strong prior reason to expect non-linearity</td></tr>
<tr><td>4</td><td>3</td><td>Intermediate</td></tr>
<tr><td>5</td><td>4</td><td>Large datasets, especially if non-linearity is expected; sufficient to capture many non-linear patterns</td></tr>
</table>
<p>The exact knot positions are usually not critical, and are typically specified from the distribution of the predictor (that is, at chosen percentiles of the observed values). A model with an RCS using 2 df contains a wider family of functions than the same-df model with a square term, which is restricted to a parabola.</p>
<h3>Smoothing splines in generalised additive models</h3>
<p>A <b>generalised additive model</b> (GAM) fits a smooth function to each continuous predictor and controls wiggliness with a penalty in the likelihood. The penalty reduces the effective df actually spent. Without a penalty such splines overfit, and the extreme flexibility sometimes gives wiggly shapes that will not reproduce in new data. Penalisation is discussed in Module 10.</p>
<h3>Comparing codings fairly</h3>
<p>RCS functions with different numbers of knots are not nested, so it is not strictly correct to test down from a complex RCS to a simpler one in a stepwise way. Instead, the codings can be compared through the increase in likelihood-ratio chi-square after taking the extra df into account:</p>
<div class="formula">Adjusted fit = model χ² − 2 × df   (Akaike's Information Criterion, in chi-square form)</div>
<div class="callout eg"><b>Worked example (Book example data: ST elevation, Table 9.2)</b>
<table class="data">
<tr><th>Coding</th><th>Model χ²</th><th>df</th><th>χ² − 2 × df</th></tr>
<tr><td>&gt;4 vs ≤4</td><td>259</td><td>1</td><td>257</td></tr>
<tr><td>Linear</td><td>281</td><td>1</td><td>279</td></tr>
<tr><td>Linear + square</td><td>306</td><td>2</td><td>302</td></tr>
<tr><td>Linear + square + cubic</td><td>339</td><td>3</td><td>333</td></tr>
<tr><td>RCS, 5 knots</td><td>350</td><td>4</td><td>342</td></tr>
</table>
<p>The RCS has the highest adjusted fit among these five. The dichotomy has the lowest, 85 points below the RCS.</p></div>
<div data-widget="codingExplorer"></div>
<ul class="try">
<li>Choose "dichotomised" and move the cut slider. Observe that the fitted line is a step with two flat levels and that the LR χ² and AIC change with the cut. Notice how much the apparent fit depends on where you put the cut.</li>
<li>Choose "linear", then "quadratic". Compare the fitted curve with the observed risk in age groups and compare AIC.</li>
<li>Choose restricted cubic splines with 3, 4 and 5 knots and note how the df and AIC change. Reduce the random subsample size with the slider and watch the 5-knot curve become more erratic.</li>
</ul>
<p class="src">Source: Ch. 9, §9.3 and Table 9.4</p>

      id: 's5',
      title: 'Choosing how much flexibility to allow',
      html: `
<p>The book summarises the options for continuous predictors in a short table, which can be read as a ladder of increasing flexibility and decreasing robustness.</p>
<table class="data">
<tr><th>Option</th><th>Character</th><th>Book's recommendation</th></tr>
<tr><td>Dichotomisation</td><td>Simple, easy interpretation</td><td>Bad idea</td></tr>
<tr><td>More categories</td><td>Captures prognostic information but not smooth; unstable because of the cut-points</td><td>Primarily for illustration</td></tr>
<tr><td>Linear</td><td>Simple</td><td>Often reasonable as a start</td></tr>
<tr><td>Polynomials</td><td>Square or cubic terms; tails may be unstable</td><td>Reasonable as checks for non-linearity</td></tr>
<tr><td>Transformations (log, square root, inverse)</td><td>One parameter</td><td>May give robust summaries of non-linearity</td></tr>
<tr><td>Fractional polynomials</td><td>Flexible; tails may behave unstably</td><td>Flexible descriptions of non-linearity</td></tr>
<tr><td>Restricted cubic splines</td><td>Flexible with robust behaviour in the tails</td><td>Flexible descriptions of non-linearity</td></tr>
<tr><td>Splines in GAM</td><td>Highly flexible, smoothness set by penalty</td><td>Highly flexible descriptions of non-linearity</td></tr>
</table>
<p class="src">Adapted from Ch. 9, Table 9.4</p>
<h3>A parametric transformation as a middle course</h3>
<p>One useful compromise is to look for a simple parametric transformation that captures most of the non-linearity, and then test whether it is adequate by adding RCS terms based on the transformed variable. In a prostate cancer example, PSA values were linearly related to outcome after a log transformation, whereas the original model had used an RCS with 5 knots. Restricting a predictor to a transformation such as the logarithm can reduce the apparent fit slightly, but it limits optimism and increases the robustness of the model. The behaviour of predictions in the tails of the distribution deserves particular care.</p>
<h3>Fractional polynomials or splines?</h3>
<p>The book notes that empirical comparisons between FP and RCS functions are lacking. The main differences arise in the tails: if there is real curvature in the tails the FP will capture it and the RCS will not, and if such curvature is spurious the RCS will do better. With the same df both often perform similarly.</p>
<div class="callout book"><b>Book example: functional form of age in GUSTO-I</b><p>In a subsample of roughly 800 patients the chosen FP2 function for age, AGE<sup>−2</sup> + AGE<sup>3</sup>, used 4 df but its shape had no more than two bendings, which an RCS with 4 knots (3 df) can reproduce. No statistically significant non-linearity was found in the subsample. In the full data (n = 40,830) the optimal transformation was AGE<sup>2</sup>; for weight and height non-linearity was not significant. Source: Ch. 9, §9.3.4.</p></div>
<h3>Extrapolation</h3>
<p>Predicting beyond the observed range of a predictor is always dangerous, but the RCS has the safest behaviour because it extrapolates essentially linearly. In the GUSTO-I ST-elevation example the 5-knot RCS draws a straight line for 9 to 11 leads, whereas the cubic polynomial curves downwards at 10 leads, which would be implausible.</p>
<h3>Allocating degrees of freedom across predictors</h3>
<p>Two strategies are described. Harrell suggested fixing the number of df per continuous predictor from univariate analyses (for example using RCS functions) and then keeping that level of complexity in the multivariable model whatever the statistical significance of the higher-order terms. Another reasonable strategy is to fit a model with every continuous predictor given the same flexible coding, for example 5 df, and then reduce the df per predictor according to its partial R², giving more flexibility to stronger predictors and less to weaker ones, without testing non-linearity. Both approaches fix the complexity independently of whether the curve looks significantly non-linear, which limits the testing-then-estimating bias described in Module 4.</p>
<div class="callout warn"><b>Critical:</b><p>Giving every continuous predictor its maximum flexibility is not free. If the development sample has few outcome events, the additional df use up the events per variable (Module 2), and the model will overfit. The df you can afford to spend is set by the number of events, not by the number of patients.</p></div>
<p class="src">Source: Ch. 9, §9.3.4, §9.3.5, §9.6</p>
`

      title: 'Outliers and truncation',
      html: `
<p>An <b>outlier</b> is a value outside the typical range of a variable. A box plot shows the median, and a box covering the interquartile range (IQR, the 25th to 75th percentile). One conventional definition, attributed in the book to Tukey, treats values as outliers when they are at least 3 × IQR above the third quartile or at least 3 × IQR below the first quartile. For a practical purpose, any value that could have a large influence (leverage) on the regression coefficients is of concern.</p>
<div class="formula">Lower fence = Q1 − 3 × IQR        Upper fence = Q3 + 3 × IQR</div>
<h3>Step 1: is the value correct?</h3>
<p>Check the source record, such as the case report form or hospital chart, for a data-entry error. Correct it if possible.</p>
<h3>Step 2: is the value biologically plausible?</h3>
<p>This judgement depends on the clinical setting and needs expert opinion. A systolic blood pressure of 250 mmHg may be plausible in acute traumatic brain injury care but not in an ambulatory clinic. An implausible value is best treated as an error and set to <b>missing</b>, to be handled by the missing-data methods in Module 5.</p>
<h3>Step 3: for plausible values, reduce their leverage by truncation</h3>
<p><b>Truncation</b> moves values beyond chosen limits back to the limit:</p>
<div class="formula">If X &gt; X<sub>max</sub> then X = X<sub>max</sub>;   if X &lt; X<sub>min</sub> then X = X<sub>min</sub>;   otherwise X = X</div>
<p>The truncation points can be chosen by looking at the distribution (box plots or histograms), without reference to the outcome. As a practical rule the book suggests shifting about 0.5% to 1% of values at each end of the range.</p>
<div class="callout book"><b>Book example: glucose and outcome after traumatic brain injury</b><p>Among 4,831 admission glucose values, 3 were above an upper limit of 100 mmol/L for biologically possible values and were set to missing. In 2,096 patients from the Tirilazad trials who had both glucose and 6-month outcome, glucose was then truncated to the interval 3 to 20 mmol/L. After truncation, the relationship between glucose and outcome became slightly more linear. Source: Ch. 9, §9.4.1, Figs 9.4 and 9.5.</p></div>
<div class="callout mch"><b>Illustrative (synthetic): booking haemoglobin</b><p>In a cohort of 2,000 pregnant women, booking Hb has Q1 = 9.8 and Q3 = 11.6 g/dL, IQR = 1.8. The fences are 9.8 − 5.4 = 4.4 and 11.6 + 5.4 = 17.0 g/dL. A value of 19.5 is beyond the upper fence. The first action is to check the register entry (perhaps 9.5 was typed as 19.5). If the record is right but the value is physiologically implausible in pregnancy, set it to missing. A value of 4.2 g/dL, which is also beyond the lower fence, could be real in severe anaemia; it is plausible, so it is retained, and truncation (for example at 5 g/dL) may be used to limit its leverage.</p></div>
<p class="src">Source: Ch. 9, §9.4 and Table 9.5</p>

      id: 's7',
      title: 'Putting effects on an interpretable scale',
      html: `
<p>Coefficients and odds ratios (OR) depend on the units of the predictor. A binary predictor has no scaling problem: the OR compares the two groups. For a continuous predictor, the OR refers to a one-unit increase, and a one-unit increase may be too small (one year of age) or too large (1 mmol/L of a laboratory value) to be meaningful.</p>
<h3>Rescaling the unit</h3>
<p>The simplest approach is to divide the predictor by a convenient number before fitting, so that its coefficient refers to a larger step. Equivalently, multiply the estimated coefficient by that number. In GUSTO-I, the univariable logistic coefficient for age in years was 0.084, so the OR per year was e<sup>0.084</sup> = 1.088. Per decade, the coefficient becomes 10 × 0.084 = 0.84 and the OR is e<sup>0.84</sup> = 2.32, which equals 1.088<sup>10</sup>. Rescaling does not change the predictions or the p-value; it only changes the unit.</p>
<div class="formula">OR for a k-unit increase = exp(k × β) = (exp β)<sup>k</sup></div>
<h3>Comparing predictors with different units</h3>
<p>Two common devices make effects of different continuous predictors comparable:</p>
<ul>
<li><b>Standardise</b> by dividing by the standard deviation, so each coefficient refers to a one-SD increase.</li>
<li><b>Interquartile range</b> comparison: compare predictions at the 75th and 25th percentiles of the predictor; for a linear term this equals dividing by the IQR. Standardisation does not apply to categorical predictors, polynomials or other non-linear transformations.</li>
</ul>
<p>For non-linear codings, compare predicted outcomes at the 75th versus 25th percentile, although the interpretation of a parabola by a single OR is awkward. A graph of predicted probability against the predictor is generally the clearest way to display a non-linear effect.</p>
<h3>Dummy coding for illustration only</h3>
<p>A non-linear predictor can be illustrated by two dummies: one for values below the 25th percentile and one for values above the 75th, with the middle 50% as reference. This is helpful to explain the pattern to readers but loses information and depends on the distribution of the predictor in the sample, so it is not advised for making predictions.</p>
<div class="callout book"><b>Book example: systolic blood pressure and 6-month outcome after TBI</b><p>The relation was U-shaped: low pressure especially, but also high pressure, was associated with a poor Glasgow outcome score. It was modelled with an RCS of 3 knots (2 df). The 75th percentile was 141 mmHg and the 25th was 121 mmHg; the OR for predictions at these two points was 1.39 (95% CI 1.25 to 1.54). For illustration, categories below 120 and above 150 mmHg, with 120 to 150 as reference, gave ORs of 0.50 and 0.76 for a good outcome, meaning a poor outcome about twice as likely with low pressure and about 1.3 times as likely with high pressure. The categorised coding had an R² of 2.4% against 4.8% for the continuous coding. Source: Ch. 9, §9.5.1.</p></div>
<div class="callout eg"><b>Worked example: converting a coefficient</b>
<p>In a synthetic GDM model the coefficient for first-trimester BMI is 0.09 per kg/m². The OR per unit is e<sup>0.09</sup> = 1.094. For a 5-unit increase the coefficient is 5 × 0.09 = 0.45 and the OR is e<sup>0.45</sup> = 1.57. If the IQR of BMI is 6 units, the coefficient per IQR is 0.54 and the OR per IQR is e<sup>0.54</sup> = 1.72. The three ORs describe exactly the same model.</p></div>
<p class="src">Source: Ch. 9, §9.5 and Table 9.6</p>
`

      html: `
<p>In most clinical settings the analyst can list far more possible predictors than the data can support. A cohort of 800 women with 90 preterm births might record 40 variables, and each continuous variable may be coded with several terms. A small sample brings the problems described in Module 4: low power to test individual effects and, when the full set is fitted, too-extreme predictions (overfitting). This module deals with reducing the number of <b>candidate predictors</b> (all variables and terms that are considered for the model), as distinct from the <b>included predictors</b> (those that remain in the final model).</p>
<p>The book distinguishes two kinds of reduction.</p>
<ul>
<li><b>Strategies that do not use the predictor-outcome relationship in the data</b>: subject knowledge, review of the literature, the number of missing values, how a predictor is distributed, combining related variables, and averaging effects over subgroups. These are the subject of this module.</li>

<div class="callout book"><b>Book example: too many candidates in children with fever</b><p>Models to identify serious bacterial infection in children presenting with fever without an obvious cause were developed in 231 children, of whom 58 had the diagnosis, from 57 candidate predictors. Univariable screening was followed by stepwise selection. The model seemed to perform reasonably, but external validation showed poor results. Bootstrapping the whole modelling process later showed a large decrease in performance, and much of the poor performance in new patients was attributable to the modelling strategy with too many candidates for the number of events. Source: Ch. 10, §10.1.2.</p></div>
<p>Here the events per variable (EPV), if each candidate used 1 df, was about 58/57, roughly 1. Module 2 defined EPV; for now note that a model should have at least 10 events per candidate degree of freedom, and the book gives 50 per candidate if selection from the list is to be reliable (Module 8).</p>
<h3>Using meta-analysis to choose candidates</h3>
<p>A systematic review or meta-analysis of published univariable effects may help to choose candidates, but it has limitations.</p>
<ul>
<li><b>Suppression.</b> When two predictors are negatively correlated, the univariable effect of each can be near zero while the multivariable effect is clear. A predictor that looks unimportant in published univariable results might be useful. This is relatively rare, because correlations between medical predictors are mostly positive, which makes univariable effects larger than multivariable effects.</li>
<li><b>Counting versus pooling.</b> Counting how often a predictor was found "important" may be enough to identify key predictors. A formal meta-analysis is needed if the pooled effect is to serve as a prior estimate for the model.</li>

<p>After restricting the list by knowledge, the distributions of the remaining predictors can be examined. This is done without relating them to the outcome.</p>

<h3>Weights from a logical relationship</h3>
<p>If weights are not equal, they can sometimes be set from a known relationship rather than estimated. For family history, the genetic distance between second-degree and first-degree relatives is 0.5, and between third-degree and first-degree relatives is 0.25. This relationship can define a family-history score:</p>
<div class="formula">Family history score = (number of affected first-degree relatives) + 0.5 × (number of affected second-degree relatives)</div>
<p>This coding was used in a model to predict the likelihood of a mutation in people suspected of Lynch syndrome. A person with one affected first-degree relative gets the same score (1) as a person with two affected second-degree relatives. An implicit assumption is that the numbers at risk are similar for first-degree and second-degree relatives, with similar numbers and similar age distributions. The weights are fixed in advance and cost no df; one coefficient, estimated from the data, applies to the whole score.</p>
<h3>Statistical combination: principal components</h3>
<p>Harrell proposed principal component analysis to summarise the information from all candidate predictors. It does not use the predictor-outcome relationship, and empirical evaluations have been promising. The drawbacks are theoretical and practical: the coefficients of the resulting components lose their interpretability, and all predictor values must be known in order to compute any prediction. The book notes that few modelling studies have used it, but the concept should be kept in mind. There is some similarity with clustering approaches used for genetic markers.</p>
<div class="callout eg"><b>Worked example: family history score</b>
<table class="data">
<tr><th>Woman</th><th>First-degree affected</th><th>Second-degree affected</th><th>Score</th></tr>
<tr><td>A</td><td>1</td><td>0</td><td>1 + 0 = 1</td></tr>
<tr><td>B</td><td>0</td><td>2</td><td>0 + 1 = 1</td></tr>
<tr><td>C</td><td>2</td><td>1</td><td>2 + 0.5 = 2.5</td></tr>
<tr><td>D</td><td>0</td><td>3</td><td>0 + 1.5 = 1.5</td></tr>
</table>
<p>Women A and B get the same score and hence the same prediction. The model cannot distinguish them, which is a deliberate simplification.</p></div>
<p class="src">Source: Ch. 10, §10.2.3 to §10.2.4</p>
`

      html: `
<p>A <b>main effect</b> in a regression model is an average over the underlying subgroup effects. If the true effect of a predictor differs between subgroups (an interaction), the main effect describes the average. This averaging is reasonable as long as no strong interaction exists, and it adds robustness because the effect is estimated from all patients. The same idea applies in randomised trials: the main question is the average treatment effect, and subgroup effects are usually secondary analyses.</p>
<h3>Example: one model or two?</h3>
<p>In predicting <i>Chlamydia trachomatis</i> infection, the traditional focus was on women. When data are available for both sexes there is a choice. A model for men fitted independently of the model for women is equivalent to assuming interactions between sex and every predictor. Each model fits its own pattern, but the predictions are less reliable because the sample size of each is smaller. The alternative is to begin with a combined model that assumes similar effects in men and women, and test the assumption with interaction terms of sex × predictor. In that study only the effect of urogenital symptoms clearly differed by sex.</p>
<h3>Example: should acute-surgery patients be included?</h3>
<p>A model for patients undergoing elective valve replacement was developed in a dataset that also contained patients having acute valve surgery, who are at higher risk. The authors included them, with a main effect for elective versus acute surgery. They found no evidence that predictor effects differed between the two groups, neither for any individual predictor nor in an overall test for interaction. The reasoning is that, provided the bias from differing effects is smaller than the gain in precision from a larger sample, including the extra patients helps.</p>
<p>There is a paradox here that the book points out: a limited sample size also limits the power to detect differing effects. A finding of "no interaction" in a small sample therefore does not prove that the effects are the same. The decision rests mainly on subject-matter knowledge of whether effects would be so different that the total group cannot be modelled together.</p>
<div class="callout mch"><b>Illustrative (synthetic): early-onset sepsis in term and late-preterm neonates</b><p>A team has 700 neonates (92 with sepsis) and wonders whether to build separate models for term and late-preterm babies. Separate models would each have fewer events, roughly 46 each if the groups were equal. A single model with a main effect for prematurity category, and a few pre-specified interactions if justified by clinical reasoning, uses the events more efficiently.</p></div>
<p class="src">Source: Ch. 10, §10.3</p>
`

      title: 'Case study: combining family-history predictors for a genetic mutation',
      html: `
<p>The book illustrates the principles with a model for the presence of a mutation in mismatch-repair genes (Lynch syndrome, hereditary nonpolyposis colorectal cancer, HNPCC). The development sample had 898 patients tested for mutations, 130 of whom carried one. Predictors concern cancers in the patient (the proband) and in first-degree and second-degree relatives: colorectal cancer (CRC), adenoma (a polyp that may precede CRC), endometrial cancer and other HNPCC-related cancers. The patient numbers with CRC were 536, with endometrial cancer 91, and with other related cancer 100; 118 had multiple cancers.</p>
<h3>Step 1: one age effect for related conditions</h3>
<p>A younger age at CRC diagnosis in the proband raises the likelihood of a mutation, and so does a second CRC. Dummy variables CRC1 and CRC2 indicate one or two CRCs. The age at diagnosis can be added as a linear term, either with a separate age slope for CRC1 and CRC2 (4 df) or with one common slope (3 df, the variable "CRCage"). The estimated slopes were −0.40 and −0.32 per decade, and the difference was far from significant (p = 0.80). Adding a square term (p = 0.50) or an RCS (non-linearity p = 0.76 with 3 knots and p = 0.94 with 4 knots) did not improve the fit. Dichotomising age at 50 performed worse.</p>
<div class="callout book"><b>Book example: alternative codings of CRC in the proband (898 patients, 130 mutations)</b>
<table class="data">
<tr><th>Model</th><th>df</th><th>R²</th><th>c statistic</th></tr>
<tr><td>CRC1 &lt;50 + CRC2 &lt;50</td><td>2</td><td>4.6%</td><td>0.602</td></tr>
<tr><td>Four dummies (1 or 2 CRCs, age &lt;50 or ≥50)</td><td>4</td><td>6.9%</td><td>0.634</td></tr>
<tr><td>CRC1 + CRC2 + single linear CRCage</td><td>3</td><td>7.6%</td><td>0.651</td></tr>
<tr><td>CRC1 + CRC2 + separate age slopes</td><td>4</td><td>7.6%</td><td>0.649</td></tr>
</table>
<p>Source: Ch. 10, Table 10.3. The single linear age effect (3 df) is preferred.</p></div>
<h3>Step 2: adenoma and CRC share one age effect</h3>
<p>Adenomas are precursors of CRC, so a diagnosis 10 years younger is expected, a priori, to have a similar effect for adenoma and CRC. The separate age coefficients were −0.38 (CRC) and −0.36 (adenoma). To force one coefficient the two ages are summed in one variable; for patients without the diagnosis the age is set to 45 years, close to the average age at CRC diagnosis, which does not affect the slope because the indicator variables absorb the difference. The common coefficient was −0.37 per decade.</p>
<h3>Step 3: family history</h3>
<p>The same logic applies to relatives, whose CRC and age at diagnosis also matter. The family-history count CRCfam = CRC1st + 0.5 × CRC2nd (Section 6) replaces separate dummies for 1 or 2 first-degree and 1 or 2 second-degree relatives. Four separate age effects, for proband CRC, adenoma, CRC in first-degree and in second-degree relatives, were replaced by one age effect through the sum of the four ages.</p>
<div class="callout book"><b>Book example: model with 11 df versus 5 df</b>
<table class="data">
<tr><th>Model</th><th>df</th><th>R²</th><th>c</th></tr>
<tr><td>Proband CRC and adenoma age separately, plus adenoma, CRC1, CRC2</td><td>5</td><td>8.4%</td><td>0.662</td></tr>
<tr><td>Same with one common proband age effect</td><td>4</td><td>8.4%</td><td>0.662</td></tr>
<tr><td>Four separate age effects, with family history dummies (CRC in first-degree 0, 1, 2; second-degree 0, 1, 2)</td><td>11</td><td>19.4%</td><td>0.767</td></tr>
<tr><td>One age effect, CRCfam score, adenoma, CRC1, CRC2</td><td>5</td><td>18.3%</td><td>0.757</td></tr>
</table>
<p>Source: Ch. 10, Table 10.4.</p></div>
<p>The 5-df model performs almost as well as the 11-df model, so 6 df were saved with little loss in apparent performance. Better stability and better generalisation to new patients are expected.</p>
<h3>The final model</h3>
<p>Endometrial cancer and other HNPCC cancers were treated in the same way (an indicator for the proband, an indicator and family score for relatives, plus age effects where relevant), giving a model with only 10 df. Its R² was 24.9% and c = 0.81 in the development data. In a validation set of 1,016 new patients from the same setting, R² was 24.0% and c = 0.80. The similarity of apparent and validation performance shows the benefit of parsimonious coding in relatively small datasets, where a complex model would produce unstable coefficient estimates.</p>
<p class="src">Source: Ch. 10, §10.4 and §10.5</p>
`

<ol>
<li><b>60 candidates for 96 events.</b> Far too many for the sample. Candidates should be limited using subject knowledge and a literature review, with a typical list of about 5 to 20, in line with the effective sample size (the number of events).</li>

    {
      id: 's1',
      title: 'Reduction before modelling versus while modelling, and collinearity',
      html: `
<p>Specifying the model is the hardest part of prediction modelling. Especially in smaller datasets it is nearly impossible to obtain a reliable answer to the question "which predictors are important and which are not". The previous module described how to cut down the candidate list without looking at the outcome. If that is done well, predictive modelling becomes an estimation problem rather than a testing problem. The ideal outcome is a limited list of candidates that can all be entered into a <b>full model</b>: a model containing the main effects of all candidate predictors. Checks of assumptions such as additivity (interactions) and linearity (non-linear terms) are then the next step (Module 9).</p>
<h3>Reasons to reduce the model while modelling</h3>
<ul>
<li><b>Practicality.</b> It may be impractical to collect or enter a large set of predictors, in particular if some will not be available in future patients or are costly to obtain.</li>
<li><b>Implausible or very small effects.</b> Some predictors may have negligible or biologically implausible effects. For example, when predicting valve fracture from production characteristics, it was unclear which characteristics were relevant at all.</li>
<li><b>Discovery.</b> In genetic and proteomic research, identifying which markers from a very large panel are predictive is itself the aim. Such analyses are exploratory and aimed more at biological knowledge than at prediction.</li>
</ul>
<h3>Collinearity</h3>
<p><b>Collinearity</b> means that predictors are strongly correlated with each other. Its effect is to make the coefficients of the correlated variables imprecise. The <b>variance inflation factor</b> (VIF) measures how much the variance of a coefficient is inflated by the correlation; the book mentions correlation above 0.8 or a VIF above 10 as the level where trouble starts. Is this a worry for prediction models?</p>
<ul>
<li>Correlation between predictors is the reason multivariable models are used at all, to estimate joint effects that a univariable analysis cannot show.</li>
<li>In practice most correlations are less than 0.5. In GUSTO-I the strongest was between height and weight (r = 0.5), and the rest were around 0.1 to 0.2.</li>
<li>Some correlation is created by the analyst, for example between age and age² (r above 0.9), yet their coefficients can be estimated quite reliably.</li>
</ul>
<p>When two predictors are strongly correlated, it may be wiser to combine them than to choose one. For diastolic (DBP) and systolic blood pressure (SBP), with r = 0.62 in one study, a mean pressure such as (2 × DBP + 1 × SBP) may be a better choice than either alone, although subject knowledge matters (systolic pressure is known to be more relevant for cardiovascular risk).</p>

      title: 'Arguments for smaller models: which hold and which do not',
      html: `
<h3>Parsimony</h3>
<p>The principle of parsimony (Occam's razor) says that simpler explanations are preferred to complex ones. For comparing two pre-specified theories it is a sensible principle. For prediction models derived by examining the data, the book argues for the opposite conclusion:</p>
<ul>
<li>A full model asks <b>one</b> question of the data: what are the regression coefficients?</li>
<li>A reduced model asks <b>two</b>: (a) which variables can be eliminated, and (b) what are the coefficients of the remaining predictors, given that the others were eliminated?</li>
</ul>
<p>A reduced model therefore answers two questions rather than one, which is arguably more complex. A smaller model is easier to use (a rule with few simple predictors is easy to remember), but this simplicity is conditional on having selected the right predictors from the candidates.</p>
<h3>Should non-significant predictors be removed?</h3>
<p>Some argue that a predictor that is not statistically significant should not be in the model, because its effect has not been proven. This mixes two concepts: hypothesis testing and estimation. Prediction is about estimation, so it is quite reasonable to keep a predictor with a p-value above 5%, especially if the dataset is small, the predictor is uncommon but strong (for example shock in GUSTO-I), or the predictor is known from previous research to be predictive. Non-significance does not mean there is evidence for a zero effect: absence of evidence is not evidence of absence. Finally, simulations with true noise variables in a model show only a limited decrease in predictive ability.</p>
<div class="callout key"><b>Summary of the arguments</b>
<table class="data">
<tr><th>Argument</th><th>Verdict</th></tr>
<tr><td>Larger models are less practical to work with</td><td>Valid</td></tr>
<tr><td>Some predictors have very small or implausible effects</td><td>Valid</td></tr>
<tr><td>"Statistically non-significant variables should be excluded"</td><td>False: for estimation, significance testing is not relevant, especially when subject knowledge supports the predictor</td></tr>
<tr><td>"Collinearity precludes reliable predictions"</td><td>False: collinearity makes individual coefficients unstable but reliable predictions can still be obtained</td></tr>
<tr><td>"Parsimony principle"</td><td>False when models are selected by studying patterns in the data; it may hold when pre-specified models are compared</td></tr>
</table></div>
<p class="src">Source: Ch. 11, §11.1.4 to §11.1.6</p>
`

      id: 's3',
      title: 'Stepwise selection: variants and stopping rules',
      html: `
<p>Stepwise methods are probably the most widely used selection approach in medical applications. They add or remove predictors using a significance criterion: the F test in linear regression, and the likelihood-ratio, Wald or score statistic in logistic and Cox regression.</p>
<ul>
<li><b>Forward selection</b> starts with no predictor and adds the most significant candidate that is not yet in, as long as it meets the criterion.</li>
<li><b>Backward selection</b> starts with the full model and removes the least significant predictor, then re-fits and repeats.</li>
<li><b>Combined</b> procedures iterate between the two.</li>
<li><b>All possible subsets</b> examines every combination of predictors to find the best fitting model. It can find combinations missed by forward or backward procedures but examines very many models, with multiple testing, and easily overfits.</li>
</ul>
<p>If stepwise selection is used, backward is generally preferred. The analyst is forced to look at the full model and to judge the effect of all candidates together, and correlated variables may remain in the model, whereas in a forward procedure none of them might enter.</p>
<h3>Stopping rules matter more than the variant</h3>
<p>The criterion for inclusion or exclusion is far more important than the variant. Common choices:</p>
<ul>
<li><b>Significance level</b>, usually p &lt; 0.05.</li>
<li><b>Akaike's Information Criterion (AIC)</b>: keep a predictor only if the increase in model χ² exceeds 2 × its df. This is the same as using a more liberal p-value, which depends on the df:</li>
</ul>
<table class="data">
<tr><th>df of the predictor</th><th>χ² must exceed</th><th>Equivalent p-value</th></tr>
<tr><td>1</td><td>2</td><td>0.157</td></tr>
<tr><td>2</td><td>4</td><td>0.135</td></tr>
<tr><td>3</td><td>6</td><td>0.112</td></tr>
<tr><td>4</td><td>8</td><td>0.092</td></tr>
<tr><td>5</td><td>10</td><td>0.075</td></tr>
</table>
<p class="src">Ch. 11, Table 11.1</p>
<ul>
<li><b>Bayesian Information Criterion (BIC)</b>: the model χ² must exceed log(n), the natural logarithm of the sample size. In survival data the effective sample size, such as the number of events, should be used for n. The corresponding p-value for 1 df becomes smaller as the sample grows:</li>
</ul>
<table class="data">
<tr><th>n</th><th>20</th><th>50</th><th>100</th><th>200</th><th>500</th><th>1,000</th><th>2,000</th></tr>
<tr><td>χ² must exceed log(n)</td><td>3.0</td><td>3.9</td><td>4.6</td><td>5.3</td><td>6.2</td><td>6.9</td><td>7.6</td></tr>
<tr><td>Equivalent p</td><td>0.083</td><td>0.048</td><td>0.032</td><td>0.021</td><td>0.013</td><td>0.009</td><td>0.006</td></tr>
</table>
<p class="src">Ch. 11, Table 11.2</p>
<div class="callout eg"><b>Worked example: where 0.157 comes from</b><p>A predictor with 1 df adds to the model χ² a value that, if the predictor has no true effect, follows a chi-square distribution with 1 df. The AIC rule keeps it if the value exceeds 2. The probability that a 1-df chi-square exceeds 2 is 0.157, so the rule is the same as testing at p &lt; 0.157. With 3 df the threshold is 6 and the chance a 3-df chi-square exceeds 6 is 0.112. BIC for n = 200 requires χ² above log(200) = 5.30, giving p = 0.021.</p></div>
<p>There is no particular reason to stick to a p-value of 0.05. The book notes that using AIC has been recommended, and that even higher p-values (0.20 or 0.50) have been found to give more power for selecting predictors with relatively weak effects and better predictions in small datasets that have an established set of candidate predictors. BIC leads to smaller models than AIC and in small effective sample sizes may produce "underfitting", in which too many predictors are removed.</p>
<p class="src">Source: Ch. 11, §11.2</p>
`

      html: `
<h3>Advantages</h3>
<ul>
<li>It is straightforward to apply in modern statistical packages.</li>
<li>It is relatively <b>objective</b>: another analyst, given the same data and the same candidate list, would arrive at a very similar model. This allows the whole strategy to be replayed in each bootstrap sample to estimate the optimism due to selection (Module 4).</li>
<li>It usually achieves its aim of making the model smaller. In very large datasets such as GUSTO-I a stricter criterion (p &lt; 0.01) may be used because many predictors have very small p-values.</li>
<li>With multiply imputed data, selection should be based on the pooled results: obtain p-values for each predictor in a full model fitted to all imputed datasets, combine them, eliminate the least significant if its p exceeds the stopping criterion, re-fit and repeat.</li>
</ul>
<p>The practical caution is that in small datasets only few predictors may have small p-values, leading to a very small model. This argues for AIC or an even higher p-value as the criterion.</p>
<h3>Disadvantage 1: instability of the selection</h3>
<p>Stepwise selection considers a huge number of possible predictor sets, and several fit almost equally well. As a result, which predictors are chosen changes when a slightly different group of patients is used.</p>
<div class="callout book"><b>Book example: selection in small subsamples of GUSTO-I</b><p>Backward selection with p &lt; 0.05 in subsample 5 (n = 429) selected age over 65 (A65), hypotension (HYP) and shock (SHO). In the other 110 small subsamples where the 8-predictor model could be fitted, the percentage of the 111 subsamples in which each predictor was selected was: A65 80%, SHO 53%, HYP 47%, high-risk infarct location (HIG) 29%, heart rate above 80 (HRT) 23%, sex 22%, diabetes (DIA) 13%, time to relief of pain (TTR) 11%. This particular set of three was reproduced in only 7 of the 110 other subsamples. Source: Ch. 11, §11.4.1, Table 11.3.</p></div>
<p>Statements such as "the only independent predictors in this problem were age, hypotension and shock" are overinterpretations unless the sample is huge and the other predictors have much smaller effects. Even worse is to interpret the order of entry in a forward procedure, or the rank order of p-values in the selected model.</p>
<p>Instability depends on the sample size and on the number of candidates. The mean number of predictors selected out of 8 shows the pattern.</p>
<div class="callout book"><b>Book example: mean number of predictors selected out of 8 (± SD)</b>
<table class="data">
<tr><th>Samples</th><th>p &lt; 0.05</th><th>AIC</th><th>p &lt; 0.5</th></tr>
<tr><td>Small subsamples</td><td>2.8 ± 1.1</td><td>4.2 ± 1.1</td><td>6.3 ± 1.2</td></tr>
<tr><td>Large subsamples</td><td>4.8 ± 1.1</td><td>6.0 ± 1.0</td><td>7.0 ± 0.9</td></tr>
<tr><td>16 large regions (at least 2,000 patients, 178 events on average)</td><td>6.6 ± 1.0</td><td>7.1 ± 0.8</td><td>7.8 ± 0.4</td></tr>
</table>
<p>Source: Ch. 11, Table 11.4.</p></div>
<p>The more candidates there are, the more combinations are possible, so the crucial quantity is the ratio of candidate predictors to the effective sample size, which for a binary outcome is the number of events. An EPV of 10 is only a reasonable lower bound for a pre-specified model. For <b>reliable selection</b> among candidates the book states that an EPV of 50 is better. With 8 candidate predictors this means at least 400 events. The full GUSTO-I data (2,851 events in 40,830 patients) satisfy this easily, but that is exceptional. The instability can be studied in any dataset with bootstrap resampling, and when a few predictors are strong and the others weak this should be visible from the selection frequencies over the bootstrap samples.</p>
<div data-widget="stepwiseInstability"></div>
<ul class="try">
<li>Set the sample size to the smallest value and the rule to "backward p&lt;0.05". Press "Run 100 bootstraps" and note the selection frequency of each predictor, the spread of the number of predictors kept and the percentage of bootstraps that reproduce the original model.</li>
<li>Repeat with the largest sample size. Observe which predictors reach a high selection frequency and how the percentage of reproduced models changes.</li>
<li>Switch to "backward p&lt;0.5" and "full model" and compare the number of predictors kept.</li>
</ul>
<p class="src">Source: Ch. 11, §11.3 and §11.4.1</p>

    {
      id: 's5',
      title: 'Disadvantage 2: biased coefficients (testimation bias)',
      html: `
<p>Module 4 introduced <b>testimation bias</b>: when a coefficient is first tested and then estimated, only estimates that are large enough to pass the test are retained, so the retained estimates are biased away from zero. In stepwise selected models this shows in the distribution of coefficients over subsamples. Many coefficients are exactly zero because the predictor was not selected. Between zero and the lowest selected value there is a gap, since small estimates were not significant and were set to zero. The gap is smaller with a higher p-value (AIC or 0.5) because fewer coefficients are set to zero. The problem is smaller in larger samples.</p>
<h3>How large is the bias, and when?</h3>
<p>A simulation study drew small random subsamples of GUSTO-I and measured the relative bias of coefficients in the selected models, in relation to the events per variable (EPV). The findings:</p>
<ul>
<li>With selection at p &lt; 0.05 the bias was substantial. At EPV = 10 the bias exceeded 50% for 3 predictors.</li>
<li>With selection at p &lt; 0.50 the bias was much smaller. In the full model without selection, the bias was small for reasonable sample sizes (EPV of 10 or more) and at EPV = 3 the absolute bias was below 20% for every predictor.</li>
<li>The bias is related to how often a predictor is selected. A strong predictor such as age is selected in nearly every subsample and has little bias. A weak predictor such as diabetes is selected in only a few subsamples, and when it is selected its coefficient is biased upward by more than 100% at low EPV.</li>
<li>Bias is greatest when the ratio of the true coefficient to its standard error is around 0.6, and falls for both weaker and stronger effects. The standard error shrinks as the sample size grows, so a given effect becomes less biased as the sample grows.</li>
</ul>
<div class="callout eg"><b>Worked example (Book example numbers): true coefficient 1, SE 0.5</b>
<p>If only estimates with p &lt; 0.05 are kept, the estimate must exceed 1.96 × 0.5 = 0.98 in absolute value. The estimates are distributed normally with mean 1 and standard deviation 0.5. P(estimate &gt; 0.98) = P(z &gt; (0.98 − 1) / 0.5) = P(z &gt; −0.04) = 0.516. The lower tail, P(estimate &lt; −0.98) = P(z &lt; −3.96), is negligible. So 52% of estimates are significant. Their average is 1.39, which is 39% above the true value of 1. The "selected" estimates overstate the effect, because the estimates below 0.98 that pull the average down have been discarded. Source: Ch. 5.</p></div>
<div class="callout mch"><b>Illustrative (synthetic): a modest effect of bacteriuria</b><p>Suppose that in reality asymptomatic bacteriuria has a log odds ratio of 0.5 (OR 1.65) for preterm birth, and the sample is so small that the standard error is also 0.5. The estimate will reach p &lt; 0.05 in only about 17% of studies, and when it does, the average reported log odds ratio will be about 1.23 (OR 3.4). Task 1 asks you to derive this.</p></div>
<div data-widget="testimationSim"></div>
<ul class="try">
<li>Keep the default (true coefficient 1, SE 0.5, threshold 0.05) and note the share significant and the percentage bias among significant estimates.</li>
<li>Keep the coefficient and reduce the standard error step by step (a larger sample). Watch the bias fall.</li>
<li>Raise the selection threshold from 0.05 to 0.5 and see how the bias changes. Then look at the plot of mean selected estimate against the ratio β/SE to see where the bias is greatest.</li>
</ul>
<p class="src">Source: Ch. 11, §11.4.2 and §11.4.3, Figs 11.2 to 11.5</p>
`

      html: `
<h3>Misspecified variability</h3>
<p>The standard errors a program prints for the final model assume the model was specified in advance. They ignore the uncertainty about which predictors were selected. Over repeated samples, the distribution of a coefficient can be viewed in two ways. The <b>unconditional</b> view counts a coefficient as zero when the predictor was not selected. The <b>conditional</b> view considers only the samples in which the predictor was selected.</p>
<div class="callout book"><b>Book example: standard errors of coefficients in p &lt; 0.05 selected models, GUSTO-I subsamples</b>
<table class="data">
<tr><th>Standard error</th><th>A65</th><th>Sex</th><th>DIA</th><th>HYP</th><th>HRT</th><th>HIG</th><th>SHO</th><th>TTR</th></tr>
<tr><td>Empirical, unconditional</td><td>0.87</td><td>0.55</td><td>0.53</td><td>0.98</td><td>0.55</td><td>0.77</td><td>1.51</td><td>0.46</td></tr>
<tr><td>Empirical, conditional</td><td>0.52</td><td>0.27</td><td>0.36</td><td>0.47</td><td>0.29</td><td>0.62</td><td>0.75</td><td>0.27</td></tr>
<tr><td>Printed (asymptotic), conditional</td><td>0.57</td><td>0.48</td><td>0.55</td><td>0.61</td><td>0.48</td><td>0.59</td><td>0.88</td><td>0.62</td></tr>
</table>
<p>Source: Ch. 11, Table 11.5. On average the printed standard errors are somewhat larger than the empirical conditional ones but smaller than the unconditional ones, which reflect the possibility that the coefficient was set to zero.</p></div>
<p>For this reason confidence intervals from a stepwise model are of doubtful meaning. The variability of predictions was also studied by bootstrapping, and predictions were far more variable than expected from estimates made as if the model had been pre-specified.</p>
<h3>Exaggerated p-values</h3>
<p>Combining testimation bias with understated variability exaggerates statistical significance. The p-value of a predictor in a stepwise-selected model is computed as if the model were pre-specified, and should generally not be trusted.</p>
<h3>Predictions of worse quality than a full model</h3>
<p>For the sample at hand, dropping weak predictors lowers apparent performance only a little, because they are weak by definition. The question that matters is performance in new patients, evaluated through internal validation (bootstrapping) or external validation. In both, models selected by stepwise methods usually perform worse than a full model without selection.</p>
<div class="callout book"><b>Book example: bootstrap validation of R² in GUSTO-I subsample 5 (n = 429)</b>
<table class="data">
<tr><th>Model</th><th>Apparent</th><th>Bootstrap</th><th>Test</th><th>Optimism</th><th>Optimism-corrected</th></tr>
<tr><td>Full model, 8 predictors</td><td>22.7</td><td>24.7</td><td>17.2</td><td>7.6</td><td>15.1</td></tr>
<tr><td>Stepwise, 3 predictors, p &lt; 0.05</td><td>17.6</td><td>18.7</td><td>12.7</td><td>5.9</td><td>11.7</td></tr>
</table>
<p>R² is Nagelkerke R² in percent. The optimism-corrected value is the apparent value minus the optimism, 22.7 − 7.6 = 15.1 and 17.6 − 5.9 = 11.7. The stepwise model replays the selection in every bootstrap sample. Source: Ch. 11, Table 11.6.</p></div>
<h3>Noise variables</h3>
<p>The argument for stepwise selection is that it removes noise variables, predictors with a true coefficient of zero. Derksen and Keselman found that stepwise selection produced models in which 30% to 70% of the selected predictors were pure noise, when candidates included a mix of noise and real predictors. How many noise variables are included depends on how many were among the candidates and on the correlation between candidates. Stepwise methods are therefore no guarantee for excluding noise variables. Restricting the candidates by subject knowledge reduces the chance that noise predictors are present at all.</p>
<div class="callout book"><b>Book example: adding 9 noise variables in GUSTO-I (test n = 20,318)</b>
<table class="data">
<tr><th></th><th>Model with 17 true predictors</th><th>Same, p &lt; 0.05 selection</th><th>8 true + 9 noise</th><th>Same, p &lt; 0.05 selection</th></tr>
<tr><td>Noise predictors in model</td><td>0</td><td>0</td><td>9</td><td>0.5</td></tr>
<tr><td>True predictors in model</td><td>17</td><td>5.9</td><td>8</td><td>4.8</td></tr>
<tr><td>c statistic in test data</td><td>0.784</td><td>0.762</td><td>0.753</td><td>0.746</td></tr>
</table>
<p>Source: Ch. 11, Table 11.7 (23 large subsamples of GUSTO-I; counts are means). Selection removed almost all the noise (only 0.5 of 9 kept) but also threw away true predictors (only 4.8 of 8 kept), and performed worse than the full model with the noise included.</p></div>
<p>The book draws the conclusion that omitting a true predictor may be far worse than including a noise variable. Ambler and colleagues found stepwise selection with AIC to be the best of the stopping rules in their simulations.</p>
<p class="src">Source: Ch. 11, §11.4.4 to §11.5</p>
`

    {
      id: 's7',
      title: 'Univariable pre-selection and testing within domains',
      html: `
<p>Another common way to choose predictors is to examine each variable's univariable relation with the outcome first, and take forward into the multivariable model only those that meet a criterion such as p &lt; 0.05, p &lt; 0.1, p &lt; 0.2 or p &lt; 0.5. It seems to reduce overfitting and the problems of stepwise selection. The book shows it is just a variant of stepwise selection: in standard backward selection every candidate is considered at every step, whereas with univariable pre-selection only the candidates that passed the first screen are considered thereafter.</p>
<div class="callout key"><b>Hypothetical illustration (Tables 11.8 and 11.9)</b><p>Eight candidates, numbered 1 to 8. With univariable screening, predictors 6, 7 and 8 are lost at the first step. Backward selection then omits 5 and 4, leaving 1, 2, 3. With standard backward selection starting from all eight, predictor 6, which looked insignificant univariably, can remain in the final model with 1, 2 and 3, because the full model judges it together with all the other candidates.</p></div>
<h3>Practical pros and cons</h3>
<ul>
<li><b>Pro:</b> predictors for which no coefficient can be estimated by standard fitting algorithms (for example shock in the very small GUSTO-I subsamples) are eliminated early, and a model can be fitted with the remaining ones.</li>
<li><b>Pro:</b> in a large dataset with many predictors, the computational burden is lower when starting from a "reduced full model".</li>
<li><b>Con:</b> it does not remove any of the problems described in the previous section.</li>
<li><b>Informal screening</b> such as eyeballing relationships between continuous predictors and the outcome, or inspecting cross-tabulations, also uses the outcome relationship and therefore contributes to overfitting.</li>
</ul>
<h3>Testing within domains</h3>
<p>A variant tests the relevance of predictors within a cluster of related variables (a disease domain), for example blood pressure measurements and treatment of hypertension. This has some appeal, but the problems of stepwise selection apply. Some power can be gained by requiring that every domain stays in the final model even if no member is significant after pre-selection. Other approaches combine variables within a cluster (for example mean blood pressure), or pre-select using prior information from other studies.</p>
<p class="src">Source: Ch. 11, §11.6</p>
`

      title: 'Modern selection methods and what to do in practice',
      html: `
<p>A number of newer methods exist. They are computationally intensive and still seldom used in medical applications.</p>
<h3>Bootstrap selection</h3>
<p>Stepwise selection is repeated in many bootstrap samples, the candidates are ranked by their selection frequency, and the predictors selected in more than 50% of bootstrap samples are fitted in the original sample. The evidence for its advantages is unconvincing. The result will generally resemble the stepwise model in the original sample, since a predictor with a low p-value in the original data is chosen frequently in bootstrap samples.</p>
<h3>Bagging and boosting</h3>
<p>Bagging (bootstrap aggregating) builds many versions of a predictor from bootstrap resamples and averages the predictions. It can improve accuracy when small changes in the development data cause large changes in the constructed predictor. Boosting reweights the observations so that those that are difficult to classify count more.</p>
<h3>Bayesian model averaging (BMA)</h3>
<p>Researchers usually ignore the uncertainty of the model-selection step. BMA takes it into account. With p candidate predictors (ignoring interactions) there are up to 2<sup>p</sup> possible models. The averaged estimate is the sum of each model's estimate, weighted by the posterior probability of that model given the data:</p>
<div class="formula">E(β | D) = Σ over models  β<sub>model</sub> × Pr(model | D)</div>
<p>The number of models can be limited by "Occam's window", which discards models far less probable than the best one, for example more than 20 times less likely. In simulations with 25 noise variables and no true predictors, stepwise selection sometimes included two or more noise variables whereas BMA always found none. With two relatively strong predictors and 23 noise variables, stepwise selection included up to 5 noise variables besides the 2 true ones. In the Framingham coronary events data, 12 exploratory variables were available; Occam's window retained 6 of the 8,192 (2<sup>13</sup>) models considered, with 5 or 6 predictors and posterior probabilities between 3% and 65%. The best backward model at p &lt; 0.05 had eight variables, and BMA predicted somewhat better.</p>
<h3>Shrinkage to zero: Lasso</h3>
<p>The <b>Lasso</b> ("least absolute shrinkage and selection operator") maximises the likelihood subject to the sum of the absolute values of the coefficients being bounded by a constant. This shrinks coefficients, some exactly to zero, and so removes predictors. It showed promising results in simulation and when predicting 30-day mortality in GUSTO-I subsamples. Module 10 explains it in more detail.</p>
<div class="callout key"><b>The book's conclusions</b><p>Overfitting begins with considering too many candidate predictors. The standard techniques used by default in medical research, such as stepwise selection, do not solve this problem. The improvements to look for are: limiting the need for selection through subject knowledge, particularly in smaller datasets; better fitting algorithms such as the Lasso; bootstrapping; and Bayesian estimation. The uncertainty of model selection is an important source of overfitting, to be prevented by analysing larger datasets and limiting stepwise use. Faraway's phrase for the problems of data-driven modelling is "the cost of data analysis".</p></div>
<div class="callout mch"><b>Illustrative (synthetic): practical plan for a preterm-birth model</b><p>With 200 events: (1) restrict to about 10 candidates with an obstetrician and a literature review (Module 7); (2) code them in advance (Module 6); (3) fit the full model, check its performance by bootstrap and apply shrinkage (Module 10); (4) if a smaller model is needed for practical reasons, choose the stopping rule, say AIC, and bootstrap the whole selection process to see how much optimism it adds.</p></div>
<p class="src">Source: Ch. 11, §11.7 and §11.8</p>
`

      html: `
<p>Every model in this course has a <b>linear predictor</b> at its core:</p>
<div class="formula">lp = β<sub>1</sub> × x<sub>1</sub> + β<sub>2</sub> × x<sub>2</sub> + … + β<sub>i</sub> × x<sub>i</sub></div>
<p>The β's are <b>main effects</b>. Writing the model this way assumes <b>additivity</b>: the contributions of the predictors are added on the scale of the linear predictor. In logistic regression that scale is the log odds, so the odds ratios e<sup>β</sup> of different predictors are <b>multiplied</b> to obtain the odds of the outcome. In Cox regression, hazard ratios are multiplied in the same way. The assumption, then, is that effects are multiplicative on the odds (or hazard) scale.</p>
<h3>The scale matters</h3>
<p>Consider a treatment that reduces risk from 20% to 10% in a high-risk stratum, and from 10% to 5% in a lower-risk stratum. The relative risk is 0.5 in both. The odds ratios are also similar:</p>
<div class="callout eg"><b>Worked example (book numbers)</b>
<p>Odds at 20% = 0.20 / 0.80 = 0.250; odds at 10% = 0.10 / 0.90 = 0.111; odds at 5% = 0.05 / 0.95 = 0.0526. OR for 20% to 10% = 0.111 / 0.250 = 0.44. OR for 10% to 5% = 0.0526 / 0.111 = 0.47. On the odds scale the effect is nearly constant, so no interaction is needed. On the absolute scale the benefit is 10 percentage points in one stratum and 5 in the other, so the absolute benefit clearly depends on baseline risk.</p></div>
<p>Whether two predictors interact therefore depends on the scale on which the model is written. A model that is additive on the log-odds scale is not additive on the risk scale.</p>
<h3>Interaction terms</h3>
<p>An <b>interaction term</b> is the product of two predictors, x<sub>1</sub> × x<sub>2</sub>, added to the model with its own coefficient. This is a two-way (first-order) interaction. A product of three, x<sub>1</sub> × x<sub>2</sub> × x<sub>3</sub>, is a three-way (second-order) interaction; higher-order interactions are rarely considered. The meaning is that <b>the effect of one predictor depends on the value of another</b>. The effect of a predictor that takes part in an interaction cannot be read alone: you need the value of the other predictor.</p>
<ul>
<li>A <b>quantitative</b> interaction means the effect has the same direction in both groups but a different strength. A <b>qualitative</b> interaction means the effect reverses direction. For interpreting effects, qualitative interactions matter more; for predictive performance the distinction is less relevant.</li>
<li><b>Correlation is not interaction.</b> Some researchers look for interactions between correlated predictors. Correlation says nothing about how the predictors' effects on the outcome depend on each other, and two uncorrelated predictors can interact.</li>
</ul>
<div class="callout mch"><b>Illustrative (synthetic): bacteriuria and tobacco in preterm birth</b><p>Suppose the log odds of preterm birth is −2.0 + 0.8 × bacteriuria + 0.6 × tobacco − 0.5 × (bacteriuria × tobacco). The odds ratio for bacteriuria in non-users of tobacco is e<sup>0.8</sup> = 2.23. In tobacco users it is e<sup>0.8 − 0.5</sup> = e<sup>0.3</sup> = 1.35. The effect of bacteriuria depends on tobacco use. The interaction is quantitative, since both ORs exceed 1.</p></div>
<p class="src">Source: Ch. 12, §12.1</p>
`

<p>As with main effects, prior knowledge should guide which interactions to study. Clinical insight about physiology is of limited help, because a model with main effects only assumes that predictors act multiplicatively on the odds or hazard scale, and it is difficult to reason why two predictors would not act additively on the log-odds scale. Interactions identified in earlier studies could be assessed. The book follows Harrell in listing types of interaction that often warrant consideration:</p>
<table class="data">
<tr><th>Interaction</th><th>Possible meaning</th></tr>
<tr><td>Severity of disease × treatment</td><td>Less benefit with less severe disease</td></tr>
<tr><td>Place × treatment</td><td>Benefit varies by treatment centre</td></tr>
<tr><td>Place × predictors</td><td>Predictor effects vary by centre or region</td></tr>
<tr><td>Calendar time × treatment</td><td>Learning curves for some treatments</td></tr>
<tr><td>Calendar time × predictors</td><td>Increasing or decreasing impact of predictors over the years</td></tr>
<tr><td>Age × predictors</td><td>Older subjects are less affected by risk factors, or more affected by certain disease types</td></tr>
<tr><td>Follow-up time × predictors</td><td>Non-proportional effects in survival, often a decreasing effect over time</td></tr>
<tr><td>Season × predictors</td><td>Seasonal effect of predictors</td></tr>
</table>
<p class="src">Ch. 12, Table 12.1</p>
<h3>Treatment interactions</h3>
<p>The benefit of a treatment may depend on severity: less relative benefit in less severe disease, or the reverse (in oncology, a surgical cure is possible only in patients without distant metastases). Even if the <i>relative</i> benefit is constant, the <i>absolute</i> benefit depends on baseline risk. An analysis of tPA treatment after myocardial infarction in GUSTO-I modelled the absolute benefit as a strong function of the patient's risk profile, assuming a constant relative effect. Treatment effects can also depend on the setting where the patient was treated, as with surgical mortality in oesophageal cancer, and on learning curves, modelled with treatment × calendar time.</p>
<p>In randomised trials, subgroup effects are often reported, for example whether treatment works better in older than younger patients. Such claims should be supported by an <b>interaction test</b> for the difference in effect, not by one p-value in older and another in younger patients. Even pre-specified subgroup analyses need cautious interpretation because of multiple testing, and are best seen as secondary analyses that motivate further study.</p>
<h3>Place and time</h3>
<p>Predictor definitions and effects may differ between centres and over time, which limits generalisability (Module 14). Studies of traumatic brain injury found predictor effects surprisingly consistent even when definitions varied across studies, and in GUSTO-I, where data collection was standardised, predictor × place interactions were small.</p>
<p>"Time" has several forms: calendar time, patient age and follow-up time. In survival analysis it is usual to assume proportional effects over follow-up (the Cox model). This assumption is equivalent to assuming no interaction between the predictors and follow-up time. It may fail, for example in breast cancer, where the effect of stage of disease was absent beyond 10 years.</p>
<div class="callout book"><b>Book example: 25 years of mechanical valve replacement (1,449 valves)</b><p>Early mortality (&lt;30 days) was 5%. Survival at 5, 10 and 15 years was 80%, 63% and 49%. A Poisson regression model was used to disentangle the effects of calendar time, age and follow-up time. There was a substantial drop in early and late mortality around the introduction of cardioplegia, but no strong interaction with calendar time. For several predictors the effects were non-proportional: older age, urgent operation, ascending aorta surgery, operation in an earlier calendar year, male sex and previous cardiac surgery were more important in the early years of follow-up, whereas concomitant bypass surgery and mitral valve surgery had more or less constant effects. Source: Ch. 12, §12.1.4.</p></div>
<p class="src">Source: Ch. 12, §12.1.1 to §12.1.4</p>

<p>Ten binary predictors allow 10 × 9 / 2 = 45 interactions and about 2 significant results are expected even if the truth is perfect additivity.</p></div>

<h3>Two ways to limit the multiple-testing problem</h3>
<ol>
<li><b>Overall interaction test.</b> First test all interactions of one predictor (for example all interactions with age) together in one test with several df. If that test is not significant, stop; if it is, examine specific interactions. This limits multiple testing at the price of lower power for any single interaction.</li>
<li><b>A stringent p-value</b> for individual interaction tests, for example 0.01.</li>
</ol>
<div class="callout book"><b>Book example: age interactions in GUSTO-I subsample (n = 785, 52 deaths)</b><p>All interactions with age were fitted and tested together with a Wald test: p = 0.14, not significant. Yet one of them, age × tachycardia (heart rate above 80, HRT), had p = 0.03, not adjusted for the many tests. Someone looking only at individual tests would be tempted to include it. The estimated interaction was positive: the effect of age on mortality was stronger in patients with tachycardia, equivalently tachycardia appeared more harmful at higher ages. Source: Ch. 12, §12.2.1.</p></div>

<h3>Smart coding</h3>
<p>The standard way to include an interaction is the product term x<sub>1</sub> × x<sub>2</sub>, together with both main effects. The estimated pattern can be counterintuitive. In the age × tachycardia example, the fitted lines (log odds of death against age) cross at about 55 years: tachycardia looks protective below that age, which is implausible. The book suggests incorporating subject-specific knowledge to avoid keeping noise: code the interaction so that no tachycardia effect is allowed below age 55. This cut-point is itself data-driven, but the aim is to avoid a biologically implausible effect. The alternatives are:</p>

<li>(a) main effects only (parallel lines);</li>
<li>(b) the simple interaction (lines that cross);</li>
<li>(c) separate age effects for patients aged under 55 (no tachycardia effect) and for those aged 55 and over, with and without tachycardia (three age slopes);</li>

<p>Models (c) and (d) are barely different in fit but (d) uses fewer parameters. A smart coding also makes it easier to obtain standard errors and confidence intervals for predictors in interaction with others.</p>
