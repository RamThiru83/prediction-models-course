<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="CliPr: a self-contained course on developing and validating clinical prediction models, with maternal and child health examples. All data are synthetic."><style>:root{color-scheme:light dark}body{margin:0;font-size:14px}</style></head><body><title>CliPr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22%239A3029%22/%3E%3Cpath d=%22M10 48 H54%22 stroke=%22%23fff%22 stroke-opacity=%22.5%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M10 18 L40 48%22 stroke=%22%23F2B84B%22 stroke-width=%225%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M10 18 C 24 9%2C 38 14%2C 45 30 C 48 38%2C 50 44%2C 54 48%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%226.5%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2210%22 cy=%2218%22 r=%224.5%22 fill=%22%23F08A24%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: fixed contents rail on the left, one reading column on the right; the rail becomes a drop-down sheet on phones. */
:root {
  --bg: #FAFAF9; --surface: #FFFFFF; --ink: #1C1A1E; --muted: #5E5A57; --line: #E6E3DF; --line2: #EFEDEA;
  --accent: #9A3029; --accent-ink: #ffffff; --accent-soft: #F6E9E6; --plot: #FAFAF9;
  --c1: #9A3029; --c2: #D0701A; --c3: #2C4A7A; --c4: #B8892A;
  --good: #1a7f4b; --good-soft: #e3f4ea; --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fcf1d9;
  --mch: #0d6b61; --mch-soft: #e2f3f0; --book: #5a4a8a; --book-soft: #eeeaf8; --eg: #3a4660; --eg-soft: #eceff5;
  --hl: #ffe98a; --hl-ink: #161b24;
  --chrome: #F3F2EF; --active: #E7E4DF;
  --learn: #2C4A7A; --practise: #B85E12; --check: #94701C; --answer: #9A3029;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-head: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --surface: #171717; --ink: #EDEBE8; --muted: #B4B0AC; --line: #2E2E2E; --line2: #232323;
    --accent: #EC8B78; --accent-ink: #1C1214; --accent-soft: #3A2421; --plot: #141414;
    --c1: #EC8B78; --c2: #F5A04A; --c3: #9AAED6; --c4: #F2C46A;
    --good: #5fd18f; --good-soft: #14281d; --bad: #ff8f86; --bad-soft: #301917; --warn: #f0c36a; --warn-soft: #2d2411;
    --mch: #62d1c2; --mch-soft: #10262a; --book: #b9a8f0; --book-soft: #221d36; --eg: #aab7d6; --eg-soft: #1a2030;
    --hl: #6b5a14; --hl-ink: #f3ecd0;
    --chrome: #0C0C0C; --active: #2A2A2A;
    --learn: #9AAED6; --practise: #F5A04A; --check: #F2C46A; --answer: #EC8B78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --surface: #171717; --ink: #EDEBE8; --muted: #B4B0AC; --line: #2E2E2E; --line2: #232323;
  --accent: #EC8B78; --accent-ink: #1C1214; --accent-soft: #3A2421; --plot: #141414;
  --c1: #EC8B78; --c2: #F5A04A; --c3: #9AAED6; --c4: #F2C46A;
  --good: #5fd18f; --good-soft: #14281d; --bad: #ff8f86; --bad-soft: #301917; --warn: #f0c36a; --warn-soft: #2d2411;
  --mch: #62d1c2; --mch-soft: #10262a; --book: #b9a8f0; --book-soft: #221d36; --eg: #aab7d6; --eg-soft: #1a2030;
  --hl: #6b5a14; --hl-ink: #f3ecd0;
  --chrome: #0C0C0C; --active: #2A2A2A;
  --learn: #9AAED6; --practise: #F5A04A; --check: #F2C46A; --answer: #EC8B78;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--chrome); color: var(--ink); font-variant-numeric: tabular-nums; font-family: var(--f-body); font-size: 16px; line-height: 1.62; margin: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* shell */
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto; background: var(--chrome); padding: 18px 14px 28px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: block; text-decoration: none; color: var(--ink); padding: 2px 6px 14px; margin-bottom: 6px; }
.brand b { font-family: var(--f-head); font-size: 19px; font-weight: 400; line-height: 1.2; display: block; }
.brand span { font-size: 12.5px; color: var(--muted); }
.navgrp { margin: 22px 0 4px; padding: 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.nav a { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: baseline; gap: 4px; padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.35; }
.nav a:hover { background: var(--line2); } .nav a { border-radius: 8px; }
.nav a[aria-current="page"] { background: var(--active); color: var(--ink); font-weight: 500; }
.nav .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.nav .dn { color: var(--good); font-size: 12px; text-align: right; }
.main { padding: 32px max(20px, env(safe-area-inset-right, 0px)) 80px 40px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin: 8px 8px 8px 0; min-height: calc(100vh - 16px); }
.col { max-width: 780px; margin: 0 auto; min-width: 0; }
.topbar { display: none; }

@media (max-width: 900px) {
  .shell { display: block; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--chrome); border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); }
  .topbar b { font-family: var(--f-head); font-size: 16px; }
  .rail { display: none; position: fixed; z-index: 25; inset: 0; top: calc(48px + env(safe-area-inset-top, 0px)); height: auto; width: auto; border-right: 0; }
  .rail.open { display: block; }
  .main { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 70px max(16px, env(safe-area-inset-left, 0px)); margin: 0; border: 0; border-radius: 0; min-height: 0; }
  body { background: var(--surface); }
}
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px; line-height: 1.3; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }

/* headings and prose */
.eyebrow { font-size: 14px; color: var(--muted); font-weight: 500; margin: 0 0 6px; }
h1 { font-family: var(--f-head); font-weight: 400; font-size: clamp(27px, 4.4vw, 38px); line-height: 1.16; margin: 0 0 10px; text-wrap: balance; }
h2 { font-family: var(--f-head); font-weight: 400; font-size: 24px; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; }
h3 { font-size: 17.5px; margin: 24px 0 6px; line-height: 1.3; }
h4 { font-size: 15px; margin: 18px 0 4px; }
p { margin: 0 0 13px; } ul, ol { margin: 0 0 13px; padding-left: 22px; } li { margin-bottom: 4px; }
.lede { color: var(--muted); font-size: 17px; margin-bottom: 16px; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--muted); margin: 10px 0 22px; }
.meta b { color: var(--ink); font-weight: 500; }
.sec { padding: 26px 0 8px; border-top: 1px solid var(--line); margin-top: 18px; }
.sec:first-of-type { border-top: 0; }
.sec > p, .sec > ul, .sec > ol { max-width: 68ch; }
.src { font-size: 12.5px; color: var(--muted); font-family: var(--f-mono); margin-top: -4px; }
code, .m { font-family: var(--f-mono); font-size: .9em; }
code { background: var(--line2); padding: 1px 5px; border-radius: 4px; }
.m { white-space: nowrap; }
.formula { font-family: var(--f-mono); font-size: 14.5px; background: var(--bg); border: 0; padding: 10px 14px; margin: 12px 0 16px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.callout { border: 0; border-radius: 10px; padding: 13px 16px 5px; margin: 16px 0 18px; background: var(--bg); }
.callout > b:first-child { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.callout.key { background: var(--bg); } .callout.key > b:first-child { color: var(--ink); }
.callout.warn { background: var(--bad-soft); } .callout.warn > b:first-child { color: var(--bad); }
.callout.mch { background: var(--mch-soft); } .callout.mch > b:first-child { color: var(--mch); }
.callout.book { background: var(--book-soft); } .callout.book > b:first-child { color: var(--book); }
.callout.eg { background: var(--eg-soft); } .callout.eg > b:first-child { color: var(--eg); }
.tw { overflow-x: auto; margin: 12px 0 16px; max-width: 100%; }
table { border-collapse: collapse; font-size: 14.5px; }
table.data { min-width: 60%; } table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
table.data th { font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 2px solid var(--line); background: var(--surface); }
table.data td.r, table.data th.r { text-align: right; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
[data-live] { font-family: var(--f-mono); font-size: .92em; background: var(--accent-soft); padding: 0 4px; border-radius: 3px; white-space: nowrap; }
ul.try { list-style: none; padding: 10px 14px; margin: 0 0 18px; border: 1px dashed var(--line); border-radius: 4px; background: var(--surface); }
ul.try::before { content: "Try this"; display: block; font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
ul.try li { position: relative; padding-left: 16px; } ul.try li::before { content: "\2192"; position: absolute; left: 0; color: var(--accent); }
figure { margin: 14px 0; overflow-x: auto; }

/* widgets */
.wg { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 18px 0 10px; overflow: hidden; }
.wg-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; background: var(--line2); border-bottom: 1px solid var(--line); }
.wg-h b { font-size: 14px; color: var(--muted); }
.wg-c { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 18px; padding: 12px 14px 4px; }
.ctl { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 13.5px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.ctl label output { color: var(--ink); font-family: var(--f-mono); font-size: 13px; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.ctl select, .ctl input[type=number], .ctl input[type=text], .ctl input[type=search] { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 5px 8px; min-width: 0; width: 100%; }
.ctl.chk { flex-direction: row; align-items: center; gap: 8px; padding-top: 18px; } .ctl.chk label { color: var(--ink); }
.wg-b { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 14px 10px; align-items: center; }
.wg-o { padding: 6px 14px 14px; min-width: 0; }
.wg-o .note { font-size: 13.5px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin: 10px 0; }
.stat { border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--bg); }
.stat small { display: block; font-size: 13px; color: var(--muted); }
.stat b { font-family: var(--f-mono); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.verdict { padding: 8px 12px; border-radius: 5px; background: var(--accent-soft); font-size: 14.5px; margin: 8px 0; }
.verdict.bad { background: var(--bad-soft); } .verdict.good { background: var(--good-soft); } .verdict.warn { background: var(--warn-soft); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.ax { font-size: 11px; fill: var(--muted); font-family: var(--f-body); } .axl { font-size: 12px; fill: var(--ink); font-family: var(--f-body); } .axt { font-size: 13px; fill: var(--ink); font-weight: 600; font-family: var(--f-body); }
.prog { height: 6px; background: var(--line2); border-radius: 3px; overflow: hidden; margin: 6px 0; } .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.hbars .hb { display: grid; grid-template-columns: 130px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 13px; margin: 2px 0; }
.hbt { height: 10px; background: var(--line2); border-radius: 2px; overflow: hidden; } .hbt i { display: block; height: 100%; background: var(--c1); } .hbv { font-family: var(--f-mono); text-align: right; }
.hbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl-s { font-size: 13px; } .tbl-s td, .tbl-s th { padding: 4px 8px; }
.scroll { overflow: auto; max-height: 340px; border: 1px solid var(--line); border-radius: 5px; }

/* quiz and tasks */
.q { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px 16px 10px; margin: 12px 0; }
.q .qt { font-weight: 600; margin-bottom: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 12px; margin: 6px 0; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt .k { font-family: var(--f-mono); color: var(--muted); }
.opt.right { background: var(--good-soft); border-color: var(--good); } .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.why { margin-top: 8px; padding: 8px 12px; background: var(--bg); font-size: 14.5px; border-radius: 8px; }
.task { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px 18px 8px; margin: 14px 0; }
.task h3 { margin-top: 0; } .lvl { display: inline-block; font-size: 12.5px; background: var(--line2); border-radius: 10px; padding: 1px 9px; color: var(--muted); font-weight: 600; margin-left: 6px; vertical-align: middle; }
details.ans { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 10px 0; }
details.ans > summary { cursor: pointer; padding: 10px 16px; font-weight: 600; } details.ans[open] > summary { border-bottom: 1px solid var(--line); }
details.ans > div { padding: 12px 18px 4px; }
.kp li { margin-bottom: 6px; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 12px 0 26px; }
.card { display: block; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 12px 14px; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card small { color: var(--muted); font-size: 12.5px; display: block; } .card b { display: block; font-size: 15px; line-height: 1.3; margin: 2px 0; } .card span { font-size: 13.5px; color: var(--muted); }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 12px; margin: 6px 0 14px; }
.gl p { padding: 4px 0; border-bottom: 1px solid var(--line2); margin: 0; }
.foot { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 70ch; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 36px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .prog i { transition: none; } }
@media (max-width: 700px) { table.data { display: block; overflow-x: auto; max-width: 100%; } }
@media (max-width: 700px) { .m { white-space: normal; overflow-wrap: anywhere; } }

/* ===== accounts, annotation, instructor tools ===== */
.acct { display: grid; gap: 3px; padding: 10px 6px 12px; border-bottom: 1px solid var(--line2); margin-bottom: 8px; font-size: 13px; }
.acct small { color: var(--muted); font-size: 12px; } .acct .acts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.acct a:not(.btn) { color: var(--accent); } .acct .btn { justify-self: start; } .edtog { font-size: 12.5px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.nav a.lk { opacity: .55; } .nav .dn { font-size: 11px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 16px; }
.tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; font: inherit; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.form { display: grid; gap: 12px; max-width: 460px; margin: 10px 0 18px; }
.form label, .myans label { display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
.form input[type=text], .form input[type=email], .form input[type=password], .form input[type=date], .form textarea, .form select, .myans textarea, .note-card textarea, select#lsel {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
select#lsel { width: auto; max-width: 100%; }
.form input:focus, .form textarea:focus, .myans textarea:focus, .note-card textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.form .chk { display: flex; gap: 8px; align-items: flex-start; } .form .chk input { margin-top: 4px; }
.msg { margin: 0; font-size: 13.5px; min-height: 1.2em; } .msg.bad { color: var(--bad); } .msg.ok { color: var(--good); }
.card-plain { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 16px; margin: 12px 0; }
.myans { margin: 12px 0 14px; } .myans label { font-weight: 600; color: var(--ink); } .myans label .sv, .note-card .sv { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 8px; }
.myans textarea, .note-card textarea { resize: vertical; line-height: 1.5; }
.note-card { border-left: 3px solid var(--c2); background: var(--surface); border-radius: 0 6px 6px 0; padding: 8px 12px 8px; margin: 8px 0 14px; max-width: 70ch; }
.note-card .nq { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-style: italic; } .note-card .nf { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.fb { border-left: 3px solid var(--good); background: var(--good-soft); border-radius: 0 6px 6px 0; padding: 6px 12px; margin: 8px 0; } .fb p { margin: 4px 0; } .fb small { color: var(--muted); }
mark.hl { background: var(--hl); color: var(--hl-ink); border-radius: 2px; padding: 0 1px; }
.seltb { position: fixed; z-index: 60; display: flex; gap: 2px; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.seltb[hidden] { display: none; } .seltb button { border: 0; background: none; color: inherit; font: inherit; font-size: 13.5px; padding: 6px 10px; border-radius: 5px; cursor: pointer; } .seltb button:hover { background: rgba(127,127,127,.3); } .seltb button[hidden] { display: none; }
.secbar { margin: -4px 0 10px; } .btn.ghost { background: none; border-color: transparent; color: var(--muted); } .btn.ghost:hover { border-color: var(--line); color: var(--accent); }

App.pageHome = function () {
  var mods = App.mods_sorted(), done = mods.filter(function (m) { return App.prog.done[m.id]; }).length;
  var h = '<p class="eyebrow">Self-study course for clinical researchers</p><h1>Developing and validating clinical prediction models</h1>' +
    '<p class="lede">How to build a model that estimates an individual patient’s risk, show whether it works, and judge whether it is useful, taught with maternal and child health examples and data you can analyse in the browser.</p>' +
    '<div class="callout key"><b>How the course works</b><p>Each module teaches one stage of model development or validation from first principles: the idea, the formula, a worked example, and the pitfalls. Interactive simulators let you see the effect of sample size, missing data, selection and shrinkage rather than take it on trust. Each module ends with a quiz, three case tasks, and worked answers placed at the end so that you attempt the tasks first.</p></div>' +
    '<p>The method follows the framework in E. W. Steyerberg, <i>Clinical Prediction Models</i> (2009), chapters 1 to 19 (development and validation). The course is self-contained: no other text is needed. Model updating and the book’s case studies are outside its scope.</p>' +
    '<p>All datasets are <b>synthetic</b>. They describe no real person and were generated from known rules, so you can check what an analysis should recover.</p>';
  h += '<div class="prog" aria-hidden="true"><i style="width:' + (100 * done / mods.length).toFixed(0) + '%"></i></div><p class="num" style="color:var(--muted);font-size:14px">' + done + ' of ' + mods.length + ' modules marked complete (stored in this browser only).</p>';
  h += '<h3>Start where you are</h3><div class="home-grid">';
  h += App.homeBanner();
  var p0 = App.byId.p0, m01 = App.byId.m01;
  if (p0) h += '<a class="card" href="#p0"><small>Optional primer</small><b>' + p0.title + '</b><span>Odds, regression, test accuracy and sampling variability, for those who want a refresher first.</span></a>';
  if (m01) h += '<a class="card" href="#m01"><small>Main course</small><b>Module 1: ' + m01.title + '</b><span>The overall roadmap. Start here if you are comfortable with regression.</span></a>';
  h += '<a class="card" href="#datasets"><small>Practice material</small><b>Synthetic datasets</b><span>Preterm birth, neonatal sepsis and gestational diabetes data, with codebooks and CSV download.</span></a>';
  h += '<a class="card" href="#mastery"><small>Self-test</small><b>Mastery check</b><span>A mixed quiz drawn from every module, with a list of modules to revisit.</span></a></div>';
  [['Development', 'Development: building the model'], ['Validation', 'Validation and use']].forEach(function (g) {
    h += '<h3>' + g[1] + '</h3><div class="home-grid">';
    mods.filter(function (m) { return m.part === g[0]; }).forEach(function (m) { h += '<a class="card" href="#' + m.id + '"><small>Module ' + App.modLabel(m) + ' · ' + m.book + ' · ~' + m.minutes + ' min' + (App.lockInfo(m) ? ' · locked' : (App.prog.done[m.id] ? ' · done' : '')) + '</small><b>' + m.title + '</b><span>' + m.summary + '</span></a>'; });
    h += '</div>';
  });
  var cap = App.byId.cap; if (cap) h += '<h3>Capstone</h3><div class="home-grid"><a class="card" href="#cap"><small>Guided project</small><b>' + cap.title + '</b><span>' + cap.summary + '</span></a></div>';
  return { html: h };
};
App.pageAbout = function () {
  return { html: '<p class="eyebrow">About</p><h1>About this course</h1>' +
    '<h3>Purpose and audience</h3><p>The course is for MSc and PhD clinical researchers who will develop, validate or critically appraise a prediction model. It assumes you know basic epidemiology and what a regression model is. The primer covers the rest.</p>' +
    '<h3>Source and scope</h3><p>The principles taught here are those of E. W. Steyerberg, <i>Clinical Prediction Models: A Practical Approach to Development, Validation, and Updating</i> (Springer, 2009), chapters 1 to 19. Updating a model for a new setting (chapters 20 and 21) and the book’s case studies (chapters 22 to 24) are not covered. Exercises and tasks draw on wider experience, but the methodological principles stay within the book. Numbers quoted from the book’s own examples are labelled <b>Book example</b>. Maternal and child health illustrations are labelled <b>Illustrative (synthetic)</b>.</p>' +
    '<h3>Synthetic data</h3><p>Every dataset is simulated in your browser from stated rules. No participant data are used anywhere. The generating rules are revealed in the answers so that you can see how well an analysis recovers the truth. Because the data are simulated, effect sizes and performance figures show how methods behave and must not be read as clinical findings.</p>' +
    '<h3>Interactive elements</h3><p>Simulators run in your browser. Results vary with the random seed and, in some tools, differ slightly between runs. Heavier tools run in short steps with a progress bar. Without an account, your quiz answers, notes and module completion marks stay in this browser. With an account (join code from your instructor) they follow you across devices, and your instructor can see your progress, notes and answers.</p>' +
    '<h3>Limits</h3><p>The course teaches methods for logistic-regression-based prediction of binary outcomes. Survival models and other outcome types are mentioned only where the source treats them. Model development for real clinical use needs a protocol, appropriate data governance and ethics review, which this course does not replace.</p>' };
};
App.pageDatasets = function () {
  var h = '<p class="eyebrow">Practice material</p><h1>Synthetic datasets</h1><p class="lede">Four simulated maternal and child health datasets. Download the CSV and codebook to analyse in any software, or use the Analysis Lab in the course. All values are simulated; blank cells are missing values.</p>';
  ['ptb_dev', 'ptb_val', 'sepsis', 'gdm'].forEach(function (id) { h += '<div data-widget="datasetCard" data-set="' + id + '"></div>'; });
  return { html: h };
};

  h += '<h2>Working through the course</h2><ol class="steps">' +
    '<li><b>Choose a starting point.</b> The primer covers odds, regression, test accuracy and sampling variability; skip it if you are comfortable with these. Modules 1 to 10 cover development, modules 11 to 15 validation and use, and the capstone brings everything together on a preterm birth model.</li>' +
    '<li><b>Read the module, then play with it.</b> Each module explains the idea, shows the formula and a worked example, and has simulators that let you change sample size, missing data, selection or shrinkage and see the effect.</li>' +
    '<li><b>Answer the quiz before the explanations.</b> Pick an answer; the explanation appears straight after. Your first attempt is recorded separately from later ones, so you can see what you knew before the feedback.</li>' +
    '<li><b>Try the three case tasks.</b> Write your own answer in the box under each task, then compare it with the worked answer at the end of the module.</li>' +
    '<li><b>Mark the module complete</b> when you are done, then use the Mastery check, a mixed quiz drawn from every unlocked module, to find the modules to revisit.</li></ol>';
  h += '<h2>Tools for study</h2><ul>' +
    '<li><b>Datasets</b> holds synthetic preterm birth, neonatal sepsis and gestational diabetes data with codebooks, as CSV downloads. They describe no real person.</li>' +
    '<li><b>Glossary, formula sheet, seven-step checklist and chapter map</b> are at the foot of the contents list.</li>' +
    '<li>The course runs in any modern browser, in light or dark mode, on a phone or a computer.</li></ul>';
  h += '<h2>Your account and your own notes</h2><p>The course works without an account, and then your progress stays in this browser only. If you are taking it as part of a class, open <a href="#account">Account</a>, choose Join with a code, and enter the code from your instructor. Your progress, notes and answers then follow you across devices, and your instructor can see them. Anything you did as a guest is merged into your account.</p>' +
    '<ul><li><b>Highlight.</b> Select any text in a module; a small bar offers Highlight, Note, and Remove highlight.</li>' +
    '<li><b>Note on a section.</b> Use the "Note on this section" link under a heading. Notes can be edited or deleted at any time.</li>' +
    '<li><b>Task answers.</b> Your written answers save automatically as you type. If your instructor replies, the feedback appears under your answer.</li>' +
    '<li><b>My notes and answers</b> collects all of it in one place, with options to copy it or download it as a Markdown file.</li>' +
    '<li><b>Ask your instructor</b> opens a WhatsApp message to your instructor, if one has been set up for your class.</li></ul>';

      '<li><b>Edit course text.</b> Tick the box in the contents panel, open any module or reference page, click into any text (headings, paragraphs, list items, table cells, formulas, objectives, the story, quiz questions, options and explanations), change it, and Save. Text that appears on several steps, such as the story, changes everywhere at once. The edit is published to every learner at once. Revert this page restores the original. Edits to text that was later changed in a new version of the course are flagged as outdated under Course text.</li>' +
      '<li><b>Setup</b> is where join codes are created or switched off, and where the WhatsApp number for Ask your instructor is set.</li></ul>' +
      '<p>Learner data are for teaching only. Using them for research needs ethics approval and separate consent.</p>';

<div class="formula">odds after the test = odds before the test × LR</div>
<p>This is <b>Bayes' rule</b>. Written on the log-odds scale it is exactly a logistic model with one yes/no predictor: the intercept is the log-odds after a negative test, and the coefficient is ln(LR+ ÷ LR−). The odds ratio LR+ ÷ LR− belongs to the test; the intercept belongs to the setting, and changes when the condition is more or less common.</p>
<p><b>Several tests.</b> It is tempting to multiply the LRs of several findings one after another. This is <b>naive Bayes</b>, and it is right only if the findings are unrelated once we know who has the condition. Usually they are linked: a short cervix and a positive swab test often occur together, so the second adds less once the first is known. Multiplying counts the shared information twice. Risks come out too high for high-risk women and too low for low-risk women. A multivariable logistic model estimates the joint effects properly.</p>`,

    {
      id: 's1',
      title: 'What you see may not be what you get',
      html: `
<p>We develop a model on a <b>sample</b> of patients only because the sample represents an underlying <b>population</b>. The model is useful if it predicts well for <b>new</b> patients from that population. The danger is that the model describes the sample very well, including its chance peculiarities, while its predictions do not generalise. This is <b>overfitting</b>.</p>
<p>For prediction models, overfitting can be defined precisely as fitting a model with too many <b>degrees of freedom in the modelling process</b>. Degrees of freedom are used not only by estimating coefficients but also by every data-driven decision about the model's structure: selecting predictors from a larger list of candidates, choosing how to code them, searching for cut-points, and trying non-linear transformations or interactions.</p>
<div class="formula">Optimism = apparent performance − true performance</div>
<ul>
<li><b>Apparent performance</b>: performance measured in the same sample that was used to develop the model.</li>
<li><b>True performance</b>: performance in the underlying population, that is, in new patients like those in the sample.</li>
<li><b>Optimism</b>: the gap between the two. With overfitting, apparent performance is better than true performance; the book's phrase is "what you see may not be what you get". The book defines optimism as the difference between true and apparent performance; written as above it is a positive number: the amount by which the apparent result flatters the model.</li>
</ul>
<table class="data">
<thead><tr><th>Issue</th><th>What it means</th></tr></thead>
<tbody>
<tr><td colspan="2"><b>Causes of overfitting</b></td></tr>
<tr><td>Model uncertainty</td><td>The structure of the model is not prespecified but determined by the data under study (for example, which predictors are kept).</td></tr>
<tr><td>Parameter uncertainty</td><td>Even with a fixed structure, each coefficient is estimated with error, which makes predictions too extreme.</td></tr>
<tr><td colspan="2"><b>Consequences of overfitting</b></td></tr>
<tr><td>Testimation bias</td><td>Effects of predictors are overestimated because they were selected after passing a statistical test.</td></tr>
<tr><td>Optimism</td><td>Performance in new patients is worse than in the development sample.</td></tr>

<p>The simplest example of overfitting involves no regression at all: predicting an outcome rate by unit (hospital, clinic, district) from the rate observed in that unit.</p>
<h3>Variability within one unit</h3>
<p>Suppose every patient has the same true risk of 10%. The number of events in a sample of n patients then follows a <b>binomial distribution</b>. With n = 20, the expected number of events is 2, but only about 28.5% of samples will show exactly 2 events (an observed rate of 10%). About 12% of samples will show 0 events (0%), and about 13% will show 4 or more (20% or higher). With n = 200, about 71% of samples give an observed rate between 8% and 12%.</p>
<div data-widget="samplingDemo"></div>
<ul class="try">
<li>Keep the true risk at 12%, set n = 20 and press "Draw 200 samples". Note how wide the 2.5–97.5 percentile range of observed risk is.</li>
<li>Increase n to 200 and then 1,000 and repeat. Observe how the range narrows as n increases.</li>
</ul>
<h3>Variability between units</h3>
<div class="callout book"><b>Book example: oesophagectomy mortality</b><p>For surgical resection of the oesophagus, 30-day mortality in a large registry was 221 of 2,031 patients (10.9%). Simulating 100 centres with 20 patients each and a true mortality of 10% everywhere, about 12% of centres would report 0% mortality and 13% would report 20% or more, purely by chance.</p></div>
<p>If true rates do differ between units, the spread of true rates is described by a <b>heterogeneity</b> parameter τ (tau), the standard deviation of the true rates. With τ = 2%, 95% of centres have true mortality between 6% and 14%. The observed rates are then spread more widely than the binomial alone would produce, but they are still spread far more widely than the true rates when each centre has few patients.</p>
<div class="callout key"><b>Key idea: shrinkage</b><p>Each centre's observed rate is an unbiased estimate of that centre's true rate, yet the set of observed rates is too extreme: the lowest observed rates are, on average, too low and the highest too high. This is <b>regression to the mean</b>. Better predictions are obtained by <b>shrinking</b> each unit's estimate towards the overall mean, more strongly when units are small and when true heterogeneity is small. With 200 patients per centre the problem is much reduced.</p></div>
<div class="callout mch"><b>Illustrative (synthetic)</b><p>A state ranks 100 primary health centres by their postpartum haemorrhage rate, each based on about 20 deliveries per quarter. The "worst" ten centres this quarter will, on average, look better next quarter without any intervention, and the "best" ten will look worse. A quality-improvement programme evaluated only in the worst centres would appear to work even if it did nothing.</p></div>

      id: 's3',
      title: 'Model uncertainty and testimation bias',
      html: `
<p>Most analyses search for the model structure in the data and then report results as if the final model had been specified in advance. The uncertainty created by the search, <b>model uncertainty</b>, is ignored. Its main result is a form of selection bias: here "selection" means selection of predictors, not of patients.</p>
<h3>Noise predictors</h3>
<p>Suppose 20 candidate predictors are pure noise (true coefficients zero). At p &lt; 0.05, on average one of them will be statistically significant (20 × 0.05 = 1). Its estimated effect will necessarily be relatively large, positive or negative, otherwise it would not have been significant. If we keep it, the model contains a spurious effect of considerable size.</p>
<h3>True predictors: testimation bias</h3>
<p>For a true predictor, the estimate varies from sample to sample around the true value. If we include the predictor only when its estimate is large enough to pass a test, the estimates we keep are, on average, too large. Because we <b>test</b> before we <b>estimate</b>, this is called <b>testimation bias</b>. Formally: if b is significant, use b; otherwise set b = 0.</p>
<div class="callout eg"><b>Worked example: true coefficient 1, standard error 0.5 (book example)</b>
<ol>
<li>Two-sided significance at p &lt; 0.05 requires |b| &gt; 1.96 × 0.5 = 0.98.</li>
<li>The estimate b is approximately normal with mean 1 and SD 0.5. P(b &gt; 0.98) = P(Z &gt; (0.98 − 1)/0.5) = P(Z &gt; −0.04) = 0.516. P(b &lt; −0.98) is negligible. So about 52% of studies would find the predictor significant.</li>
<li>The mean of the estimates in those 52% of studies is 1.39 (the mean of a normal distribution truncated below at 0.98).</li>
<li>Bias = (1.39 − 1)/1 = +39%. Half the time the predictor is dropped altogether; the other half its effect is overestimated by about 40%.</li>
</ol>
<p>For a weaker predictor (true coefficient 0.5, SE 0.5) only about 17% of samples are significant and their mean estimate is about 1.23, more than double the truth.</p></div>
<div data-widget="testimationSim"></div>
<ul class="try">
<li>With the defaults (β = 1, SE = 0.5, p = 0.05), compare the share significant and the mean estimate among significant results with the book's 52% and 1.39.</li>
<li>Reduce the SE to 0.2 (a larger study). Note how the bias almost disappears because nearly every sample is significant.</li>
<li>Return to SE = 0.5 and change the selection threshold to p = 0.20 and then p = 0.50. Observe how a more liberal threshold reduces the bias.</li>
<li>Look at the plot of mean selected estimate against β/SE and identify where bias is largest.</li>
</ul>
<p>Testimation bias is small when effects are strong relative to their SE (large samples, strong predictors), and it is absent when the model is <b>prespecified</b> (the "full model": all candidate predictors kept regardless of significance).</p>
<h3>Other data-driven decisions that create the same bias</h3>
<ul>
<li>Choosing an "optimal" cut-point for a continuous predictor, such as the Hb value that best separates preterm and term births.</li>
<li>Testing transformations, for example adding a square term and keeping it only if significant.</li>
<li>Merging categories that appear to have similar outcomes.</li>
<li>Informal versions of all of these: looking at plots of outcome against several codings and picking the one that looks best.</li>
</ul>
<p class="src">Source: Ch. 5, §5.2.1–5.2.2, Fig. 5.5</p>`

      id: 's4',
      title: 'Parameter uncertainty: why even prespecified models overfit',
      html: `
<p>Suppose the model structure is fully prespecified. Standard estimation (least squares, maximum likelihood) gives nearly unbiased estimates of each coefficient. Surprisingly, the <b>predictions</b> are still too extreme when several predictors are combined.</p>
<p>The intuition: the linear predictor is a sum of coefficient × value terms, and every coefficient carries estimation error. Patients who end up with the highest linear predictors are disproportionately those for whom the errors happened to push upwards; the lowest are those pushed downwards. On average, low predictions are too low and high predictions are too high in new patients. This is again <b>regression to the mean</b>.</p>
<div class="callout key"><b>Key idea: shrinkage and the bias–variance trade-off</b><p>Shrinking coefficients towards zero introduces bias in each coefficient but reduces the variance of predictions. If shrinkage is chosen well, the gain in precision more than offsets the bias. That biased estimates can give better predictions is related to <b>Stein's paradox</b>. The bias–variance trade-off runs through all of prediction modelling; methods for shrinkage are covered in a later module.</p></div>
<h3>How overfitting shows in new patients: the calibration slope</h3>
<p>Take the model's linear predictor lp and, in new patients, fit <span class="m">logit(y) = a + b × lp</span>. The coefficient b is the <b>calibration slope</b>. In the development data it is 1 by construction. In new patients:</p>
<ul>
<li>b = 1: predictions have the right spread.</li>
<li>b &lt; 1: predictions are too extreme (high risks too high, low risks too low), the typical signature of overfitting.</li>
<li>b &gt; 1: predictions are too modest.</li>
</ul>
<p>A slope of 0.8, for example, means that the model's log-odds deviations from average should be multiplied by 0.8 to be correct on average.</p>
<div class="callout mch"><b>Illustrative (synthetic)</b><p>A model for low birthweight built on 60 events and 12 predictors predicts 2% for the lowest-risk tenth of women and 55% for the highest-risk tenth. In the next year's women, the observed rates in these groups are 5% and 38%. The ranking is still informative, but the predictions are too spread out: a calibration slope below 1.</p></div>
<p class="src">Source: Ch. 5, §5.2.3</p>`

<p>Overfitting shows in performance measures such as R² (explained variation) and the c statistic (the probability that a patient with the outcome has a higher predicted risk than one without). These measures are computed in the development data and so are optimistic.</p>
<div class="callout book"><b>Book example: R² from pure noise</b><p>A logistic model with 20 centres (19 dummy variables) was fitted when true mortality was 10% in every centre, so the true R² was 0%. The apparent Nagelkerke R² was 9.4% with 20 patients per centre, 1.0% with 200 and 0.1% with 2,000 per centre. With a true spread of mortality between 6% and 14% (τ = 2%), true R² was close to 1%, yet the apparent R² was 10.1% with 20 patients per centre.</p></div>
<h3>Model complexity versus performance</h3>
<p>In a simulation of linear models fitted to samples of 50 patients, the apparent error kept falling as predictors were added (1 to 10). Error in new patients from the same population (internal) and from a slightly different population (external) stopped improving at about five predictors and then worsened. Optimism grew from modest with one predictor to substantial with ten.</p>
<h3>A simple correction: adjusted R²</h3>
<p>The degrees of freedom spent can be subtracted from the LR statistic:</p>
<div class="formula">R²<sub>adj</sub> = (1 − e<sup>−(LR − df)/n</sup>) / (1 − e<sup>−(−2 LL<sub>0</sub>)/n</sup>)</div>
<p>In the pure-noise centre simulations the average adjusted R² was 0, with about half of the values negative, as it should be. The adjustment works only for a prespecified model whose df are known. It cannot account for df spent invisibly on selection and coding decisions; the bootstrap can.</p>
<h3>Events, not patients, determine the risk</h3>
<p>For a binary outcome, the information in the data is driven mainly by the number of events (the smaller outcome group). A common summary is <b>events per variable (EPV)</b>: events divided by the number of candidate predictor degrees of freedom. Models built with an EPV below 10 are overfitted and may perform worse than a simpler model (Ch. 3). Above 10 the risk is smaller but not absent, so optimism should still be estimated.</p>

<p class="src">Source: Ch. 5, §5.2.4–5.2.5, Table 5.2, Fig. 5.6; Ch. 3, §3.8.3 (EPV)</p>`

    {
      id: 's6',
      title: 'The bootstrap',
      html: `
<p>The <b>bootstrap</b> estimates the sampling distribution of any statistic by resampling the data we have. A bootstrap sample is drawn <b>with replacement</b> from the original sample and has the <b>same size</b> as the original. Some patients appear once, some twice or more, and some not at all. Repeating this many times mimics drawing repeated samples from the population.</p>
<div class="callout eg"><b>Worked example (book example)</b><p>Original sample of five ages: 20, 25, 30, 32, 35. Possible bootstrap samples (sorted): 20, 20, 30, 32, 35; 20, 25, 25, 30, 35; 25, 32, 35, 35, 35. Each has five values drawn from the original five.</p></div>
<h3>The 63.2% rule</h3>
<p>The chance that a particular patient is never drawn in n draws is (1 − 1/n)<sup>n</sup>, which approaches e<sup>−1</sup> = 0.368 as n grows. So on average a patient appears at least once in a bootstrap sample with probability 1 − 0.368 = 63.2% (for n = 429, 63.25%). The remaining 36.8% are "left out" of that sample.</p>
<h3>Uses of the bootstrap</h3>
<ul>
<li><b>Standard errors and confidence intervals</b> for statistics without a simple formula (for example a median, or the difference between an adjusted and an unadjusted coefficient).</li>
<li>Three ways to form a 95% CI: <b>normal approximation</b> (estimate ± 1.96 × SD of the bootstrap estimates); <b>percentile</b> (the 2.5th and 97.5th percentiles, for example the 50th and 1,950th of 2,000 ordered estimates); and the <b>bias-corrected (BCa)</b> percentile method. At least 2,000 replications are advisable for the percentile-based methods.</li>
<li><b>Optimism correction</b> of model performance, the most important use in prediction research (next section).</li>
</ul>
<p>The sampling widget in section 2 also has a "One bootstrap" button. Try the following there.</p>
<ul>
<li>In that widget, draw samples at n = 100, then press "One bootstrap". Compare the spread of the bootstrap distribution of observed risk with the spread across the 200 real samples.</li>
<li>Read the share of original subjects appearing at least once and compare it with 63.2%.</li>
</ul>
<p class="src">Source: Ch. 5, §5.3–5.3.2, Table 5.3</p>`

      html: `
<p>A naive approach fits models in bootstrap samples and tests them in the original sample. A more accurate approach uses the bootstrap to estimate the <b>optimism</b> and subtracts it from the apparent performance.</p>
<div class="formula">Optimism = mean over B of (bootstrap performance − test performance)</div>
<div class="formula">Optimism-corrected performance = apparent performance − optimism</div>
<ol>
<li>Develop the model in the original sample; record its <b>apparent performance</b> in that sample.</li>
<li>Draw a bootstrap sample (Sample*) with replacement from the original sample.</li>
<li>Develop a model (Model*) in Sample*, <b>replaying every modelling step</b> done in the original sample, especially predictor selection, coding choices and shrinkage. Record the <b>bootstrap performance</b>: Model* evaluated in Sample*.</li>
<li>Apply Model* unchanged to the original sample: the <b>test performance</b>.</li>
<li>Optimism for this replicate = bootstrap performance − test performance.</li>
<li>Repeat steps 2–5 many times, at least 100, for a stable estimate.</li>
<li>Subtract the mean optimism from the apparent performance.</li>
</ol>
<p>Testing Model* on the original sample, which largely overlaps Sample*, may look invalid, but theoretical and empirical work supports the procedure. Variants called .632 and .632+ test only on patients left out of each bootstrap sample (on average 36.8%); they showed no clear advantage in empirical studies. The approach works for any measure: R², the c statistic and the calibration slope. For the slope, the apparent and bootstrap values are 1, so the corrected slope is 1 − (1 − mean test slope) = mean test slope, an estimate of the shrinkage needed.</p>
<div class="callout book"><b>Book example: GUSTO-I subsample, 429 patients (Nagelkerke R²)</b>
<table class="data"><thead><tr><th>Strategy</th><th>Apparent</th><th>Bootstrap</th><th>Test</th><th>Optimism</th><th>Corrected</th></tr></thead>
<tbody>
<tr><td>Full 8-predictor model</td><td>22.7%</td><td>24.7%</td><td>17.2%</td><td>7.6%</td><td>15.1%</td></tr>
<tr><td>Backward stepwise, p &lt; 0.05 (3 predictors), selection replayed</td><td>17.6%</td><td>18.7%</td><td>12.7%</td><td>5.9%</td><td>11.7%</td></tr>
<tr><td>Same 3-predictor model, falsely treated as prespecified</td><td>17.6%</td><td>18.2%</td><td>15.4%</td><td>2.9%</td><td>14.7%</td></tr>
</tbody></table>
<p>Treating the stepwise model as prespecified halved its estimated optimism; the optimism from selection was as large as that from parameter uncertainty. After honest correction the full model (15.1%) beat the stepwise model (11.7%). Optimism values are as reported; small differences from the column subtraction reflect rounding.</p></div>
<div class="callout warn"><b>Critical: validate the whole process, not the final formula</b><p>If selection, cut-point searches or other data-driven steps are not repeated inside every bootstrap sample, the bootstrap underestimates optimism and the "corrected" performance is still optimistic. Only a fully specified strategy can be replayed. Subtle steps (informal coding choices, looking at plots) usually cannot be replayed, so the corrected estimate is then an upper bound on what to expect.</p></div>
<p>Two further practical points. It is often useful to compute the optimism of the full model first; large optimism is a warning not to rely on the data at hand alone. And a full model performs especially well relative to stepwise selection when selection would drop several nearly significant predictors with some true value; if a few dominant predictors exist, both approaches give similar results.</p>
<p class="src">Source: Ch. 5, §5.3.3–5.3.5, Table 5.4</p>`
    },
    {
      id: 's8',
      title: 'The cost of data analysis',
      html: `
<p>Model development is a continuing balance between fitting the data better and generalising beyond them. The more we take from a specific data set, the less the model may generalise: the <b>cost of data analysis</b>. Yet ignoring a clear pattern, such as a strongly non-linear effect, also harms predictions. Checking assumptions is natural; repeatedly adapting the model to capture every small violation makes it specific to the sample.</p>
<div class="callout book"><b>Book example: generalised degrees of freedom</b><p>Ye proposed measuring the effective degrees of freedom of a whole modelling procedure by its overfitting. A stepwise procedure that ended with 5 predictors (apparent df 5) had 14.1 generalised df. A regression tree with 19 nodes (apparent df 19) had 76.</p></div>
<h3>Practical implications</h3>
<ul>
<li><b>Sample size.</b> With few events, accept more assumptions. Power to detect violations is low anyway, and adapting the model after a detected violation introduces testimation bias without necessarily improving predictions.</li>
<li><b>Robust strategies.</b> Some strategies are data hungry. A prespecified logistic model with age and parity spends 2 df; testing non-linearity of age and an age × parity interaction spends more; a tree searches cut-points and interactions by default; stepwise selection asks the data both which predictors to include and what their coefficients are.</li>
<li><b>Bootstrap validation</b> helps judge how much fine-tuning is justified, but when many alternative strategies are compared, the winner may again be specific to the sample. The bootstrap works best for estimating the optimism of a single, predefined strategy.</li>
<li><b>Prespecify candidate predictors</b> using subject knowledge (literature, expert opinion) so that pure noise variables are not considered.</li>
</ul>
<div class="callout warn"><b>Pitfall: reporting apparent performance alone</b><p>A paper that reports only the c statistic in the development data, after stepwise selection from many candidates in a small sample, gives no information about performance in new patients. Without internal validation that replays the selection, the reported value should be read as an upper limit.</p></div>
<p>Science needs both curiosity and scepticism: discoveries must be subjected to stringent tests, such as validation, to make sure chance has not fooled us.</p>
<p class="src">Source: Ch. 5, §5.4–5.5</p>`

      level: 'Apply',
      scenario: `<p><b>Illustrative (synthetic).</b> A gestational diabetes model with 8 prespecified predictors is developed in 1,500 women (255 events). The apparent c statistic is 0.792. Five bootstrap replications are shown below (in practice at least 100 are needed).</p>
<table class="data"><thead><tr><th>Replication</th><th>c of Model* in Sample* (bootstrap)</th><th>c of Model* in original sample (test)</th><th>Calibration slope of Model* in original sample</th></tr></thead>
<tbody>
<tr><td>1</td><td>0.811</td><td>0.771</td><td>0.84</td></tr>
<tr><td>2</td><td>0.806</td><td>0.779</td><td>0.90</td></tr>
<tr><td>3</td><td>0.819</td><td>0.764</td><td>0.79</td></tr>
<tr><td>4</td><td>0.801</td><td>0.775</td><td>0.88</td></tr>

<p>A second analyst instead selected 4 of the 8 predictors by backward stepwise selection (apparent c 0.781). Replaying the selection in each bootstrap sample gave mean bootstrap c 0.806 and mean test c 0.752. Bootstrapping the final 4-predictor model as if prespecified gave 0.789 and 0.773.</p>`,

      answer: `<p><b>(a)</b> Optimism per replication: 0.811 − 0.771 = 0.040; 0.806 − 0.779 = 0.027; 0.819 − 0.764 = 0.055; 0.801 − 0.775 = 0.026; 0.814 − 0.768 = 0.046. Mean optimism = 0.194 / 5 = 0.0388. Corrected c = 0.792 − 0.039 = 0.753.</p>
<p><b>(b)</b> The apparent slope and each bootstrap slope are 1 by definition. Mean test slope = (0.84 + 0.90 + 0.79 + 0.88 + 0.84) / 5 = 0.85. Optimism in slope = 1 − 0.85 = 0.15; corrected slope = 1 − 0.15 = 0.85. In new women from the same population, predictions are expected to be somewhat too extreme; multiplying the coefficients by about 0.85 (and re-estimating the intercept) would be expected to correct this. This is the logic behind the shrinkage methods of a later module.</p>
<p><b>(c)</b> Selection replayed: optimism = 0.806 − 0.752 = 0.054; corrected c = 0.781 − 0.054 = 0.727. Falsely prespecified: optimism = 0.789 − 0.773 = 0.016; corrected c = 0.781 − 0.016 = 0.765. Only the first is honest, because the selection was data-driven and must be repeated in every bootstrap sample. Honestly corrected, the full model (0.753) outperforms the stepwise model (0.727), the same pattern as the book's GUSTO-I example.</p>
<p><b>(d)</b> Some women appear several times in a bootstrap sample, so the model fitted there finds the outcomes of those duplicated women easier to predict; its apparent performance in its own sample is therefore higher. The book notes this pattern is common in bootstrap validation.</p>`

        '<b>(a)</b> In optimismSim, fix 3 true predictors, incidence 10% and 10 noise predictors. Run 40 simulations at n = 200, 500 and 2,000. Tabulate EPV, mean apparent c, mean c in the fresh sample and mean calibration slope. Describe the pattern.',

      answer: `<p><b>(a)</b> Expected pattern: at n = 200 (about 20 events, EPV about 1.5 for 13 parameters) the apparent c is clearly higher than the honest c in the fresh sample and the calibration slope is well below 1. As n increases to 500 and 2,000, EPV rises, the apparent and honest c converge and the slope approaches 1. Overfitting is a small-sample problem relative to the number of parameters, and it is driven by events rather than total n.</p>
<p><b>(b)</b> Adding 30 noise predictors raises the apparent c (noise can always be fitted) while the honest c falls, so the gap (optimism) widens markedly; the calibration slope falls further below 1 because the extra coefficients add estimation error to the linear predictor. Noise predictors cost performance mainly through overfitting.</p>
<p><b>(c)</b> The percentage bias is largest for small β/SE (weak effects relative to their precision): only samples with chance-inflated estimates pass the test, so the mean selected estimate is far above the truth (for β = 0.5 more than double). For large β/SE almost every sample is significant, so there is little selection and little bias. The book notes that the bias is largest for relatively weak effects, as is common in medical research.</p>
<p><b>(d)</b> Against. EPV ≥ 10 is a minimum below which overfitting is severe; above it the optimism and slope deficit are smaller but not zero, as the simulations show at moderate EPV. Testimation bias also depends on β/SE and on whether selection is done. Optimism should therefore be estimated (for example by bootstrap) rather than assumed absent.</p>`

      scenario: `<p><b>Illustrative (synthetic).</b> An abstract reports: "We developed a preterm-birth prediction tool in 520 women attending a single antenatal clinic, of whom 64 delivered before 37 weeks. From 42 candidate variables, we selected those with univariate p &lt; 0.10, then applied forward stepwise selection (p &lt; 0.05), yielding six predictors including an optimal Hb cut-off of 9.7 g/dL, chosen as the value that best separated preterm from term births. The model showed excellent performance (c = 0.88; Hosmer–Lemeshow p = 0.61). Internal validation by bootstrapping the final six-predictor model confirmed stability (optimism 0.01). The odds ratio for Hb &lt; 9.7 g/dL was 4.9, suggesting a strong new risk factor."</p>`,
      questions: [
        '<b>(a)</b> List the sources of overfitting in this study and classify each as model uncertainty or parameter uncertainty.',
        '<b>(b)</b> Explain why the reported optimism of 0.01 is not credible and how the bootstrap should have been done.',
        '<b>(c)</b> What would you expect to happen to the c statistic, the calibration slope and the Hb odds ratio in new women from the same clinic?',
        '<b>(d)</b> Suggest a more robust development strategy for these data.'
      ],
      answer: `<ol>
<li><b>(a) Sources.</b> Model uncertainty: 42 candidates with only 64 events (EPV about 1.5 per candidate); univariate screening at p &lt; 0.10; forward stepwise selection; a data-searched "optimal" Hb cut-point. Parameter uncertainty: six coefficients estimated from 64 events, which makes predictions too extreme even if the structure were fixed. A single small clinic adds the risk that findings do not transport.</li>
<li><b>(b) Bootstrap.</b> Bootstrapping only the final model treats it as prespecified and ignores the optimism created by screening, stepwise selection and the cut-point search. The book's example shows that this can halve the estimated optimism. Every step (univariate screening, stepwise selection, cut-point search, model fitting) should have been replayed in each bootstrap sample, at least 100 times, and the mean optimism subtracted from the apparent c. A non-significant Hosmer–Lemeshow test in development data says little about future calibration.</li>
<li><b>(c) Expectations.</b> The c statistic will be lower than 0.88, possibly substantially; the calibration slope will be below 1 (predictions too extreme); the Hb odds ratio of 4.9 is subject to testimation bias from both selection and cut-point optimisation and is likely to be smaller in new women. The cut-point itself (9.7 g/dL) will probably not reproduce.</li>
<li><b>(d) Strategy.</b> Restrict candidates on subject knowledge and literature to a small number (for example previous preterm birth, short inter-pregnancy interval, bacteriuria, chronic hypertension, tobacco, Hb, BMI) so that EPV is reasonable; keep Hb continuous with a prespecified, sensible coding; fit a prespecified full model; estimate optimism with a bootstrap of the whole procedure and consider shrinkage of the coefficients; report calibration as well as discrimination; seek validation in other clinics. Claims about a "new risk factor" belong to aetiological research, not to an overfitted prediction model.</li>
</ol>`

      html: `
<p>Most routinely collected maternal and child health data have gaps: a haemoglobin result not filed, a BMI not recorded at booking, a urine culture not sent. This module concerns missing values of <b>predictors</b> (X) in a model for a single outcome (Y), where a true value exists but is hidden.</p>
<p>Standard regression software silently performs a <b>complete case (CC) analysis</b>: any patient with a missing value on any predictor in the model is dropped. An <b>available case analysis</b> uses, for each analysis, the patients complete for the variables in that analysis, so numbers vary between analyses. Both discard information from patients who have some but not all values. Missing data cause three problems:</p>
<ol>
<li><b>Inefficiency</b>: fewer patients and events, wider confidence intervals, more overfitting.</li>
<li><b>Difficult interpretation</b>: if a univariate OR is based on 450 women and an adjusted OR on 250, a change between them may reflect confounding or merely the different selection of women.</li>
<li><b>Possible bias</b> in coefficients and predictions, especially when missingness is related to the outcome.</li>
</ol>
<div class="callout eg"><b>Worked example (book example, hypothetical data)</b>
<p>500 patients, 100 events, a model with 5 predictors: EPV = 100/5 = 20. Each predictor has 10% missing values and no patient misses more than one value.</p>
<ol>

<li>So 10% of values are missing, yet 50% of patients are discarded.</li>
</ol>
<p>If missing values occur independently of each other, overlap within patients makes the loss smaller: the expected complete share is (1 − m)<sup>k</sup> for k predictors each with a fraction m missing; here 0.9<sup>5</sup> = 59%.</p></div>

<p>Methods for handling missing values rely on assumptions about why values are missing. The terminology is standard, though confusing at first.</p>

<p>Under MCAR the patients with complete data are representative of all patients. Under MAR they are not, but the missingness can be modelled from observed information, which is what imputation does. Under MNAR no method using only the observed data can fully repair the problem.</p>
<div class="callout key"><b>Key idea: MAR on y in prospective studies</b><p>If all predictors are recorded before the outcome is known, as in a booking-to-delivery cohort, missingness cannot depend on the outcome directly. An observed association between missingness and outcome must then run through other characteristics. If those characteristics are recorded, the situation is MAR on x; if they are not, it is MNAR.</p></div>

<p><b>Imputation</b> fills in missing values with plausible values so that the completed data can be analysed with standard methods. Two sophisticated approaches are generally preferred over CC analysis: maximum likelihood methods and multiple imputation; the book concentrates on imputation as the practical approach.</p>

<tr><td>CC</td><td>None</td><td>Complete case analysis: patients with missing values are excluded.</td></tr>
<tr><td>Mean (simple)</td><td>None</td><td>Replace a missing value by the overall mean (or the most frequent category).</td></tr>
<tr><td>CM</td><td>X only</td><td>Single imputation with the <b>conditional mean</b>, the value predicted from a regression on other predictors ("regression imputation").</td></tr>
<tr><td>SI</td><td>X + Y</td><td>Single <b>stochastic regression imputation</b>: a random draw from the predictive distribution of the imputation model.</td></tr>
<tr><td>MI</td><td>X + Y</td><td><b>Multiple imputation</b>: the random draw is repeated, for example 5 times, giving m completed data sets.</td></tr>
</tbody></table>
<h3>Simple mean imputation</h3>
<p>Imputing the mean ignores the correlation of the incomplete predictor with other predictors and underestimates the variability of the predictor among patients. It is generally suboptimal.</p>
<h3>Conditional mean (regression) imputation</h3>
<p>An imputation model predicts the missing predictor from other variables. When the correlation is strong this works well: in 566 patients with head injury, Hb could be predicted from haematocrit and sex with R² = 0.97. In MCH data, a missing Hb could similarly be predicted from a recorded haematocrit.</p>
<h3>Stochastic regression imputation</h3>
<p>Instead of the predicted value, a random draw from the distribution of predicted values is imputed. The random element acknowledges that the imputed value is uncertain, which matters most when the imputation model predicts poorly.</p>
<h3>Multiple imputation and Rubin's rules</h3>
<p>MI creates m completed data sets with independent random draws. When several predictors are missing, imputation proceeds iteratively (data augmentation) until convergence. Each completed data set is analysed as if complete, and results are combined:</p>
<div class="formula">Point estimate: b̄ = mean of b<sub>m</sub> over the M data sets</div>
<div class="formula">Var(b̄) = W + (1 + 1/M) × B, with W = mean of var(b<sub>m</sub>) and B = Σ (b<sub>m</sub> − b̄)² / (M − 1)</div>
<p>W is the within-imputation variance (ordinary sampling uncertainty); B is the between-imputation variance, which reflects uncertainty about the imputed values. B is what single imputation ignores, so SI understates standard errors.</p>
<div class="callout eg"><b>Worked example (Illustrative, synthetic)</b>
<p>Three imputations give coefficients for low Hb of 0.60, 0.66 and 0.63, each with SE 0.10.</p>
<ol>
<li>b̄ = (0.60 + 0.66 + 0.63) / 3 = 0.63.</li>
<li>W = mean of SE² = 0.01.</li>
<li>B = [(−0.03)² + (0.03)² + 0²] / 2 = 0.0009.</li>
<li>Var = 0.01 + (1 + 1/3) × 0.0009 = 0.01 + 0.0012 = 0.0112; SE = √0.0112 = 0.106, about 6% larger than the within-imputation SE alone.</li>
</ol></div>
<p><b>How many imputations?</b> M is usually 5 or 10. With M = 10 the factor (1 + 1/M) is 1.1 and the within-imputation variance dominates. Rubin found that with 50% missing data, five imputations give an SD only 5% wider than an infinite number; other simulations suggest M can be as low as 3 with 20% missing. M = 1 is single stochastic imputation.</p>
<p class="src">Source: Ch. 7, §7.3, Table 7.3, Fig. 7.3</p>`

      html: `
<p>The imputation model is the most important step. It is an explicit attempt to model the MAR process, and it requires two choices: the form of each model and the variables that enter it.</p>
<h3>Form</h3>
<ul>
<li>Binary predictors (for example bacteriuria yes/no): logistic regression.</li>
<li>Categorical predictors with three or more levels: polytomous logistic regression.</li>
<li>Continuous predictors (Hb, BMI): linear regression, with transformations where needed.</li>
<li>Imputed values outside the plausible range can be <b>truncated</b> (for example Hb kept within a physiologically plausible range).</li>
</ul>
<p>Software differs in how it handles non-linear relationships: some functions assume linear associations by default (the user can add terms such as x + x²); others search for transformations, which helps with non-linear associations but is inefficient when associations are linear.</p>
<h3>Content: what goes into the imputation model</h3>
<ol>
<li><b>All predictors in the prediction model.</b> Omitting one may bias the analysis.</li>
<li><b>Auxiliary variables</b>: variables not in the prediction model but related to the missing values or to missingness, such as calendar time, site, or (in the course data) the number of antenatal visits. Including more variables makes MAR more plausible; noise variables do no harm, unless computational problems arise.</li>
<li><b>The outcome.</b> This seems circular, because the aim is to predict the outcome, but it is necessary.</li>
</ol>
<div class="callout warn"><b>Critical: leaving the outcome out of a multiple imputation model</b><p>Imputed values drawn without reference to Y carry no relationship with Y, so the predictor's association with the outcome is diluted towards zero, even under MCAR. With 50% of a predictor missing completely at random, omitting the outcome roughly halves its estimated coefficient. Stochastic SI and MI must include the outcome.</p></div>
<div class="callout warn"><b>Pitfall: the opposite rule for conditional mean imputation</b><p>For single imputation with the conditional mean (no random element), use only the X variables. Including Y then exaggerates the strength of the predictor–outcome relationships, because every imputed value sits exactly on the predicted line.</p></div>
<h3>What the simulations show</h3>

</ul></div>
<p>Always check the imputed values, for example by comparing histograms of observed and imputed values: they should lie within a plausible range and show no strange peaks.</p>
<p class="src">Source: Ch. 7, §7.4–7.5, Table 7.4; §7.8.2</p>`

      html: `
<h3>Explore missingness first</h3>
<ol>
<li>Count missing values for each potential predictor.</li>
<li>Examine whether missingness of one predictor goes with missingness or values of others, and with auxiliary variables such as site and calendar time. Cluster displays of missingness patterns help.</li>
<li>Model missingness of a predictor (as the outcome) with logistic regression or a tree on the other predictors. Any association rejects MCAR.</li>
<li>Check whether missingness is associated with the outcome (for example preterm rate in women with and without a recorded Hb), and whether observed predictors explain that association.</li>
<li>Use subject-matter knowledge to judge plausible mechanisms, including whether MNAR is likely.</li>
</ol>
<h3>Decisions</h3>
<div class="callout warn"><b>Pitfall: the missing indicator method</b><p>Adding a "missing" category (for example bacteriuria: absent, present, missing) is simple but ignores correlations between predictors and can severely bias coefficients. It should generally not be used. Where appropriate, an alternative is to redefine the predictor: if a characteristic is not recorded in the chart, treat it as absent.</p></div>
<ul>
<li><b>Very incomplete predictors.</b> In theory MI can handle any fraction missing under MAR, but effects of predictors with more than 50% missing values in a data set will generally be distrusted, and such predictors may be discarded. There is no fixed limit: evidence of MAR on y can make CC analysis of a predictor with 10% missing suspect, while 20% MCAR may be acceptable. Missingness by design (a variable not collected in one study) is less worrying.</li>
<li><b>Predictor of primary interest.</b> Do not impute it. Missing treatment allocation in a randomised trial, for instance, would never be imputed. For adjusted effects, analyse the patients with the predictor of interest observed and impute the confounders (SI or MI), so that univariate and adjusted analyses use the same patients.</li>
<li><b>Single or multiple imputation for prediction.</b> MI may be best. A stochastic SI data set (the first of an MI series) is often sufficient for point estimates, predictions, performance measures and a score chart, because underestimated uncertainty matters less when predictions are the goal. MI is preferable with small data sets (for example fewer than 100 events), where imputations vary considerably.</li>
<li><b>Future availability.</b> Impute all predictors for individual predictions, unless a predictor will not be available when the model is used; then develop the model in the setting where data will be available.</li>
<li><b>Missing outcomes.</b> In prediction research, patients with a missing outcome are generally excluded. Imputation of the outcome adds no information about predictor–outcome relationships, but can help other estimates, such as prevalence under verification bias. Last observation carried forward is biased and underestimates variability.</li>
<li><b>Validation with imputation.</b> When bootstrapping, the book proposes validating the modelling process within each imputed data set.</li>
</ul>
<h3>Reporting</h3>
<p>In a review of 100 prognostic cancer studies, 81 had missing values; more than 10% of patients were excluded from multivariable analyses in about half; only three used single and one used multiple imputation. Report:</p>
<table class="data"><thead><tr><th>Issue</th><th>What to report</th></tr></thead><tbody>
<tr><td>Completeness</td><td>Total n and n with complete data; frequency of missing values for every predictor; numbers excluded if completeness was an inclusion criterion.</td></tr>
<tr><td>Approach</td><td>Methods used, with details of any imputation; number of patients and events in every analysis.</td></tr>
<tr><td>Exploration</td><td>Reasons for missingness; comparison of patients with and without missing data; results of complete case and completed (imputed) analyses.</td></tr>
</tbody></table>
<p>The best solution remains prevention: retrieve values from charts, and where the clinical meaning allows, record "not present" rather than leaving a blank.</p>
<p class="src">Source: Ch. 7, §7.6–7.8, Tables 7.5–7.6</p>`

<li>"In a sensitivity analysis we multiply imputed Hb and BMI from all other predictors; the outcome was deliberately excluded from the imputation model to avoid circularity."</li>

<li><b>Outcome.</b> Assigning "term" invents outcomes and biases the event rate and the coefficients. In prediction research women with missing outcome are generally excluded (and the number reported); the 6% should be described and compared with the rest.</li>
<li><b>Missing indicator.</b> The missing-indicator method ignores correlations among predictors and can severely bias coefficients; it should not be used. Hb should be imputed.</li>
<li><b>Mean imputation.</b> Ignores the correlation of BMI with other predictors and understates its variability. A regression-based imputation (or MI with the outcome) is preferred.</li>
<li><b>Cervical length.</b> With 65% missing, its effect will generally be distrusted. The missingness is by design (one hospital), which is less worrying for interpretation, but imputation in the two hospitals without scanning would rely entirely on relationships observed elsewhere. Consider omitting it from the main model, or developing a separate model for settings where scanning will be available, since the model should use predictors available in future use.</li>

<p><b>(b) Improved plan.</b> Exclude and report women with missing outcome. Tabulate missingness for every predictor; explore patterns (missingness by hospital, antenatal visits, socio-economic status and outcome, using logistic regression with missingness as outcome). Use multiple imputation (for example 5–10 imputations) with an imputation model containing all predictors, auxiliary variables (hospital, number of antenatal visits) and the outcome; logistic models for binary and linear models for continuous variables, with truncation to plausible ranges; check observed versus imputed distributions. Do not use missing indicators. Decide on cervical length using the intended setting of use. Pool with Rubin's rules; when bootstrapping, validate the modelling process within each imputed data set. Report total n and n complete, missingness per predictor, numbers of women and events in each analysis, the imputation method, and complete case versus imputed results.</p>`

      id: 's1',
      title: 'Coding is a modelling decision that comes before looking at the outcome',
      html: `
<p>Raw study data are rarely in the form a regression model needs. A haemoglobin value may be recorded to one decimal place, gestational age in weeks plus days, parity as a count, and a category such as place of delivery as free text. <b>Coding</b> is the work of turning these variables into the numeric columns that enter the model. Coding comes after data inspection (including a look at missing values) and before the choice of which predictors stay in the model. It is the second of the seven modelling steps in this course.</p>
<p>Two vocabulary points are needed throughout this module.</p>
<ul>
<li><b>Degrees of freedom (df)</b> of a coding: the number of regression coefficients the coding uses for that predictor. A binary variable uses 1 df. A straight-line term for age uses 1 df. A coding that lets age bend uses more.</li>
<li><b>Model chi-square (likelihood-ratio chi-square)</b>: twice the gain in log-likelihood when a predictor (or a set of terms) is added to a model, equivalently the drop in −2 log-likelihood. A larger value means the coding explains more of the outcome. A term that has no real association with the outcome adds on average about 1 to the chi-square per df by chance alone, so a fair comparison between codings needs to account for df. Section 4 gives the rule.</li>
</ul>
<div class="callout key"><b>Key idea</b><p>Every coding choice that is made while looking at the predictor-outcome relationship in the development data uses up some of the information in the data and makes the model look better in that sample than it will be in new patients. Choices made while still blind to the outcome relationship, or taken from earlier studies, do not have this cost.</p></div>
<p>The chapter's closing advice reflects the same logic: some decisions can be taken while still blinded to the relationship of the predictor with the outcome in the sample, which limits overfitting, and another general strategy is to use the codings that were used in other studies of the same problem.</p>
<p class="src">Source: Ch. 9, background and §9.6</p>
