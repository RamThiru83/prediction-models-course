      title: 'Non-linearity in multivariable models',
      html: `
<p>Module 6 described flexible functions for a single predictor. Here several continuous predictors are in the model together, and each flexible term consumes degrees of freedom. Three approaches are available (Table 1).</p>
<table class="data">
<tr><th>Approach</th><th>Characteristic</th><th>Multivariable strategy</th></tr>
<tr><td>Restricted cubic splines (RCS)</td><td>Cubic splines restricted to be linear in the tails</td><td>Keep the complexity defined a priori, or based on univariable or multivariable findings</td></tr>
<tr><td>Fractional polynomials (FP)</td><td>One or two power terms</td><td>Search iteratively for the best transformation of each predictor</td></tr>
<tr><td>Splines in a generalised additive model (GAM)</td><td>Smoothing controlled by a penalty (effective df)</td><td>Effective df set by the analyst, or by generalised cross-validation (GCV)</td></tr>
</table>
<p class="src">Ch. 12, Table 12.3</p>
<h3>Multivariable RCS</h3>
<p>With 3, 4 or 5 knots an RCS uses 2, 3 or 4 df. Five knots are enough to capture many patterns, but giving every continuous predictor 5 knots may be unwise because the total flexibility will cause overfitting. The strategy is to decide a priori how much flexibility each predictor may use. In small datasets one may use only linear terms or 3-knot splines (2 df), unless prior information suggests that a non-linear effect is needed. Alternatively different RCS complexities can be examined in univariable or multivariable analyses and a number of knots chosen per predictor. It may be reasonable to choose the complexity from each predictor's χ² statistic, with more flexibility for the stronger predictors.</p>
<h3>Multivariable fractional polynomials</h3>
<p>As defined in Module 6, FP1 functions have 1 power (2 df counting the search) and FP2 functions have two (4 df). The <b>mfp</b> procedure is a special backward-stepwise algorithm. It starts from a full model with all continuous predictors linear, and considers the predictors in order of decreasing significance. For each predictor, in turn:</p>
<ol>
<li>Search for the best of 44 candidate transformations (FP1 and FP2) and compare it with omitting the predictor: a 4-df test for "any effect".</li>
<li>If significant, compare the best FP2 with a straight line: a 3-df test for non-linearity.</li>
<li>Compare the best FP2 with the best FP1: a 2-df test for "simplification".</li>
</ol>
<p>The chosen form is retained and the cycle repeated over all predictors until the functions and the variables do not change. The procedure aims to preserve the overall type I error. The price is that it is slightly conservative when the relationship is really linear, since the overall effect is tested with 4 df.</p>
<h3>GAM</h3>
<p>In a GAM, smooth functions based on splines are penalised for lack of smoothness. The penalty reduces the effective df used by each predictor. The optimum smoothness can be chosen by a prediction-error criterion such as GCV, which selects statistically optimal transformations for several predictors at once, but at the cost of more effective df. Because the search for the amount of smoothing is not counted, p-values from GCV-optimised GAMs are only approximate. GAM splines can serve as a reference against which simpler parametric transformations (FP or RCS) are compared.</p>
<div data-widget="codingExplorer"></div>
<ul class="try">
<li>Reduce the random subsample to the smallest value and compare the 5-knot spline with the quadratic and 3-knot codings. Note how the 5-knot curve behaves at the age extremes.</li>
<li>Increase the subsample to the largest value and see whether the extra flexibility now pays off in AIC.</li>
</ul>
<p class="src">Source: Ch. 12, §12.3</p>
`

      html: `
<p>The book illustrates the options in a dataset of 544 patients treated with chemotherapy for testicular cancer. The outcome is benign tissue (necrosis) in the residual mass. There are six predictors: three binary (teratoma elements, elevated AFP, elevated HCG) and three continuous (pre-chemotherapy LDH, standardised by dividing by the local upper limit of normal as "LDHst"; the post-chemotherapy mass size; and the reduction in mass size during chemotherapy).</p>
<h3>Univariable shapes</h3>
<p>Earlier work used RCS curves to examine each predictor and then chose simple transformations by eye: logarithm for LDHst, square root for post-chemotherapy size and linear for reduction in size. The fractional polynomial procedure agreed in the main: LDH showed an effect (p = 0.02 for "any effect") but no significant non-linearity (p = 0.48). For post-chemotherapy size there was clear non-linearity (p = 0.0002), with no significant improvement of FP2 over FP1 (p = 0.46), the chosen FP1 being logarithmic rather than square root. For reduction in size a linear term was adequate (non-linearity p = 0.64).</p>
<h3>Multivariable models</h3>
<p>Table 12.5 of the book compares codings of the three continuous predictors; the 3 in "3 + 12" counts the binary predictors.</p>
<div class="callout book"><b>Book example: model χ² of alternative codings (testicular cancer, n = 544)</b>
<table class="data">
<tr><th>Strategy</th><th>df</th><th>Model χ²</th><th>χ² − 2 × df</th></tr>
<tr><td>All linear</td><td>3 + 3 = 6</td><td>205</td><td>193</td></tr>
<tr><td>FP2 for each, no selection</td><td>3 + 12 = 15</td><td>222</td><td>192</td></tr>
<tr><td>FP2 with selection at p &lt; 0.20 (1/reduction, log post-size, LDHst)</td><td>3 + 3 selected forms (search df not counted)</td><td>213</td><td>not computed</td></tr>
<tr><td>RCS, 4 knots for each</td><td>3 + 9 = 12</td><td>231</td><td>207</td></tr>
<tr><td>Visual approximation (log LDHst, linear reduction, square root post-size)</td><td>3 + 3 chosen forms (search df not counted)</td><td>212</td><td>not computed</td></tr>
<tr><td>GAM, 3 df each (pre-specified)</td><td>3 + 9 = 12</td><td>232</td><td>208</td></tr>
<tr><td>GAM, GCV-optimised</td><td>3 + (2.8 + 4.6 + 3.9) = 14.3</td><td>240</td><td>211.4</td></tr>
</table>
<p>Source: Ch. 12, Table 12.5. The last column is computed here to apply the χ² − 2 × df rule of Module 6 (apparent performance only).</p></div>
<ul>
<li>With linear terms only (6 df) the model χ² is 205, and Nagelkerke R² is 41.9% apparent and 40.3% internally validated.</li>
<li>The full FP2 model (15 df) reaches 222: a gain of 17 for 9 extra df, borderline significant (p = 0.049).</li>
<li>RCS with 4 knots each (12 df) reaches 231, a gain of 26 over linear for 6 extra df, which is statistically significant (p &lt; 0.001).</li>
<li>The visual approximation reached 212, and FP1 transformations 213: nearly as good with far fewer df.</li>
<li>GAM with pre-specified 3 df per predictor (232) is much the same as RCS (231). GCV-optimised GAM reaches the highest χ² (240) by spending more effective df.</li>
</ul>
<p>The more complex GAM shapes were doubtful. For post-chemotherapy size the multivariable function implied an implausible increase in log odds of necrosis with very large masses, and for reduction in size the curve was wiggly between 20% and 100%. The smooth functions may not be smooth enough from a pathophysiological point of view, and external validation could show whether the "optimal" transformations are merely overfitted.</p>
<p>All these χ² values are apparent performance. A rigorous internal validation that repeats every modelling step is needed to see whether any real gain remains after correction for optimism. If that is impossible, a fully independent validation set (split-sample or external) may be needed.</p>
<p class="src">Source: Ch. 12, §12.4</p>
`

      id: 's7',
      title: 'Concluding advice: a "wrong but useful" model',
      html: `
<p>Additivity and linearity can be seen as essential assumptions, and one might argue for assessing them thoroughly. When the aim is to estimate the effect of one predictor, this makes sense. When the aim is prediction, thorough assessment increases the risk of overfitting: we are tempted to extend the model with interaction and non-linear terms whenever the data suggest them, and may end up with a model that performs worse in future patients than a parsimonious model. The alternative is to accept a "wrong but useful" model that gives well-calibrated, discriminating predictions even if it violates some underlying assumptions.</p>
<p>In the book's examples, performance did not increase impressively with more flexible terms. Strong qualitative interactions or U-shaped non-linearity may be rare, so the increase in predictive performance from interactions and non-linear terms is often modest in medical examples.</p>
<h3>Recommendations</h3>
<table class="data">
<tr><th>Approach</th><th>Description</th></tr>
<tr><td>Limit the number of interaction and non-linear terms</td><td>Consider only interactions that are a priori plausible (Table 12.1 in the book), and non-linear terms only for predictors with a presumed strong and likely non-linear effect</td></tr>
<tr><td>Use overall testing</td><td>One overall test per interacting predictor (for example all age interactions) before looking at individual terms</td></tr>
<tr><td>Compare flexible with simple models</td><td>Compare the <i>validated</i> performance, for example by bootstrap, of the flexible model (interactions, non-linearities, or a neural network or GAM) with a simple additive linear model</td></tr>
<tr><td>Extra shrinkage</td><td>Apply stronger shrinkage (factor below 1) or more penalty in penalised ML to interaction and non-linear terms, to compensate for testimation bias</td></tr>
</table>
<p class="src">Ch. 12, Table 12.6</p>
<p>The reasoning behind the first measure is that interactions should be considered mainly in studies with relatively many events compared with the number of terms. In smaller datasets one may rely on the additivity assumption and say that the model estimates average (marginal) effects over subgroups, knowing that a relevant high-order interaction can never be excluded. Interaction terms also complicate model presentation, so they should be left out unless relevant to the specific prediction problem.</p>
<p>The search for interactions and non-linearities makes the effective df of the flexible model larger than the df in the final fitted model. FP procedures recognise this by testing FP1 with 2 df and FP2 with 4 df. GCV-optimised GAMs do not count it in their p-values.</p>
<h3>How other methods treat interactions</h3>
<ul>
<li>Naive Bayes estimation uses univariable effects and assumes additivity; interactions are not studied.</li>
<li>Tree models assume high-order interactions by default, and neural networks, with their flexibility, can fit specific patterns in a dataset. A tree can therefore be used to <i>explore</i> interactions; those that stand out can then be assessed for significance in a regression model.</li>
</ul>
<div class="callout key"><b>Key idea</b><p>A model with a higher apparent χ² is not automatically a better prediction model. Prefer extra terms only when they are plausible a priori and show an improvement in <i>validated</i> performance.</p></div>
<p class="src">Source: Ch. 12, §12.5</p>
`

  sections: [
    {
      id: 's1',
      title: 'Why biased coefficients can predict better',
      html: `
<p>Standard logistic regression estimates its coefficients by <b>maximum likelihood (ML)</b>: it chooses the intercept and coefficients that make the observed outcomes in the development sample most probable. For that sample the ML coefficients are optimal. For <i>future</i> patients they are not, because each coefficient carries sampling error, and the combination of coefficients that fits this sample best has partly fitted its noise.</p>
<p>The consequence is systematic. Patients who receive a very high predicted risk in the development data tend to have been helped there by chance; in new patients their observed risk is lower. Patients with very low predicted risk tend to show higher observed risk in new patients. Predictions are <b>too extreme</b>, and the remedy is to pull them towards the average. This is the same phenomenon as regression to the mean.</p>
<h3>The bias-variance trade-off</h3>
<p>The error of a prediction for a new patient has two parts: bias (systematic deviation of the estimate from the truth) and variance (how much the estimate would change in another sample of the same size). ML coefficients are approximately unbiased but can have large variance in small samples. If we deliberately shrink coefficients towards zero, we add a little bias but remove more variance, so the average squared prediction error for new patients falls. Finding the right amount of shrinkage is the core of modern estimation.</p>
<div class="callout key"><b>Key idea</b><p>A model can be improved for future patients by making its coefficients slightly smaller than the ML estimates. Shrinkage leaves the ranking of patients largely unchanged and mainly repairs calibration: it makes the spread of predictions match what will be seen in new patients.</p></div>
<h3>Three families of methods</h3>
<table class="data">
<thead><tr><th>Method</th><th>Label</th><th>What it does</th></tr></thead>
<tbody>
<tr><td>Uniform shrinkage</td><td>Shrinkage after estimation</td><td>Fit by ML, then multiply all coefficients by one factor s (0 to 1), from a heuristic formula or bootstrapping</td></tr>
<tr><td>Penalised maximum likelihood (PML)</td><td>Shrinkage during estimation</td><td>Maximise the log-likelihood minus a penalty on the size of the coefficients; optimal penalty chosen, for example, by AIC</td></tr>
<tr><td>Lasso</td><td>Shrinkage for selection</td><td>Penalise the sum of absolute coefficients; some coefficients become exactly zero, so the predictor drops out</td></tr>
</tbody></table>
<p>Neural networks face the same problem in a more extreme form. Because they are very flexible, they are usually not trained to maximum fit; training is stopped early, at the number of iterations where predictive ability in held-out data is best ("early stopping").</p>
<div class="callout mch"><b>Illustrative (synthetic)</b><p>A preterm-birth model is developed in a district hospital cohort with about 120 events. A woman with a previous preterm birth and bacteriuria receives an apparent risk of 31%. If the coefficients are overfitted, women like her will, on average, have a lower observed risk at the next hospital, and women with no risk factors a slightly higher one. Shrinkage anticipates this.</p></div>
<p class="src">Source: Ch. 13, §13.1-13.2; Table 13.1</p>

      title: 'Uniform shrinkage: the heuristic formula and the bootstrap',
      html: `
<p>The simplest approach multiplies every estimated coefficient b<sub>i</sub> by the same factor s, giving shrunk coefficients <span class="m">s × b<sub>i</sub></span>. Two ways of finding s are used.</p>
<h3>Heuristic formula (van Houwelingen and le Cessie)</h3>
<div class="formula">s = (model χ² − df) / model χ²</div>
<p><b>Model χ²</b> is the likelihood ratio statistic of the fitted model: the difference in −2 log-likelihood between the intercept-only model and the model with predictors. <b>df</b> is the number of degrees of freedom of the <i>candidate</i> predictors considered (a spline with 3 knots or a quadratic term counts 2 df; a categorical predictor with 4 levels counts 3 df).</p>
<p>The intuition: if none of the predictors had any true effect, the expected model χ² would equal its df. The part of the χ² above df is the "real" signal; s is the share of the total χ² that is signal. More df or a smaller model χ² (smaller sample, weaker predictors) means more shrinkage.</p>
<div class="callout book"><b>Book example</b><p>GUSTO-I sample of 785 patients with 52 deaths at 30 days. An 8-predictor model had model χ² 62.6: s = (62.6 − 8)/62.6 = 0.87. A 17-predictor model had χ² 73.5: s = (73.5 − 17)/73.5 = 0.77. A bootstrap with 200 replications gave the same values (0.87 and 0.77).</p></div>
<h3>Bootstrap shrinkage factor</h3>
<ol>
<li>Draw a bootstrap sample of the same size as the original sample, with replacement.</li>
<li>Repeat the full modelling procedure, including any predictor selection, and estimate the coefficients in the bootstrap sample.</li>
<li>Calculate the linear predictor for each patient in the <i>original</i> sample using the bootstrap coefficients.</li>
<li>Fit a logistic regression of the original outcomes on this linear predictor; its slope is one estimate of s.</li>
</ol>
<p>Repeat steps 1-4 many times (200 replications is common; 500 gives a fully stable estimate) and average the slopes. The factor typically lies between 0 and 1.</p>
<h3>After shrinking: re-estimate the intercept</h3>
<p>Multiplying the coefficients by s changes the average predicted risk. The intercept is therefore re-estimated, with the shrunk linear predictor (without intercept) entered as a fixed offset, so that the average predicted risk again equals the observed incidence in the development data.</p>
<h3>Shrinkage after predictor selection</h3>
<p>Stepwise selection keeps fewer predictors, which might suggest less need for shrinkage. The opposite worry applies: selected coefficients are overestimated ("testimation" bias). The book's advice is to use the number of <b>candidate</b> df in the heuristic formula, not the number of selected predictors, or to repeat the selection inside each bootstrap sample. Empirically, the required shrinkage is roughly similar for prespecified and selected models.</p>
<div class="callout warn"><b>Critical:</b><p>Computing s with the df of the selected predictors only (for example 9 retained out of 15 candidate df) understates the shrinkage needed and leaves the model too extreme. Use all candidate df, or bootstrap the whole selection process.</p></div>
<div class="callout eg"><b>Worked example (synthetic preterm-birth model)</b><p>A 14-term model (age quadratic, so 15 df) has model χ² = 95.<br>s = (95 − 15)/95 = 80/95 = 0.842.<br>Prior preterm birth: b = 1.62 (OR 5.05) becomes 0.842 × 1.62 = 1.36 (OR 3.91).<br>Bacteriuria: b = 0.98 (OR 2.66) becomes 0.83 (OR 2.28).<br>If the same data gave model χ² = 30, s = (30 − 15)/30 = 0.50: half of each coefficient would be removed, a sign that the data are barely adequate for 15 df.</p></div>
<p class="src">Source: Ch. 13, §13.2.1-13.2.2, §13.3.3; Ch. 14, §14.2.3</p>
`

      id: 's3',
      title: 'Penalised maximum likelihood',
      html: `
<p>Uniform shrinkage treats all coefficients alike. <b>Penalised maximum likelihood (PML)</b> shrinks during estimation, and can shrink some coefficients more than others. It generalises ridge regression from linear models. Instead of maximising log L, we maximise</p>
<div class="formula">PML = log L − ½ λ Σ (s<sub>i</sub> b<sub>i</sub>)²</div>
<p>Here λ (lambda) is the penalty factor, b<sub>i</sub> the coefficient of predictor i and s<sub>i</sub> a scaling factor that makes s<sub>i</sub>b<sub>i</sub> unit-free; the standard deviation of the predictor is convenient. Large coefficients cost more, so smaller values are preferred. With λ = 0 the ordinary ML estimates result. The intercept is not penalised.</p>
<h3>Why one penalty gives unequal shrinkage</h3>
<p>The penalty pulls each coefficient towards zero against the pull of the data. A predictor that is strongly and precisely related to the outcome (many informative patients) resists the penalty and is shrunk little; a weak or imprecisely estimated coefficient, for example of a rare predictor, is shrunk more. In the book's GUSTO-I example the reported effective shrinkage per coefficient ranged from 0.81 to 1.49 relative to ML: the coefficient for age over 65 years was reduced most, while those for shock and sex increased slightly.</p>
<h3>Choosing λ: effective degrees of freedom and penalised AIC</h3>
<p>Penalisation reduces how many degrees of freedom the model effectively uses. The <b>effective df</b> is computed as trace[I(b) cov(b)], where I(b) is the information matrix without penalty and cov(b) the covariance matrix with penalty; with no penalty it equals the number of coefficients, and it falls as λ rises. The optimal λ maximises</p>
<div class="formula">AIC<sub>penalised</sub> = model χ²<sub>penalised</sub> − 2 × df<sub>effective</sub></div>
<p>As λ increases the model χ² falls (poorer fit to the sample) but df<sub>effective</sub> falls too; the best balance is found by trial over a grid such as λ = 0, 1, 2, 4, 6, 8, 12, 16, 24, 32, 48. Larger λ values are needed for more complex models and larger data sets. Cross-validation or bootstrapping can replace AIC, at greater computing cost.</p>
<div class="callout book"><b>Book example</b><p>GUSTO-I sample (785 patients, 52 deaths). Optimal penalty 8 for the 8-predictor model (effective df 6.9) and 24 for the 17-predictor model (effective df 10.8). Penalised AIC was worse for the 17-predictor model at every penalty: with 52 events it was overfitted. A bootstrap search for the penalty giving a calibration slope of 1 suggested 7 and 12.</p></div>
<h3>Penalising complex terms more</h3>
<p>When many interaction terms are tested, a refinement is to penalise interaction terms more than main effects, for example twice the penalty, and nonlinear and nonlinear-interaction terms twice and four times the main-effect penalty. After stepwise selection, the penalty found optimal for the full model can be applied to the selected model.</p>
<div class="callout key"><b>Key idea</b><p>PML replaces "fit the sample as closely as possible" with "fit the sample well while paying for large coefficients". The price per unit of coefficient size (λ) is tuned so that the model is expected to predict best in new patients.</p></div>
<p class="src">Source: Ch. 13, §13.3; Table 13.2; Figs 13.1-13.2</p>
`

      id: 's4',
      title: 'The Lasso: shrinkage that also selects',
      html: `
<p>The <b>Lasso</b> (least absolute shrinkage and selection operator) estimates coefficients of standardised predictors by maximising the log-likelihood subject to a bound on the sum of absolute coefficients:</p>
<div class="formula">maximise log L subject to Σ |b<sub>i</sub>| ≤ t</div>
<p>A standardised shrinkage factor s = t / Σ|b<sub>0</sub>| (b<sub>0</sub> the ML coefficients) can be varied over a grid between 0 and 1. With a small bound, only the strongest predictors receive non-zero coefficients; as the bound grows, further predictors enter; at a large enough bound the ordinary ML model returns. Because the absolute-value penalty has a corner at zero, some coefficients become exactly zero and those predictors leave the model. The bound t is chosen by generalised cross-validation, AIC or the bootstrap.</p>
<div class="callout book"><b>Book example</b><p>In the GUSTO-I sample, the AIC-optimal Lasso kept 7 of 8 predictors (sex set to zero) and 14 of 17 predictors. Coefficients for the 8-predictor model, ML → uniform shrinkage → PML → Lasso: shock 1.12 / 0.97 / 1.17 / 1.09; age > 65 years 1.49 / 1.30 / 1.21 / 1.36; sex 0.07 / 0.06 / 0.11 / 0.00.</p></div>
<h3>What shrinkage does to the predictions</h3>
<p>All three methods give a less extreme distribution of the linear predictor than standard ML: the linear predictor is pulled towards its average. The highest risks come down and the lowest go up. The ordering of patients changes little with uniform shrinkage (not at all, in fact, since every coefficient is multiplied by the same s) and only somewhat with PML or the Lasso.</p>
<div class="callout eg"><b>Worked example: effect on two women (synthetic)</b><p>ML model: intercept −3.40, prior preterm birth 1.62, bacteriuria 0.98.<br>Woman A (both risk factors): lp = −3.40 + 1.62 + 0.98 = −0.80; risk = 1/(1 + e<sup>0.80</sup>) = 31.0%.<br>Woman B (neither): lp = −3.40; risk = 3.2%.<br>After uniform shrinkage s = 0.842 and re-estimation of the intercept (re-estimated value −3.05, given):<br>Woman A: lp = −3.05 + 0.842 × (1.62 + 0.98) = −0.861; risk = 29.7%.<br>Woman B: lp = −3.05; risk = 4.5%.<br>The high risk falls, the low risk rises, and A is still ranked above B.</p></div>
<div class="callout warn"><b>Pitfall</b><p>The Lasso's selection is data-driven and shares the instability of any selection procedure in small samples. Its choice of predictors, and of the bound, should be validated by repeating the whole procedure in bootstrap samples.</p></div>
<p class="src">Source: Ch. 13, §13.4; Table 13.2; Fig. 13.5</p>
`

      id: 's5',
      title: 'Does shrinkage work? Evidence and practice',
      html: `
<p>The book tested these methods by developing models in many small subsamples of the GUSTO-I trial and evaluating them in an independent test part of 20,318 patients. Two performance measures are used here (defined fully in the next module): the <b>c statistic</b>, the probability that a random patient who died received a higher prediction than a random survivor (discrimination), and the <b>calibration slope</b>, the slope of a logistic regression of the outcome on the model's linear predictor in new data. A slope of 1 is ideal; a slope below 1 means predictions are too extreme.</p>
<div class="callout book"><b>Book example (Table 13.3, 8-predictor model)</b>
<table class="data">
<thead><tr><th>Training data</th><th>Method</th><th>c</th><th>Slope</th></tr></thead>
<tbody>
<tr><td>Total training part (n = 20,512; 1,423 deaths)</td><td>Standard ML</td><td>0.789</td><td>0.944</td></tr>
<tr><td rowspan="4">61 small subsamples (n = 336; about 23 deaths)</td><td>Standard ML</td><td>0.75</td><td>0.66</td></tr>
<tr><td>Uniform shrinkage</td><td>0.75</td><td>1.01</td></tr>
<tr><td>Penalised ML</td><td>0.76</td><td>0.93</td></tr>
<tr><td>Lasso</td><td>0.75</td><td>0.83</td></tr>
<tr><td rowspan="4">23 large subsamples (n = 892; about 62 deaths)</td><td>Standard ML</td><td>0.78</td><td>0.86</td></tr>
<tr><td>Uniform shrinkage</td><td>0.78</td><td>0.97</td></tr>
<tr><td>Penalised ML</td><td>0.78</td><td>0.96</td></tr>
<tr><td>Lasso</td><td>0.78</td><td>1.01</td></tr>
</tbody></table>
<p>For the 17-predictor model in the large subsamples, the ML slope was 0.76, improved to 0.95 (uniform), 0.98 (PML) and 0.93 (Lasso).</p></div>
<p>Two lessons follow. First, shrinkage hardly changes discrimination (c moved by at most 0.01), because it barely alters the ranking of patients. Second, it largely repairs calibration: with 23 deaths per sample, ML predictions were far too extreme (slope 0.66), and shrinkage brought the slope close to 1. The benefit is greatest in small data sets and with many candidate predictors.</p>
<div class="callout key"><b>Key idea</b><p>Shrinkage is a calibration tool. Do not expect it to raise the c statistic; expect it to stop the model from promising more extreme risks than new patients will show.</p></div>
<h3>Explore it</h3>
<p>The lab below fits a fixed 14-term preterm-birth model (15 df) in complete-case subsamples of the synthetic district-hospital cohort and tests it in a large fresh sample from the same setting. In the full data, bootstrap validation suggests a shrinkage factor of about <span data-live="ptb_full_shrinkage"></span>, with <span data-live="ptb_cc_events"></span> events among complete cases.</p>
<div data-widget="shrinkageLab"></div>
<ul class="try">
<li>Set the subsample size to 250 and run 30 replications. Compare the mean calibration slope of standard ML with uniform shrinkage and ridge; note how close the three c statistics are.</li>
<li>Increase the subsample to 1500 and repeat. Observe that the ML slope moves towards 1 and the advantage of shrinkage becomes smaller.</li>
<li>At n = 250, raise the ridge λ slider step by step and watch the coefficients move towards zero; note the λ at which the mean slope is closest to 1.</li>
</ul>
<p class="src">Source: Ch. 13, §13.4.4-13.5; Table 13.3</p>

      id: 's6',
      title: 'Using external information: the adaptation method',
      html: `
<p>A small development data set can be supplemented with published evidence. Typically, many studies report the <b>univariate</b> (unadjusted) association of each predictor with the outcome, which can be pooled by meta-analysis, while <b>multivariable</b> coefficients require individual patient data, which we often have from one study only (our own). The adaptation method combines the two.</p>
<h3>Method 1</h3>
<div class="formula">b<sub>m|I+L</sub> = b<sub>u|L</sub> + (b<sub>m|I</sub> − b<sub>u|I</sub>)</div>
<p>b<sub>u|L</sub> is the univariate coefficient from the literature meta-analysis; b<sub>m|I</sub> and b<sub>u|I</sub> are the multivariable and univariate coefficients in the individual patient data. The bracket, the "adaptation factor", is how much adjustment for the other predictors changes the coefficient in our own data. We transfer that change to the precise literature estimate. The idea follows Greenland's proposal for meta-analysis. An approximate variance, ignoring covariances, is</p>
<div class="formula">var(b<sub>m|I+L</sub>) = var(b<sub>u|L</sub>) + var(b<sub>m|I</sub>) − var(b<sub>u|I</sub>)</div>
<h3>Method 2</h3>
<div class="formula">b<sub>m|I+L</sub> = b<sub>m|I</sub> + c × (b<sub>u|L</sub> − b<sub>u|I</sub>),  0 ≤ c ≤ 1</div>
<p>With c = 1 this equals method 1; with c = 0 the literature is ignored. The variance-minimising c depends on the correlation between the univariate and multivariable coefficients in the individual data (estimated by bootstrapping) and on the variances; it approaches 1 when the literature is large and the predictors are not strongly collinear.</p>
<div class="callout eg"><b>Worked example (synthetic, bacteriuria and preterm birth)</b><p>Meta-analysis of published cohorts: b<sub>u|L</sub> = 0.95 (SE 0.08).<br>Own cohort: univariate b<sub>u|I</sub> = 1.20 (SE 0.30); multivariable b<sub>m|I</sub> = 0.98 (SE 0.33).<br>Adaptation factor = 0.98 − 1.20 = −0.22.<br>Adapted coefficient = 0.95 − 0.22 = 0.73 (OR 2.08, against 2.66 from own data alone).<br>Variance = 0.08² + 0.33² − 0.30² = 0.0064 + 0.1089 − 0.0900 = 0.0253; SE = 0.159, about half the SE of 0.33 from own data alone.</p></div>
<div class="callout book"><b>Book example</b><p>Peri-operative mortality after elective abdominal aortic aneurysm surgery: own data 246 patients with 18 deaths; literature 15 series with 15,821 patients and 1,153 deaths. For age per decade: literature 0.79, own univariate 0.98, own multivariable 0.58, adapted 0.38. Scores were made from the adapted coefficients with additional shrinkage ((1 + 0.83)/2 ≈ 0.90), and the intercept was lowered by ln[odds(5%)/odds(7.6%)] = −0.44 to reflect lower current mortality. Apparent c was 0.83; optimism-corrected 0.80-0.81. In GUSTO-I simulations the adapted coefficients were much less variable than standard ML; calibration improved over ML but some shrinkage still had to be added.</p></div>
<div class="callout warn"><b>Pitfall</b><p>The method assumes that our data and the literature come from a common population, with similar correlations between predictors. Publication bias can inflate literature coefficients, and varying definitions of predictors (for example "anaemia" or "hypertension") can make pooling unrealistic.</p></div>
<p>A cruder alternative multiplies all literature univariate coefficients by one overall calibration factor estimated in the own data (a recalibrated "naive Bayes" approach). It ignores the specific correlations between predictors and, in the aneurysm example, gave clearly larger weights to the correlated cardiac comorbidities.</p>
<p class="src">Source: Ch. 14, §14.1-14.3.1; Tables 14.1-14.4</p>
`

      id: 's7',
      title: 'Bayesian estimation and the role of subject knowledge',
      html: `
<p>Bayesian estimation sets a <b>prior distribution</b> for each coefficient, which is combined with the data to give a posterior estimate. Two uses matter for prediction models.</p>
<h3>Priors centred on zero: shrinkage again</h3>
<p>If the prior for a coefficient is centred at zero, positive and negative effects are considered equally likely and large effects unlikely. The posterior estimate is pulled towards zero, much like uniform shrinkage or PML. The amount of shrinkage depends on two things: the width of the prior (narrower means more shrinkage) and the information in the data (many events and a common predictor mean little shrinkage).</p>
<h3>Informative priors</h3>
<p>A prior can also encode existing knowledge, for example "the odds ratio is probably about 2, and values below 0.5 or above 8 are very unlikely". Setting a sensible informative prior is the hardest step. Its source (expert judgement, literature review) should be documented and the prior should be wide enough. Priors can be expressed as "informationally equivalent" data, such as the knowledge of 100 patients with a given outcome, and Bayesian estimation can be done simply by <b>data augmentation</b>: adding records to the data set that represent the prior effects.</p>
<div class="callout book"><b>Book example</b><p>Greenland predicted neonatal death in a cohort of 2,992 births with only 17 deaths, using 14 predictors and priors assuming small to large effects. The Bayesian model predicted better than standard ML. A difficulty: priors must refer to multivariable effects, which are harder to elicit than univariate ones.</p></div>
<div class="callout mch"><b>Illustrative (synthetic)</b><p>A team modelling neonatal sepsis in a newborn unit has about 30 events and 11 candidate predictors. Options in increasing reliance on outside knowledge: (1) PML or uniform shrinkage on a prespecified model; (2) adapt their coefficients for maternal fever and prolonged rupture of membranes using a meta-analysis of univariate associations; (3) Bayesian estimation with documented priors. Each option makes the estimates less dependent on the noise in 30 events.</p></div>
<h3>Concluding view</h3>
<p>The common thread of Chapters 13 and 14 is that small data sets cannot carry a prediction model on their own. Subject knowledge enters through prespecification of predictors, through literature-based adaptation of coefficients, or through priors, and shrinkage protects against the remaining overfitting. Bayesian methods have not become mainstream in prediction modelling, and the main criticism remains the choice of prior.</p>
<p class="src">Source: Ch. 14, §14.3-14.4</p>
`

      title: 'What "performance" means for a prediction model',
      html: `
<p>A prediction model produces an <b>absolute risk</b> for each patient, for example "a 23% probability of preterm birth". Regression coefficients and odds ratios describe relative effects; performance measures ask how good the absolute risks are. Performance can be estimated at three levels:</p>
<ul>
<li><b>Apparent</b>: in the same data used to develop the model (optimistic).</li>
<li><b>Internally validated</b>: corrected for optimism, for example by bootstrapping in the development data.</li>
<li><b>Externally validated</b>: in new patients from another place or time.</li>
</ul>
<p>Three families of measures are used, each answering a different question.</p>
<table class="data">
<thead><tr><th>Aspect</th><th>Question</th><th>Main measures</th></tr></thead>
<tbody>
<tr><td>Overall performance</td><td>How close are predictions to the actual outcomes?</td><td>Nagelkerke R², Brier score, scaled Brier score</td></tr>
<tr><td>Discrimination</td><td>Do patients with the outcome receive higher predictions than those without?</td><td>c statistic (area under ROC curve), discrimination slope, Lorenz curve</td></tr>
<tr><td>Calibration</td><td>Do predicted risks agree with observed frequencies?</td><td>Calibration plot, calibration-in-the-large, calibration slope</td></tr>
</tbody></table>
<p>Clinical usefulness, which asks whether decisions based on the model are better than default policies, is the subject of the next module.</p>
<div class="callout book"><b>Book example: testicular cancer</b><p>Throughout the chapter the book uses a model predicting benign tissue (necrosis) in the residual mass of men treated with chemotherapy for metastatic testicular cancer. Five predictors (teratoma elements in the primary tumour, pre-chemotherapy AFP and HCG, post-chemotherapy mass size, reduction in size). Development: 544 patients, 245 with necrosis (45%). External validation: 273 patients from another centre, 76 with necrosis (28%). Internal validation: 200 bootstrap replications.</p></div>
<p class="src">Source: Ch. 15, introduction and §15.1</p>

      id: 's2',
      title: 'Overall performance: R², Brier and scaled Brier',
      html: `
<p>Overall measures quantify the distance between the predicted risk p and the actual outcome y (0 or 1) for each patient, averaged over patients. Two scoring rules are used.</p>
<h3>Nagelkerke R² (logarithmic score)</h3>
<p>The log-likelihood scores each patient by log(p) if y = 1 and log(1 − p) if y = 0. The model likelihood ratio statistic LR = −2(LL<sub>0</sub> − LL<sub>1</sub>) compares the model with an intercept-only model. Nagelkerke's R² rescales this to run from 0% to 100%:</p>
<div class="formula">R² = [1 − exp(−LR/n)] / [1 − exp(−(−2LL<sub>0</sub>)/n)]</div>
<p>The logarithmic score penalises confident wrong predictions very severely: a prediction of 1% for a woman who then delivers preterm costs log(0.01) = −4.6. At external validation, the book computes R² after recalibrating the predictions (intercept plus calibration slope), so R² then reflects the information in the model rather than its miscalibration.</p>
<h3>Brier score (quadratic score)</h3>
<div class="formula">Brier = (1/n) Σ (y<sub>i</sub> − p<sub>i</sub>)²</div>
<p>For one patient the score ranges from 0 (prediction equals outcome) to 1 (completely discordant); a prediction of 50% scores 0.25 whatever the outcome. It is less severe than the log score for predictions near 0% or 100%. A model's Brier score runs from 0 (perfect) to 0.25 for a non-informative model at 50% incidence. When the incidence is lower, the worst sensible score is lower:</p>
<div class="formula">Brier<sub>max</sub> = p̄ × (1 − p̄)² + (1 − p̄) × p̄²   (which simplifies to p̄(1 − p̄))</div>
<p>where p̄ is the average probability of the outcome (the incidence). At 10% incidence, Brier<sub>max</sub> = 0.1 × 0.9² + 0.9 × 0.1² = 0.090. Because of this dependence, the <b>scaled Brier score</b> is preferred for comparisons across settings:</p>
<div class="formula">Brier<sub>scaled</sub> = 1 − Brier / Brier<sub>max</sub>   (0% to 100%)</div>
<div class="callout eg"><b>Worked example (synthetic, 10 women)</b><p>Predicted preterm-birth risks 5, 8, 10, 12, 15, 20, 25, 30, 45, 60%; preterm births occurred in the women predicted 12%, 30% and 60% (incidence 3/10 = 30%).<br>Squared errors: 0.0025, 0.0064, 0.0100, 0.7744, 0.0225, 0.0400, 0.0625, 0.4900, 0.2025, 0.1600; sum 1.7708.<br>Brier = 1.7708/10 = 0.177.<br>Brier<sub>max</sub> = 0.3 × 0.7² + 0.7 × 0.3² = 0.147 + 0.063 = 0.210 (the Brier score of predicting 30% for everyone).<br>Scaled Brier = 1 − 0.177/0.210 = 0.157, i.e. 15.7%.</p></div>
<div class="callout book"><b>Book example (Table 15.1)</b><p>R² 38.9% (development), 37.6% (internal), 26.7% (external). Brier 0.174, 0.178, 0.161; Brier<sub>max</sub> 0.248, 0.248, 0.201; scaled Brier 29.8%, 28.2%, 20.0%. The unscaled Brier score looked <i>better</i> externally only because necrosis was less common there; the scaled score correctly shows poorer performance.</p></div>
<div class="callout warn"><b>Pitfall</b><p>Comparing raw Brier scores between populations with different incidence can reverse the conclusion. Report the scaled Brier score, or the incidence alongside the Brier score.</p></div>
<p>The Brier score can be decomposed formally into a calibration and a discrimination component; examining these separately is usually more informative, which is why the rest of this module treats them in turn. Prognostic models for long-term outcomes typically have modest R² (around 0.20 according to the book); substantial uncertainty remains for individuals.</p>
<p class="src">Source: Ch. 15, §15.1; Table 15.1; Fig. 15.1; §15.4; Ch. 4 (Nagelkerke R²)</p>

      title: 'Discrimination: sensitivity, specificity, ROC and the c statistic',
      html: `
<h3>Classification at a cutoff</h3>
<p>If we call a patient "positive" when the predicted risk is at or above a cutoff, we get a 2×2 table of true positives (TP), false positives (FP), false negatives (FN) and true negatives (TN).</p>
<div class="formula">Sensitivity = TP / N<sub>event</sub>     Specificity = TN / N<sub>no event</sub></div>
<p>A higher cutoff increases specificity and lowers sensitivity. In the book's testicular example, at a 50% cutoff for necrosis sensitivity was 68% and specificity 77%; at 70% they were 42% and 92%. A 50% cutoff is rarely defensible clinically (next module), so a summary over all cutoffs is useful.</p>
<h3>ROC curve</h3>
<p>The receiver operating characteristic (ROC) curve plots sensitivity (true positive rate) against 1 − specificity (false positive rate) as the cutoff moves from 0% (everyone positive: point 100%, 100%) to 100% (everyone negative: point 0%, 0%). A non-informative model follows the diagonal. The more separated the distributions of predictions for patients with and without the outcome, the closer the curve runs to the upper left corner.</p>
<h3>The c statistic</h3>
<p>The area under the ROC curve equals the <b>concordance (c) statistic</b>: the probability that, in a randomly chosen pair of one patient with and one without the outcome, the patient with the outcome has the higher prediction. Ties count one half. A coin flip gives 0.5 and perfect separation gives 1.</p>
<div class="formula">c = (concordant pairs + ½ × tied pairs) / (N<sub>event</sub> × N<sub>no event</sub>)</div>
<div class="callout eg"><b>Worked example (same 10 women)</b><p>Events have predictions 12%, 30%, 60%; non-events 5, 8, 10, 15, 20, 25, 45%. There are 3 × 7 = 21 pairs.<br>12% is higher than 5, 8, 10: 3 concordant pairs.<br>30% is higher than 5, 8, 10, 15, 20, 25: 6 pairs.<br>60% is higher than all 7: 7 pairs.<br>c = (3 + 6 + 7)/21 = 16/21 = 0.762.</p></div>
<p>Properties that follow from the definition:</p>
<ul>
<li>It conditions on pairs with different outcomes, so it is <b>insensitive to the incidence</b> of the outcome, unlike R² or Brier.</li>
<li>It is a rank statistic, so it is <b>insensitive to calibration errors</b>: adding a constant to every patient's log-odds leaves c unchanged.</li>
<li>It is linearly related to Somers' D (c = D/2 + 0.5) and to the Mann-Whitney U statistic.</li>
<li>The "pair" interpretation is somewhat artificial clinically, where patients are seen one at a time.</li>
</ul>
<p>Confidence intervals are best obtained by bootstrapping; standard formulas for comparing c between models are valid only for prespecified models.</p>
<div class="callout book"><b>Book example</b><p>Testicular model: c = 0.818 [0.783-0.852] at development, 0.812 after bootstrap correction, 0.785 [0.726-0.844] at external validation. In simulations at 50% incidence, c of 0.98, 0.83, 0.71, 0.64, 0.60 and 0.50 went with R² of 87%, 43%, 17%, 8%, 4% and 0%; at lower incidence R² was lower for the same c.</p></div>
<p>For survival outcomes, Harrell's c uses all pairs that can be ordered: both have an event, or one has an event before the other's censoring time.</p>
<p class="src">Source: Ch. 15, §15.2.1-15.2.4, §15.2.7-15.2.8; Table 15.4; Figs 15.2-15.4</p>
`

<h3>Discrimination slope</h3>
<div class="formula">Discrimination slope = mean p (patients with outcome) − mean p (patients without)</div>
<p>It is shown naturally as box plots of predictions by outcome. In the 10-woman example: mean prediction among the 3 events = (0.12 + 0.30 + 0.60)/3 = 0.340; among the 7 non-events = 1.28/7 = 0.183; slope = 0.157. It is easy to explain, but it depends on incidence: for the same c, the slope is lower when the outcome is rare.</p>
<div class="callout book"><b>Book example</b><p>Testicular model discrimination slope: 0.301 (development), 0.294 (internal), 0.237 (external). Part of the external drop reflects the lower prevalence of necrosis (28% versus 45%).</p></div>
<h3>Lorenz (concentration) curve</h3>
<p>Rank patients by predicted risk. On the x-axis plot the cumulative proportion of patients classified as negative (lowest risks first); on the y-axis the proportion of all outcomes that fall among them, the "missed" outcomes. A non-informative model gives a straight diagonal line; a good model stays low for a long way (many patients classified negative while few outcomes are missed) and rises steeply at the end. The Gini index summarises it: G = 2A, where A is the area between the curve and the diagonal. Specific points are often more useful, such as the share of outcomes missed when the lowest 25% are classified negative.</p>
<div class="callout book"><b>Book example</b><p>Classifying the 25% with highest predicted necrosis as "no resection" missed 9% of tumours at development and 13% at validation; classifying 75% as no resection missed 58% and 65%. The policy "resect if mass &gt; 10 mm", which uses only one predictor, performed worse.</p></div>
<div class="callout warn"><b>Pitfall</b><p>The appearance of a Lorenz curve depends strongly on incidence. With a rare outcome (for example 1%, as in screening) the curve looks impressive; with a common outcome it looks poor for the same c.</p></div>
<table class="data">
<thead><tr><th>Measure</th><th>Visualisation</th><th>Strength</th><th>Weakness</th></tr></thead>
<tbody>
<tr><td>c statistic</td><td>ROC curve</td><td>Independent of incidence; pair interpretation</td><td>Interpretation artificial</td></tr>
<tr><td>Discrimination slope</td><td>Box plot</td><td>Intuitive</td><td>Depends on incidence</td></tr>
<tr><td>Lorenz curve</td><td>Concentration curve</td><td>Shows outcomes missed versus patients spared</td><td>Depends on incidence</td></tr>
</tbody></table>

</ul>
<p class="src">Source: Ch. 15, §15.2.5-15.2.6, §15.2.8; Tables 15.3-15.4; Figs 15.5-15.8</p>

      title: 'Calibration: plot, calibration-in-the-large and slope',
      html: `
<p><b>Calibration</b> is agreement between predicted risks and observed outcome frequencies: among 100 women each predicted 20%, about 20 should deliver preterm.</p>
<h3>Calibration plot</h3>
<p>Predicted risk on the x-axis, observed outcome on the y-axis, and the 45° identity line as reference. Because binary outcomes are only 0 or 1, the observed frequency is estimated either by grouping (for example deciles of predicted risk, plotting mean predicted against observed proportion per group) or by a smoother such as loess. Small groups make the plot noisy. Adding the distribution of predictions (a histogram, separately for patients with and without the outcome) turns the calibration plot into a "validation plot" that also shows discrimination.</p>
<h3>Calibration-in-the-large</h3>
<p>Compares the mean predicted risk with the observed incidence. In the development data this agreement is guaranteed by the intercept, and it remains at bootstrap validation; it becomes informative only in new data. As an odds ratio:</p>
<div class="formula">OR = odds(mean predicted) / odds(mean observed)</div>
<p>For formal estimation, the model's linear predictor (lp, the log-odds) is entered as an <b>offset</b>, i.e. with its coefficient fixed at 1:</p>
<div class="formula">logit(P(y = 1)) = a + offset(lp)</div>
<p>The intercept a (reported as "a | b = 1") is the average difference in log-odds between observed and predicted. a > 0 means the model underestimates risk; a &lt; 0 means overestimation.</p>
<h3>Calibration slope</h3>
<p>Fit the <b>recalibration model</b>, with the linear predictor as the only covariate and its coefficient free:</p>
<div class="formula">logit(P(y = 1)) = a + b<sub>overall</sub> × lp</div>
<p>b<sub>overall</sub> is the calibration slope. Interpretation depends on where it is estimated:</p>
<ul>
<li><b>Apparent</b>: b = 1 by construction (ML fits best in its own data).</li>
<li><b>Internal validation</b>: b &lt; 1 reflects overfitting and equals the shrinkage the model needs (Module 10).</li>
<li><b>External validation</b>: b reflects both overfitting and true differences in predictor effects between settings. b &lt; 1: predictions too extreme (high risks too high, low risks too low). b &gt; 1: predictions too moderate.</li>
</ul>
<div class="callout eg"><b>Worked example (synthetic)</b><p>A preterm-birth model predicts a mean risk of 12% in a referral hospital where the observed incidence is 17%.<br>OR = (0.12/0.88) / (0.17/0.83) = 0.1364/0.2048 = 0.666: the model underestimates the odds by about one third on average.<br>Equivalent log-odds difference: logit(0.17) − logit(0.12) = −1.586 − (−1.992) = 0.41 (approximately a | b = 1, if predictions were similar for all women).<br>In the 10-woman example: mean predicted 23% versus observed 30%; OR = (0.23/0.77)/(0.30/0.70) = 0.70.</p></div>
<div class="callout book"><b>Book example (Table 15.8)</b><p>Testicular model: calibration-in-the-large 0 (development), 0 (internal), −0.03 (external); calibration slope 1, 0.97 (internal, equal to the shrinkage factor) and 0.74 (external). The overall test for miscalibration at external validation gave p = 0.13.</p></div>
<h3>Explore it</h3>
<div data-widget="calibrationLab"></div>
<ul class="try">
<li>Set the true calibration slope to 0.6 and intercept shift to 0. Observe the plotted curve crossing the identity line: high predictions are too high and low predictions too low, while calibration-in-the-large stays near 0.</li>
<li>Return the slope to 1 and set the intercept shift to +1.0. The whole curve lies above the identity line (systematic underestimation); note that c is unchanged.</li>
<li>With slope 0.8, compare n = 200 with n = 5000. Note how much wider the scatter of the decile points is at the small sample size.</li>
</ul>
<p class="src">Source: Ch. 15, §15.3.1-15.3.5; Table 15.8; Figs 15.9-15.10</p>
`

      html: `
<p>Each component of the recalibration model can be tested with a Wald or likelihood ratio test.</p>
<table class="data">
<thead><tr><th>Test</th><th>Null hypothesis</th><th>df</th></tr></thead>
<tbody>
<tr><td>Calibration-in-the-large</td><td>a = 0 given b<sub>overall</sub> = 1 (offset model)</td><td>1</td></tr>
<tr><td>Calibration slope</td><td>b<sub>overall</sub> = 1</td><td>1</td></tr>
<tr><td>Recalibration (overall miscalibration)</td><td>a = 0 and b<sub>overall</sub> = 1</td><td>2</td></tr>
</tbody></table>
<p>The slope test can be done by adding the linear predictor as both an offset and a covariate: logit(P(y = 1)) = a + b<sub>miscalibration</sub> × lp + offset(lp); b<sub>miscalibration</sub> estimates b<sub>overall</sub> − 1. The 2-df recalibration test is efficient against the two commonest problems, systematic differences in average risk and overfitted predictor effects, and its parameters are interpretable. For survival (Cox) models only the slope can be assessed this way, since the baseline hazard is re-estimated freely.</p>
<h3>Hosmer-Lemeshow test</h3>
<p>Patients are grouped by deciles of predicted risk; the expected number of events per group (sum of predictions) is compared with the observed number by a χ² statistic with 8 df at development and 9 df at external validation. Drawbacks:</p>
<ul>
<li>Arbitrary choices of grouping (deciles or other quantiles; risk intervals).</li>
<li>Poor power against the common patterns of miscalibration (systematic shift, overfitting).</li>
<li>A non-significant result in the development data is expected, because the model was fitted to those data: it may add face validity for some readers but has no scientific meaning.</li>
</ul>
<div class="callout book"><b>Book example (Table 15.7)</b><p>Testicular model Hosmer-Lemeshow: χ² = 5.9, df 8, p = 0.66 at development; χ² = 9.2, df 9, p = 0.42 at validation, even though the external calibration slope was 0.74.</p></div>
<p>Alternatives include the Goeman-le Cessie test (based on smoothed residuals, sensitive to missed nonlinearity or interaction), Harrell's E (average absolute difference between the smoothed calibration curve and the identity line) and observed-versus-expected comparisons in subgroups.</p>
<div class="callout warn"><b>Critical:</b><p>A p-value is not a measure of calibration. In a small validation sample the null hypothesis of good calibration will rarely be rejected even when miscalibration is serious; in a very large sample trivial miscalibration becomes "significant". Always report the size of calibration-in-the-large and the calibration slope, with the calibration plot.</p></div>
<p class="src">Source: Ch. 15, §15.3.7-15.3.10; Tables 15.5-15.8</p>
`

    {
      id: 's7',
      title: 'How calibration, discrimination and overall performance relate',
      html: `
<ul>
<li><b>Calibration-in-the-large is independent of discrimination.</b> Changing the incidence, as in a case-control sample, shifts all risks without altering their ranking, so c is unchanged.</li>
<li><b>The calibration slope is linked to discrimination.</b> An overfitted model (slope &lt; 1 at validation) shows both poorer calibration and poorer discrimination in new patients.</li>
<li><b>Perfect calibration is possible with poor discrimination.</b> If all predictions lie between 9% and 11% at a 10% incidence, the model can be well calibrated but cannot separate patients. At external validation, such a narrow range can arise from a homogeneous case-mix.</li>
<li><b>A drop in c at external validation</b> may therefore reflect overfitting (then calibration is also poor) or a more homogeneous case-mix (calibration may be fine).</li>
<li><b>A well-discriminating model can be badly calibrated</b>; this can be corrected by updating the model for the new setting.</li>
<li><b>Overall measures (R², Brier)</b> combine calibration and discrimination; they are useful for comparing models on the same data but hide which aspect is deficient.</li>

<p>A prediction model gives a probability. A clinician must decide: refer or not, treat or not, test further or not. To act on a probability, we need a <b>decision threshold</b> (also called a classification cutoff): patients with predicted risk at or above the threshold are classified as positive (for example, treated), those below as negative.</p>
<p>The book uses the term <b>clinical usefulness</b> for the ability of a model to make such classifications better than a <b>default policy</b> that does not use the model, such as treating everyone or treating no one.</p>
<h3>Why the 50% cutoff is usually wrong</h3>
<p>Classifying at 50% implies that a false-positive and a false-negative classification are equally bad. In medicine this is seldom true. Often missing a patient with the outcome is much worse than unnecessarily treating a patient without it.</p>
<ul>
<li><b>Low threshold</b>: bacterial meningitis is usually treatable if antibiotics start early but devastating if missed, so a low threshold is appropriate in order not to miss cases.</li>

<p>Some argue that discrimination is the primary property, since miscalibration can be corrected in a new setting. But when a model is applied, its miscalibration in that setting is not yet known. Clinical usefulness depends on the combination of three things:</p>
<ol>
<li><b>Discrimination</b>: some is needed for any usefulness.</li>
<li><b>Calibration</b>: miscalibrated risks give biased information, which can make decisions worse than a default policy, i.e. a <b>negative</b> gain in NB. A well-calibrated model with limited discrimination gives a limited, but never negative, gain.</li>
<li><b>The distribution of predictions around the threshold</b>: if all predictions lie on one side of the threshold, the model changes no decision and is not useful, even with a "good" c of 0.8.</li>
</ol>
<div class="callout warn"><b>Critical:</b><p>Labels such as "c &gt; 0.7 acceptable, &gt; 0.8 good, &gt; 0.9 excellent" do not establish clinical usefulness. No minimum c guarantees usefulness, because c ignores calibration and the consequences of decisions. Good calibration and discrimination are necessary but not sufficient.</p></div>
<div class="callout book"><b>Book example (Table 16.5)</b><p>The testicular model looked satisfactory at validation (c 0.79, calibration slope 0.74, miscalibration test p = 0.13), yet its NB gain at the 30% threshold was 0. Sensitivity was high (96%) but specificity low (21%), so few men could be spared surgery.</p></div>
<h3>Aim of the model determines which measure matters most</h3>
<table class="data">
<thead><tr><th>Application</th><th>Primary requirement</th></tr></thead>
<tbody>
<tr><td>Targeting scarce preventive resources to a high-risk group</td><td>Discrimination (ranking)</td></tr>
<tr><td>Informing patients and making clinical decisions</td><td>Calibration, together with discrimination and the distribution around the threshold</td></tr>
<tr><td>Selecting high-risk patients for an RCT</td><td>Calibration</td></tr>
<tr><td>Covariate adjustment in an RCT</td><td>Discrimination</td></tr>
<tr><td>Confounder adjustment</td><td>Inclusion of all relevant confounders; very high c is suspicious (adjusting for something too close to the outcome or exposure)</td></tr>

<p class="src">Source: Ch. 16, §16.2-16.2.2; Table 16.5; §16.4</p>

      html: `
<p>A prediction model gives probabilities and leaves the action to the clinician, which allows for patient-specific thresholds. A <b>decision rule</b> attaches an explicit action to predictions, which may increase impact on practice. Rules are most useful when decisions are complex, stakes are high, or savings are possible without compromising care. Few rules have been formally tested for their effect on patient outcomes; the impact of most is unknown.</p>
<p>Some diagnostic rules aim at 100% sensitivity (for example the Ottawa ankle rules and CT head rules), accepting false positives; this implies that a false negative is treated as infinitely costly.</p>
<h3>Levels of evidence (Reilly and Evans)</h3>
<table class="data">
<thead><tr><th>Level</th><th>Study</th><th>Standard</th><th>Implication</th></tr></thead>
<tbody>
<tr><td>1</td><td>Derivation</td><td>Identification of predictors; blinded outcome assessment</td><td>Needs validation before use</td></tr>
<tr><td>2</td><td>Narrow validation</td><td>Prospective test in one setting</td><td>Use cautiously in similar patients</td></tr>
<tr><td>3</td><td>Broad validation</td><td>Varied settings, wide spectrum of patients and physicians</td><td>Predictions can be used with confidence; needs impact analysis</td></tr>
<tr><td>4</td><td>Narrow impact analysis</td><td>Prospective demonstration in one setting that the rule improves decisions</td><td>Use cautiously in similar settings</td></tr>
<tr><td>5</td><td>Broad impact analysis</td><td>Demonstration in varied settings</td><td>Use with confidence that care improves</td></tr>
</tbody></table>
<p>Validation shows the <b>efficacy</b> of a rule (what 100% adherence could achieve); impact analysis shows its <b>effectiveness</b>, which depends on clinicians' adherence. Clinicians may overrule a rule, which can improve or dilute its effect. Barriers include scepticism, doubts about clinical sense, confidence in own judgement, medicolegal fears, and practical availability and ease of use. An impact analysis is ideally a randomised trial, often randomised by centre, with a risk of contamination between arms.</p>
<h3>Verification bias</h3>
<p>If the outcome is only verified in selected patients (in the testicular example, men with masses ≤ 10 mm were usually not resected, so their histology is unknown), sensitivity, specificity and clinical usefulness measures are affected, and the evaluation says nothing about the unverified group. Model coefficients remain valid if the selection criterion is a predictor in the model.</p>

<p class="src">Source: Ch. 16, §16.1.9, §16.3-16.4; Table 16.6; Ch. 15, §15.2.9</p>
`

      id: 's1',
      title: 'What validation is for',
      html: `
<p>A prediction model is built to give valid predictions for <i>future</i> patients. The data set used to develop it has no interest in itself; it is only a means of learning about patients who will be seen later. Validation is therefore an essential part of the modelling process. The question it answers is simple: how good are the predictions when the model is used on patients who did not contribute to its estimation?</p>

<h3>Two kinds of validity</h3>
<p>Think of a <b>superpopulation</b>, for example all pregnant women booking for antenatal care. It consists of several <b>settings</b>: a district hospital in one period, a referral hospital in another, a primary care network elsewhere. We develop the model on a sample from one setting (setting 1).</p>
<ul>
<li><b>Internal validity</b> (reproducibility): does the model perform as claimed for patients from the same setting as the development sample? <b>Internal validation</b> is the process of estimating this, using only the development data.</li>
<li><b>External validity</b> (generalisability, transportability): does the model perform adequately in other settings that are <i>plausibly related</i>, that is, parts of the same superpopulation to which it would be reasonable to apply the model? <b>External validation</b> estimates this using fully independent samples from settings 2, 3 and onwards.</li>
</ul>
<p>Which populations are "plausibly related" is a matter of subject knowledge and study design judgement, not statistics. Settings may differ in how patients are selected (referral centre versus a general setting), in time, and in how predictors and outcome are defined. The more often, and the more diverse the settings in which a model has been validated, the more confidence we have in its generalisability, as with any scientific hypothesis.</p>

<figure>

<h3>What is measured</h3>
<p>Validation re-estimates the performance measures introduced earlier, now in data the model has not been fitted to:</p>
<ul>
<li><b>c statistic</b>: the probability that a randomly chosen patient with the outcome has a higher predicted risk than a randomly chosen patient without it (0.5 = no discrimination, 1 = perfect).</li>
<li><b>Calibration-in-the-large</b>: does the average predicted risk equal the observed outcome frequency? Estimated as the intercept <span class="m">a</span> in logit(P(y=1)) = a + offset(lp), where lp is the model's linear predictor; ideal value 0.</li>
<li><b>Calibration slope</b>: the coefficient <span class="m">b</span> in logit(P(y=1)) = a + b × lp; ideal value 1. A slope below 1 means predictions are too extreme (low risks too low, high risks too high), the signature of overfitting.</li>
<li>Overall measures (Nagelkerke R², Brier score) and clinical usefulness (net benefit) can be validated in the same way.</li>
</ul>
<div class="callout key"><b>Key idea</b><p>In the development sample, a model fitted by maximum likelihood always has a calibration slope of exactly 1 and calibration-in-the-large of 0. These values carry no information. Only validation tells us how far predictions will drift in new patients.</p></div>
<p class="src">Source: Ch. 17, §17.1 (Fig. 17.1)</p>

<p>Internal validation methods differ in which part of the data is used to fit the model and which part to test it. The table summarises the four common approaches.</p>
<table class="data">
<thead><tr><th>Method</th><th>Model developed on</th><th>Performance tested on</th></tr></thead>
<tbody>
<tr><td>Apparent</td><td>Original sample, 100%</td><td>Same original sample, 100%</td></tr>
<tr><td>Split-sample</td><td>Random 50–67% of the sample</td><td>The remaining 50–33%</td></tr>
<tr><td>Cross-validation</td><td>From 2 × 50% up to 10 × 90% of the sample</td><td>The left-out parts (2 × 50% to 10 × 10%)</td></tr>
<tr><td>Jack-knife (leave-one-out)</td><td>N × (N − 1 patients)</td><td>Each patient once</td></tr>
<tr><td>Bootstrap</td><td>Bootstrap samples of size N</td><td>Original sample, 100%</td></tr>
</tbody>
</table>

<h3>Apparent validation</h3>
<p>Performance is calculated in the same data used to estimate the coefficients. Because the coefficients were chosen to fit these data as well as possible, the estimate is <b>optimistic</b> (biased upwards). It is, however, <b>stable</b>: 100% of the data is used both for fitting and for testing. With very large samples and few predictors, the optimism is small and apparent performance is close to the truth.</p>

<h3>Split-sample validation</h3>
<p>The sample is randomly divided into a development part and a test part, typically 50:50 or 2/3:1/3. It imitates an external validation study, but the split is at random, so both parts come from the same setting. It tests internal validity only.</p>
<p>Its problems are several:</p>
<ul>
<li><b>Imbalance by chance.</b> Random halves can differ noticeably in outcome frequency and predictor distributions, more so for rare or skewed predictors. A practical partial remedy is to stratify the split by outcome and key predictors.</li>
<li><b>Variance.</b> The model is fitted on part of the data, so its coefficients are less stable; and the test part is small, so its performance estimate is imprecise.</li>
<li><b>Temptation.</b> An unlucky split may show poor performance, and an investigator may be tempted to repeat the split until the results look better.</li>
<li><b>Bias.</b> It measures the performance of a model built on part of the data, whereas we want to know the performance of the model built on all of it.</li>
</ul>
<div class="callout book"><b>Book example</b><p>In a GUSTO-I subsample of 429 patients with acute myocardial infarction, 30-day mortality was 5.6% (24/429), but a random 50% part could easily show 4% and the other half 7%. Shock occurred in only 1.6% (7/429), so a random development half might contain no patient with shock at all.</p></div>
<p>Simulation studies show that split-sample validation becomes reasonable only with rather large samples, but with large samples the apparent performance is already a good guide. The book summarises this as a method "that works when we do not need it". It should be replaced by more efficient internal validation (bootstrapping) and by genuine external validation.</p>
<div class="callout mch"><b>Illustrative (synthetic)</b><p>A district hospital cohort has 2000 women and 234 preterm births. A 2/3:1/3 random split leaves about 78 preterm births in the test third, so the c statistic and calibration slope in that third are estimated with wide uncertainty, while the model itself is fitted on only about 156 events.</p></div>
<p class="src">Source: Ch. 17, §17.2.1–17.2.2 (Table 17.1)</p>
`

      id: 's3',
      title: 'Cross-validation',
      html: `
<p>Cross-validation extends the split-sample idea to gain stability. In <b>k-fold cross-validation</b> the data are divided at random into k parts of equal size. The model is developed on k − 1 parts and tested on the part left out; this is repeated k times so that every patient is used once for testing. The performance estimate is the average over the k test parts.</p>
<div class="callout eg"><b>Worked example: 10-fold cross-validation</b><p>A cohort of 1500 women is divided at random into 10 folds of 150. Round 1: fit the model on folds 2–10 (1350 women), calculate the c statistic in fold 1. Round 2: fit on folds 1 and 3–10, test on fold 2. After 10 rounds every woman has received exactly one "out-of-sample" prediction. The cross-validated c is the mean of the 10 fold-specific values (or the c calculated on all 1500 out-of-sample predictions). Each fit uses 90% of the data, compared with 50–67% in a split-sample design.</p></div>
<h3>Strengths and limitations</h3>
<ul>
<li>A larger share of the data (for example 90%) is used to fit each model, which is an advantage over split-sample validation.</li>
<li>The result still depends on the random division into folds. Truly stable results may require repeating the whole procedure many times, for example 50 repetitions of 10-fold cross-validation ("multi-fold cross-validation").</li>
<li>The extreme form leaves out one patient at a time (the <b>jack-knife</b>). With large numbers of patients this is not efficient.</li>
<li>Cross-validation may <b>not reflect all sources of model uncertainty</b>, in particular uncertainty created by automated variable selection. Each development set overlaps heavily with the full sample (with the jack-knife it differs by one patient), so largely the same predictors are selected each time and the instability of selection is hidden.</li>
</ul>
<div class="callout book"><b>Book example</b><p>In a GUSTO-I subsample of 785 patients (52 deaths), 10-fold cross-validation of a backward stepwise procedure suggested a stable selection of four "important" predictors (shock, age over 65, high-risk infarction, tachycardia). Bootstrapping the same procedure showed much wider variability in which predictors were selected.</p></div>
<div class="callout warn"><b>Pitfall</b><p>A stable cross-validation result does not prove that a stepwise-selected model is stable. Cross-validation tends to understate how much the selected set of predictors would change in another sample from the same population.</p></div>
<p class="src">Source: Ch. 17, §17.2.3</p>
`

<p>A <b>bootstrap sample</b> is drawn with replacement from the original sample and has the same size N. Some patients appear more than once and others not at all (on average about 63.2% of the original patients appear at least once). Drawing bootstrap samples from the original sample mimics drawing new samples from the underlying population.</p>
<h3>The optimism-correction procedure</h3>
<ol>
<li>Fit the model on the original sample and calculate its <b>apparent</b> performance (for example c<sub>app</sub>).</li>
<li>Draw a bootstrap sample of size N.</li>
<li>Develop a model in the bootstrap sample, <b>repeating every modelling step</b> (coding decisions, selection, shrinkage). Calculate its performance in the bootstrap sample (c<sub>boot</sub>).</li>
<li>Apply this bootstrap model to the original sample and calculate its performance there (c<sub>test</sub>).</li>
<li>Optimism for this replicate = c<sub>boot</sub> − c<sub>test</sub>.</li>
<li>Repeat steps 2–5 many times; 100–200 replicates are often sufficient, although one simulation study reached a plateau only after 500.</li>
<li>Optimism-corrected performance = c<sub>app</sub> − mean optimism.</li>
</ol>
<div class="formula">c<sub>corrected</sub> = c<sub>app</sub> − mean(c<sub>boot</sub> − c<sub>test</sub>)</div>
<p>The same procedure applies to R², the Brier score and the calibration slope. For the slope, the apparent value is 1 by construction, so the corrected slope equals the mean slope of the bootstrap models when applied to the original sample. This value estimates the shrinkage factor needed.</p>
<h3>Why the bootstrap is preferred</h3>
<ul>
<li><b>Stable</b>: models are developed and tested on samples of size N, as in apparent validation. Estimating the optimism adds a little uncertainty, which is negligible with enough replicates.</li>
<li><b>Honest about model uncertainty</b>: because selection is replayed in each bootstrap sample, simulations show the bootstrap can reflect the extra optimism created by variable selection.</li>
<li><b>Efficient</b>: all data are used to develop the final model.</li>
</ul>
<h3>The limitation: steps that cannot be replayed</h3>
<p>Only automated strategies can be replayed: fitting a prespecified full model, or an automated stepwise rule. Many analyses include informal steps such as collapsing categories, truncating outliers after inspection, judging linearity from a plot, or trying some interactions. When these cannot be repeated, a reasonable approximation is to bootstrap at least the full model with all candidate predictors. For example, if 30 candidates were screened univariately at p &lt; 0.50 and then reduced by backward selection at p &lt; 0.20, one can validate the full 30-predictor model, or replay the backward selection at p &lt; 0.20 while ignoring the univariate screen.</p>
<div class="callout warn"><b>Critical:</b><p>Validating only the finally selected model, as if it had been specified in advance, ignores all selection steps and understates optimism. In one study the bootstrap optimism in the c statistic was 0.07 when all modelling steps were replayed, against 0.01 when the final model was treated as predefined. A reported "internally validated" c that skipped the selection steps cannot be trusted.</p></div>
<div data-widget="validationLab"></div>
<ul class="try">
<li>Set the development sample size to 250 and run 20 replications. Compare where the apparent c sits relative to the true c, and how widely the split-sample estimates scatter compared with the bootstrap estimates.</li>
<li>Increase the development sample size to 1200 and run again. Observe how the gap between apparent and true c narrows and how the spread of every method shrinks.</li>
<li>At n = 250, compare 10-fold cross-validation with bootstrap correction: which has the smaller spread around the true value?</li>
</ul>
<p class="src">Source: Ch. 17, §17.2.4; Ch. 5, §5.3</p>
`

      html: `
<p>Internal validation always splits or resamples the development data at random. External validation, by contrast, uses patients who <b>differ in some respect</b> from the development patients. Four aspects of transportability can be tested:</p>
<ul>
<li><b>Historic (temporal)</b>: performance in a different, usually more recent, period.</li>
<li><b>Geographic (spatial)</b>: performance in other hospitals or regions.</li>
<li><b>Methodological</b>: performance when data are collected differently, for example comorbidity taken from claims data instead of patient charts.</li>
<li><b>Spectrum</b>: performance in patients who are on average more (or less) advanced in their disease, or have a somewhat different disease; for example a model developed in secondary care applied in primary care, or a model from a randomised trial applied to a broader, less selected population.</li>
</ul>
<p>A second dimension is <b>who</b> does the validation. Adequate performance found by independent investigators in their own setting is more convincing than the same result from the developers.</p>
<table class="data">
<thead><tr><th>Type</th><th>Characteristics</th></tr></thead>
<tbody>
<tr><td>Temporal validation</td><td>More recent patients, often prospectively collected; may be the most recent part of the development data set aside</td></tr>
<tr><td>Geographic validation</td><td>Multi-site testing; "leave-one-centre-out" cross-validation in collaborative data</td></tr>
<tr><td>Fully independent validation</td><td>Other investigators at another site</td></tr>
</tbody>
</table>
<p>Mixed forms occur. A testicular cancer model was validated in 172 patients: 100 more recently treated patients from the development hospitals (temporal) and 72 from a hospital not involved in development (geographic).</p>
<div class="callout book"><b>Book example: temporal validation</b><p>A model for Lynch syndrome mutations was developed in 898 patients tested in 2000–2003 and validated in 1016 tested in 2003–2004. Mutation prevalence was 15% at validation against 14% at development, with a mean predicted probability of 13%. A slightly higher intercept (+0.25, about 25% higher odds) corrected this. The c statistic stayed about 0.80. The final model was estimated on the combined 1914 patients.</p></div>
<h3>Geographic validation</h3>
<p>Geographic validation can be seen as cross-validation in which the splits are made by centre instead of at random. It is often possible in collaborative studies and is more meaningful than random cross-validation. Its weakness is that each centre's validation sample may be small, so results are easily over-interpreted ("the model is not valid in hospital X"). Emphasis should be on <b>general consistency</b> across centres; a striking finding in one centre suggests the need for further validation there before use.</p>
<div class="callout book"><b>Book example: geographic validation</b><p>A testicular cancer model validated centre by centre in six groups showed c statistics around 0.8 in all, with no significant miscalibration by the Hosmer-Lemeshow test except in one centre.</p></div>
<h3>Fully independent validation</h3>
<p>Other investigators may use slightly different predictor and outcome definitions and select patients differently. Such validations often give less favourable results than temporal or geographic ones.</p>
<div class="callout book"><b>Book example: fully independent validation</b><p>Three nomograms for indolent prostate cancer, developed in clinical patients, were validated in 247 men from a screening programme. Mean predicted probabilities were 24%, 22% and 15%, while 49% actually had indolent cancer: a large calibration-in-the-large problem. Discrimination was a little lower than at development (areas under the ROC curve 0.61, 0.72, 0.76 against 0.64, 0.74, 0.79). A new intercept, with coefficients kept close to their original values, addressed the problem.</p></div>
<p class="src">Source: Ch. 17, §17.3 (Tables 17.2–17.6, Fig. 17.6)</p>
`

<p>Poor external performance has two families of explanation: weaknesses in how the model was developed, and genuine differences between the development and validation settings.</p>
<h3>Inadequate development</h3>
<ul>
<li>A small development sample, or patients from a single centre. A review of more than 25 models in traumatic brain injury noted this pattern.</li>
<li>Suboptimal analysis: stepwise selection in a small sample with many candidate predictors, and no shrinkage to compensate for overfitting. Such models have coefficients that are too large on average, so predictions are too extreme in new patients (calibration slope below 1).</li>
</ul>
<h3>Differences between settings</h3>
<ul>
<li><b>Coding of predictors and outcome.</b> Definitions that differ slightly between centres change the meaning of a coefficient.</li>
<li><b>Units of measurement.</b> Laboratory values in mg/dL in one setting and mmol/L in another were already recognised as a transport problem for a jaundice rule in the 1980s.</li>
<li><b>Errors in applying a published model.</b> If a model is published as a nomogram with non-linear terms, deriving the formula is difficult and mistakes are likely. The units and the intercept require special attention; contacting the developers can prevent errors.</li>
<li><b>Predictors unavailable at validation.</b> A constant (mean or median) can be substituted, but this limits performance. A Dutch aneurysm surgery model performed poorly in a UK trial where two of its seven predictors were missing, and better in a Rotterdam series where all but one were available.</li>
<li><b>True differences</b> in case-mix and in predictor effects. Module 14 analyses these patterns systematically.</li>

<p>Any internal validation technique validates the <b>modelling process</b>, not one specific set of coefficients. The bootstrap asks: if we applied this whole strategy (coding, selection, estimation) to a new sample from the same population, how well would the resulting model predict? It follows that:</p>
