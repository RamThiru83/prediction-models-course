      html: `
<p>When a model is applied in a new setting, two things determine how well it performs: the <b>validity of its regression coefficients</b> in that setting, and the <b>case-mix</b> of the patients there. Internal validity is a minimum prerequisite: a model that is overfitted already in its own setting will not generalise.</p>
<h3>Case-mix</h3>
<p><b>Case-mix</b> means the distribution of patient characteristics. Three parts matter:</p>
<ul>
<li><b>Observed predictors X</b>: the predictors included in the model. Their distribution differs when, for example, a model from secondary care is applied in tertiary care, or a model from a randomised trial is applied to a less selected population.</li>
<li><b>Missed predictors Z</b>: characteristics that affect the outcome but are not in the model, whether observable or not. Their distribution can differ between settings, and by definition this cannot be ruled out in advance. Z may be independent of X or correlated with it.</li>
<li><b>Outcomes Y</b>: the design can change the outcome frequency directly, as in a case-control study that samples cases and controls in a ratio different from the population.</li>
</ul>
<h3>Coefficients</h3>
<ul>
<li><b>Coefficients smaller than expected</b>: an overfitted model, typically from a small development sample with many candidate predictors and no shrinkage, has coefficients that are too large on average. At validation the effect of the linear predictor appears smaller.</li>
<li><b>Coefficients truly different</b>: genuine differences between populations, from differing definitions of predictors or outcome, or different selection of patients.</li>
</ul>
<p>Even when the true coefficients are identical, coefficients re-estimated in a finite validation sample will differ from the development estimates by chance, some larger and some smaller. Comparing coefficients one by one between two small samples is therefore uninformative; it would be a coincidence if they agreed well.</p>
<table class="data">
<thead><tr><th>Difference</th><th>Characteristic</th><th>Typical situation</th></tr></thead>
<tbody>
<tr><td>Case-mix in X</td><td>More or less severe, or more or less heterogeneous, according to included predictors</td><td>Validation in a referral centre; wider or narrower inclusion criteria</td></tr>
<tr><td>Case-mix in Z</td><td>Different selection on characteristics outside the model</td><td>Validation in a different type of setting</td></tr>
<tr><td>Case-mix in Y</td><td>Retrospective sampling of cases and controls</td><td>Case-control design</td></tr>
<tr><td>Coefficients smaller</td><td>Overfitted model</td><td>Model from a small development sample</td></tr>
<tr><td>Coefficients different</td><td>Truly different population</td><td>Validation in a different setting</td></tr>
</tbody>
</table>
<div class="callout mch"><b>Illustrative (synthetic)</b><p>A preterm-birth model from a district hospital is applied in a tertiary referral hospital. Referral selects women with more prior preterm births and chronic hypertension (severity in X). The referral population may also have more cervical insufficiency or multiple pregnancies, which the model does not include (severity in Z). Effects of predictors may differ because of earlier intervention for high-risk women (coefficients).</p></div>
<p class="src">Source: Ch. 19, §19.1 (Table 19.1)</p>
`

    {
      id: 's2',
      title: 'A simulation to separate the effects',
      html: `
<p>To see each effect in isolation, the book uses a large simulation (populations of 500,000) inspired by a testicular cancer case study: outcome incidence close to 50% and a decision threshold of 30%.</p>
<h3>Set-up</h3>
<ul>
<li>One observed predictor <span class="m">x</span> stands for the model's linear predictor; one missed predictor <span class="m">z</span> stands for everything not in the model. Both are standard normal.</li>
<li>The model used for prediction is lp = 1.5 × x. In the development population it has a c statistic of 0.81 and is perfectly calibrated.</li>
<li>Outcomes are generated from both x and z. Three versions differ in the correlation between x and z: r = 0, 0.33 and 0.5.</li>
</ul>
<table class="data">
<thead><tr><th>x–z correlation</th><th>True model (adjusted for z)</th><th>Model without z</th></tr></thead>
<tbody>
<tr><td>r = 0</td><td>2.05 × x + 1.5 × z</td><td>1.5 × x</td></tr>
<tr><td>r = 0.33</td><td>1.5 × x + 1.5 × z</td><td>1.5 × x</td></tr>
<tr><td>r = 0.5</td><td>1.18 × x + 1.5 × z</td><td>1.5 × x</td></tr>
</tbody>
</table>
<p>Why is the adjusted coefficient for x 2.05 when z is uncorrelated with x? In logistic (and Cox) regression, adjusting for a covariate that predicts the outcome makes other coefficients more extreme even if the covariate is uncorrelated with them: a <b>stratification effect</b> of non-linear models. When z is positively correlated with x, confounding pulls the adjusted coefficient down. At r = 0.33 the two effects balance exactly, so the adjusted and unadjusted coefficients for x are both 1.5.</p>
<h3>Performance measures</h3>
<ul>
<li><b>Calibration-in-the-large, a|b=1</b>: the intercept in a logistic model in the validation data with lp as offset (slope fixed at 1). Ideal 0. Positive values mean underestimation of risk.</li>
<li><b>Calibration slope, b</b>: the coefficient of lp in a logistic model with lp as the only covariate. Ideal 1.</li>
<li><b>c statistic</b> for discrimination.</li>
<li><b>Net benefit</b>, NB = (TP − w × FP)/N with w = threshold/(1 − threshold), compared with the best default strategy.</li>
</ul>
<div class="callout eg"><b>Worked example: the reference strategy</b><p>Incidence 50%, threshold 30%, so w = 0.3/0.7 = 3/7. "Treat all" in 100 patients gives 50 true positives and 50 false positives: NB = (50 − 3/7 × 50)/100 = (50 − 21.4)/100 = 0.286, that is 28.6 net true positives per 100 patients. A useful model must exceed this. In the development population the model's NB exceeds "treat all" by 0.055: 5.5 more true positives per 100 patients at the same number of false positives.</p></div>
<p>All scenarios below are compared against this development benchmark: a|b=1 = 0, b = 1, c = 0.81, NB gain 0.055.</p>
<p class="src">Source: Ch. 19, §19.2 (Table 19.2, Fig. 19.2)</p>
`

    {
      id: 's3',
      title: 'Case-mix in the observed predictors',
      html: `
<p>Selecting patients on the basis of the observed predictor x is a form of missing-not-at-random selection with respect to x. Regression coefficients remain unbiased under such selection, so the model stays <b>well calibrated</b>: a|b=1 = 0 and b = 1 in all four scenarios. What changes is the spread of predicted risks, and with it discrimination and usefulness.</p>
<table class="data">
<thead><tr><th>Validation population (selection on x)</th><th>a|b=1</th><th>b</th><th>c</th><th>NB gain</th></tr></thead>
<tbody>
<tr><td>Development (reference)</td><td>0</td><td>1</td><td>0.81</td><td>0.055</td></tr>
<tr><td>More severe (higher x selected)</td><td>0</td><td>1</td><td>0.77</td><td>0.006</td></tr>
<tr><td>Less severe (lower x selected)</td><td>0</td><td>1</td><td>0.77</td><td>0.104</td></tr>
<tr><td>More heterogeneous (extreme x selected)</td><td>0</td><td>1</td><td>0.90</td><td>0.104</td></tr>
<tr><td>Less heterogeneous (central x selected)</td><td>0</td><td>1</td><td>0.75</td><td>0.030</td></tr>
</tbody>
</table>
<h3>Reading the table</h3>
<ul>
<li><b>Heterogeneity drives discrimination.</b> A more heterogeneous case-mix contains more patients with very low or very high predictions, so c rises (0.90). A homogeneous case-mix lowers c (0.75) with perfect calibration. A low c in a new setting therefore does not necessarily mean the model is wrong.</li>
<li><b>Severity drives usefulness through the threshold.</b> In the more severe population few patients have predictions below the 30% threshold, so the model rarely changes the default decision ("treat all") and NB gain falls to 0.006; with even more selective inclusion it would reach zero. In the less severe population many patients fall below the threshold and the model spares many of them unnecessary treatment: NB gain 0.104. The c statistic is the same (0.77) in both.</li>
<li>These patterns were the same whether z was uncorrelated or correlated with x.</li>
</ul>
<div class="callout key"><b>Key idea</b><p>Case-mix in the observed predictors leaves calibration intact but changes discrimination (through the heterogeneity of predictions) and clinical usefulness (through the distribution of predictions around the decision threshold).</p></div>
<div class="callout book"><b>Book example</b><p>A testicular cancer model lost clinical usefulness at external validation in a tertiary referral centre. Part of the explanation is selection: only patients suspected of residual tumour, for example with larger masses, were operated and thus had their histology verified. Applied to all patients, the model would have been judged more useful.</p></div>
<div class="callout warn"><b>Pitfall</b><p>Selection on X can lead to predictions for X values outside the range seen at development. If non-linearities or interactions were missed during development, calibration can then break down too.</p></div>
<p class="src">Source: Ch. 19, §19.3.1–19.3.3 (Table 19.3, Figs. 19.3–19.4); §19.9</p>
`

    {
      id: 's4',
      title: 'Case-mix in missed predictors and in outcomes',
      html: `
<h3>More or less severe according to z</h3>
<p>If the validation population is more severe on characteristics <b>not in the model</b>, the main effect is systematic miscalibration. At r = 0.33, a|b=1 = 0.70 when more severe z patients are selected: approximately twice as many events as predicted (odds ratio exp(0.70) = 2.0). Selecting less severe z patients gives a|b=1 = −0.70. The slope stays around 1 and c around 0.81. With r = 0 the slope was 1.12, because selection reduces the stratification effect of z (unadjusted coefficient 1.12 × 1.5 = 1.68); with r = 0.5 it was 0.93.</p>
<p>The consequence for decisions is serious. In the more severe population the NB gain was 0.001 at r = 0.33 and became <b>negative</b> (−0.004) at r = 0.5. A negative gain means that using the model leads to worse decisions than simply treating everyone. Many patients predicted below 30% actually have risks above 30% and are wrongly denied treatment; this loss outweighs the reduction in false positives. In the less severe population the NB gain rose (0.109 at r = 0.33), despite the miscalibration.</p>
<div class="callout warn"><b>Critical:</b><p>A model that systematically underestimates risk in a new setting can do harm: its net benefit can fall below that of a default policy. A good c statistic offers no protection, because c is insensitive to calibration-in-the-large. Calibration-in-the-large must be checked at every external validation.</p></div>
<h3>More or less heterogeneous according to z</h3>
<p>Changing the spread of z affects the <b>calibration slope</b> but not calibration-in-the-large. Results depend on the x–z correlation: for a more heterogeneous z, slopes were 0.78, 1 and 1.18 at r = 0, 0.33 and 0.5. Discrimination and usefulness were better when the slope was higher.</p>
<h3>Outcome sampling: case-control designs</h3>
<p>If cases and controls are sampled in a ratio different from the population, only the intercept is affected. With 2 cases per control (from a 1:1 population) a|b=1 = 0.69 = log(2); with 1 case per 2 controls, −0.69. The slope stays 1 and c stays 0.81. Clinical usefulness is meaningful only after correcting the intercept back to the clinical population.</p>
<p>In a traditional case-control study the number of underlying controls is unknown, so the intercept cannot be corrected. In a <b>nested case-control</b> design cases and controls are sampled from a defined cohort, so the sampling fractions are known; the intercept is corrected, for example, by weighting controls by the inverse of their sampling fraction.</p>
<div class="callout eg"><b>Worked example: correcting a nested case-control intercept</b><p>A cohort of 3000 women has 360 preterm births. All 360 cases and 720 of the 2640 controls are analysed. The control sampling fraction is 720/2640 = 0.273, so the odds of the outcome in the analysed sample are 1/0.273 = 3.67 times the cohort odds. If all cases are included, the intercept from the case-control fit is too high by log(3.67) = 1.30. An intercept of −0.40 estimated in the sample becomes −0.40 − 1.30 = −1.70 for the cohort; the coefficients are kept.</p></div>
<p class="src">Source: Ch. 19, §19.3.4–19.4 (Figs. 19.5–19.7)</p>
`

      html: `
<h3>Overfitting: slope of the linear predictor below 1</h3>
<p>A typical shrinkage factor found at internal validation is 0.8; more severe overfitting gives 0.6. If such a model is validated, the calibration slope is 0.8 or 0.6, c falls to 0.77 or 0.72 (from 0.81), and the NB gain falls to 0.037 or 0.014 (from 0.055). Calibration-in-the-large is unaffected.</p>
<h3>Truly different coefficients</h3>
<p>With ten predictors, half of them having 0.5 times and half 1.5 times their development effect in the validation setting, the slope was 0.84, c 0.78 and NB gain 0.040. With half having only 0.25 times their effect, the slope was 0.68, c 0.74 and NB gain 0.023. Different predictor effects can seriously reduce performance even when calibration-in-the-large is fine.</p>
<table class="data">
<thead><tr><th>Scenario</th><th>a|b=1</th><th>b</th><th>c</th><th>NB gain</th></tr></thead>
<tbody>
<tr><td>Development</td><td>0</td><td>1</td><td>0.81</td><td>0.055</td></tr>
<tr><td>More severe in z (r = 0.33)</td><td>0.70</td><td>1</td><td>0.81</td><td>0.001</td></tr>
<tr><td>Less severe in z (r = 0.33)</td><td>−0.70</td><td>1</td><td>0.81</td><td>0.109</td></tr>
<tr><td>More heterogeneous in z (r = 0.33)</td><td>0</td><td>1</td><td>0.83</td><td>0.062</td></tr>
<tr><td>Less heterogeneous in z (r = 0.33)</td><td>0</td><td>1</td><td>0.81</td><td>0.053</td></tr>
<tr><td>Case-control 2:1 / 1:2</td><td>±0.69</td><td>1</td><td>0.81</td><td>not applicable</td></tr>
<tr><td>Overfitted, slope 0.8 / 0.6</td><td>0</td><td>0.8 / 0.6</td><td>0.77 / 0.72</td><td>0.037 / 0.014</td></tr>
<tr><td>Effects × 0.5 or 1.5</td><td>0</td><td>0.84</td><td>0.78</td><td>0.040</td></tr>
<tr><td>Effects × 0.25 or 1.5</td><td>0</td><td>0.68</td><td>0.74</td><td>0.023</td></tr>
</tbody>
</table>
<h3>Summary of patterns</h3>
<ul>
<li><b>Calibration-in-the-large</b> is disturbed by a more or less severe case-mix in <i>missed</i> predictors and by case-control sampling. The case-control ratio is under the researcher's control; the distribution of missed predictors usually is not.</li>
<li><b>Calibration slope</b> is disturbed by overfitting, by truly different predictor effects, and by changes in the heterogeneity of missed predictors.</li>
<li><b>Discrimination</b> moves with the calibration slope, and falls with a more homogeneous case-mix in X. Poor discrimination can therefore come from poor coefficients, a homogeneous case-mix, or both.</li>
<li><b>Clinical usefulness</b> needs discrimination (a model without discrimination cannot be useful), but discrimination and calibration are not sufficient: usefulness also depends on where predictions fall relative to the threshold. Case-mix in X acts mainly through that distribution; case-mix in Z acts mainly through calibration-in-the-large.</li>
</ul>
<p>Combinations occur in practice. For example, when a model moves from a trial to a survey that is less heterogeneous in X and more severe in Z, with effects 0.5 or 1.5 times as large, the book's simulation gave a|b=1 0.69, slope 0.59, c 0.65 and a negative NB gain (−0.036).</p>
<div data-widget="caseMixLab"></div>
<ul class="try">
<li>Select "more severe x" and then "less severe x". Confirm that calibration stays on the identity line while c and the net benefit at the 30% threshold change.</li>
<li>Select "more severe z" and move the x–z correlation from 0 to 0.5. Watch calibration-in-the-large and the sign of the net benefit compared with treat all.</li>
<li>Compare "overfitted slope 0.8" with "coefficients ×0.5/×1.5": both lower the slope and c without shifting calibration-in-the-large.</li>
<li>Select "case-control 2:1" and note which single measure changes.</li>
</ul>
<p class="src">Source: Ch. 19, §19.5 (Tables 19.3–19.4, Figs. 19.8–19.9)</p>

    {
      id: 's6',
      title: 'Reference values: case-mix or coefficients?',
      html: `
<p>Suppose the c statistic is lower at external validation. Is the validation population simply more homogeneous, or are the coefficients wrong there? Two additional numbers help.</p>
<h3>Reference performance</h3>
<p>The <b>reference value</b> is the performance expected in the validation sample <i>if the model were fully correct there</i>, given that sample's own case-mix in X. It is obtained by simulation:</p>
<ol>
<li>Calculate the model's predicted probability for each validation patient.</li>
<li>Generate a new outcome for each patient at random with that probability.</li>
<li>Calculate c (or R², Brier score) for the predictions against the simulated outcomes.</li>
<li>Repeat at least 100 times (for example 1000) and average.</li>
</ol>
<p>For calibration the reference values are simply 0 (calibration-in-the-large) and 1 (slope).</p>
<h3>Refitted performance</h3>
<p>Refitting the same predictors in the validation data gives coefficients that are optimal for that sample. Its (apparent) performance is an <b>upper bound</b>: what could be reached if the development coefficients had been exactly right. It depends on case-mix and on the strength of the predictors in the validation setting.</p>
<h3>Interpretation</h3>
<ol>
<li>Internal validation corrects for overfitting; case-mix is unchanged.</li>
<li>External validation tests the model where both case-mix and coefficients may differ.</li>
<li>Reference performance adjusts for the new case-mix while keeping the development coefficients.</li>
<li>Refitted performance adjusts for the new case-mix and uses optimal coefficients.</li>
</ol>
<p>If external c is clearly below the reference c, the shortfall is not due to case-mix in X; it points to coefficients that do not hold in the new setting.</p>
<div class="callout book"><b>Book example</b><p>Testicular cancer: apparent c 0.818, internally validated 0.812, external 0.785, reference 0.824, refitted 0.819. The reference c was similar to development, so the case-mix in X did not explain the drop; differences in coefficients did. Traumatic brain injury: apparent 0.767, internal 0.765, external 0.816, reference 0.804, refitted 0.819. The better external c was partly case-mix (reference higher than development) and partly stronger predictor effects (calibration slope 1.08).</p></div>
<h3>Comparing case-mix more informally</h3>
<p>Case-mix is usually compared informally, in a "Table 1" of patient characteristics. One formal proposal, the <b>M statistic</b>, groups predicted probabilities into bands (for example 0–25%, 26–50%, 51–75%, 76–90%, 91–95%, 96–100%), takes for each band the smaller of the development and validation fractions, and sums them. M ranges from 0 (no overlap) to 1 (identical case-mix). An arbitrary cut-off of 0.88 has been suggested, below which results should be interpreted cautiously.</p>
<div class="callout eg"><b>Worked example: M statistic</b><p>Development fractions in five risk bands: 0.40, 0.30, 0.15, 0.10, 0.05. Validation fractions: 0.25, 0.30, 0.20, 0.15, 0.10. Smaller of each pair: 0.25, 0.30, 0.15, 0.10, 0.05. M = 0.85, below 0.88: the validation population is shifted towards higher risk and comparisons with development performance need caution.</p></div>
<p class="src">Source: Ch. 19, §19.6 (Table 19.5); §19.9</p>
`

      id: 's7',
      title: 'Uncertainty and sample size in validation studies',
      html: `
<p>Real validation samples are finite, so every performance measure has a standard error (SE). The book simulated a model with ten normally distributed predictors (c = 0.81 in the population, 50% incidence) in development and validation samples of different sizes.</p>
<table class="data">
<thead><tr><th>Events/N development</th><th>Events/N validation</th><th>a|b=1</th><th>Slope b</th><th>c</th></tr></thead>
<tbody>
<tr><td>5000/10,000</td><td>5000/10,000</td><td>0 ± 0.03</td><td>1.00 ± 0.03</td><td>0.81 ± 0.004</td></tr>
<tr><td>50/100</td><td>5000/10,000</td><td>0 ± 0.28</td><td>0.64 ± 0.15</td><td>0.77 ± 0.017</td></tr>
<tr><td>5000/10,000</td><td>50/100</td><td>0 ± 0.24</td><td>1.06 ± 0.24</td><td>0.82 ± 0.043</td></tr>
<tr><td>5000/10,000</td><td>100/200</td><td>0 ± 0.16</td><td>1.03 ± 0.17</td><td>0.81 ± 0.030</td></tr>
<tr><td>5000/10,000</td><td>250/500</td><td>0 ± 0.11</td><td>1.01 ± 0.10</td><td>0.80 ± 0.018</td></tr>
</tbody>
</table>
<p>Small <i>development</i> samples give overfitted models (slope 0.64) with lower c, which a large validation sample measures precisely. Small <i>validation</i> samples give very uncertain estimates, and even slight upward bias in slope and c. The effective sample size is largely determined by the number of events, not the total number of patients.</p>
<h3>Power</h3>
<p>For a published model, a <b>one-sample test</b> is reasonable: the model is treated as fixed and its validation performance is compared with the ideal values. Calibration-in-the-large calls for a two-sided test (risk could be over- or underestimated); for the slope, only slope &lt; 1 matters (one-sided); for c, only a decrease from the reference value. With 5% type I error and 80% power the critical values are 1.96 + 0.84 = 2.80 (two-sided) and 1.645 + 0.84 ≈ 2.49 (one-sided). Minimum detectable difference = critical value × SE.</p>
<div class="callout eg"><b>Worked example: 50 events and 50 non-events</b><p>SE of calibration-in-the-large 0.24: 2.80 × 0.24 = 0.67, odds ratio exp(0.67) = 1.96, so only predictions about twice too high or too low can be detected. Slope SE 0.24: 1 − 2.49 × 0.24 = 0.40, so only slopes below 0.40 are detectable. c SE 0.043: 2.49 × 0.043 = 0.107.</p></div>
<table class="data">
<thead><tr><th>Incidence</th><th>Events/N validation</th><th>Detectable a|b=1 (OR)</th><th>Detectable slope</th><th>Detectable fall in c</th></tr></thead>
<tbody>
<tr><td>50%</td><td>50/100</td><td>±0.67 (1.96)</td><td>&lt; 0.40</td><td>0.107</td></tr>
<tr><td>50%</td><td>100/200</td><td>±0.45 (1.57)</td><td>&lt; 0.58</td><td>0.077</td></tr>
<tr><td>50%</td><td>250/500</td><td>±0.31 (1.36)</td><td>&lt; 0.75</td><td>0.045</td></tr>
<tr><td>50%</td><td>500/1000</td><td>±0.22 (1.25)</td><td>&lt; 0.83</td><td>0.035</td></tr>
<tr><td>50%</td><td>1000/2000</td><td>±0.17 (1.18)</td><td>&lt; 0.88</td><td>0.022</td></tr>
<tr><td>10%</td><td>50/500</td><td>±0.45 (1.61)</td><td>&lt; 0.63</td><td>0.075</td></tr>
<tr><td>10%</td><td>100/1000</td><td>±0.34 (1.44)</td><td>&lt; 0.75</td><td>0.052</td></tr>
<tr><td>10%</td><td>200/2000</td><td>±0.25 (1.29)</td><td>&lt; 0.83</td><td>0.037</td></tr>
</tbody>
</table>
<p>Clinically relevant invalidity might be predictions 1.5 times too high or low in odds (a|b=1 = ±ln 1.5), a slope below 0.8, or a fall in c of more than 0.05. When a model was truly invalid (slope 0.84, c falling from 0.821 to 0.778), power to detect the slope was 25% with 100 events, 50% with 250 and 78% with 500; for the fall in c it was 24%, 57% and 87%.</p>
<div class="callout key"><b>Key idea</b><p>An external validation sample needs at least 100 events and 100 non-events, and preferably more (for example 250 events, or 100 events with 900 non-events), to detect relevant miscalibration. A validation with 30 events can show only gross failure. If a temporal split of one data set is planned, a 2:1 development:validation ratio is a reasonable balance between overfitting at development and power at validation. Validity can also be framed as non-inferiority: the null hypothesis is that the model is invalid, and the study tests whether performance lies within acceptable limits.</p></div>
<div data-widget="validationPower"></div>
<ul class="try">
<li>Choose 50% incidence and step through 50, 100, 250 and 500 events. Note the detectable calibration-in-the-large odds ratio and slope at each step.</li>
<li>Switch to 10% incidence with 100 events. Compare the detectable slope with the 50% incidence result at 100 events, and note the total sample size required.</li>
</ul>
<p class="src">Source: Ch. 19, §19.7–19.9 (Tables 19.6–19.8)</p>
`

<p>Epidemiological papers usually present tables of odds ratios with confidence intervals. Such a table is <b>not sufficient</b> to calculate an absolute risk: that requires the model intercept (for logistic and linear models) or the baseline hazard (for survival models). A prediction model that cannot be used to calculate risks for a new patient has not been presented.</p>
<h3>Two kinds of product</h3>
<ul>
<li>A <b>clinical prediction model</b> gives an estimate of absolute risk from a combination of patient characteristics. For a good model the predictions span a wide range. Interpretation and action are left to the clinician and the patient.</li>
<li>A <b>clinical decision rule</b> recommends a course of action for a combination of characteristics. It needs more subject-matter input, especially on the choice of a risk threshold (see the module on clinical usefulness). Some argue that presenting a model as a decision rule eases its wide application, citing rules such as the Ottawa rules for ankle, knee and head injuries.</li>

<p>The simplest presentation is the regression formula itself. Calculating a prediction takes two steps.</p>

<li><b>Transform to the outcome scale</b>: for logistic regression, p = 1/(1 + exp(−lp)). For a Cox model, a baseline survival or hazard function is needed in addition to lp.</li>

<ul>

<h3>Confidence and prediction intervals</h3>
<p>For a continuous outcome, a <b>confidence interval</b> describes uncertainty about the <i>average</i> outcome for patients with given characteristics; it becomes very narrow with very large samples. A <b>prediction interval</b> describes where an <i>individual</i> outcome is likely to fall and stays wide however large the sample, because individuals vary. A growth chart of length by age based on thousands of children has a very tight confidence interval around the mean, but individual children still vary widely.</p>
<p>For a binary outcome, the prediction is already a probability, which expresses the inherent uncertainty for the individual. A predicted risk of 35% with a narrow confidence interval still means that the woman either will or will not develop the outcome. With regression, predictions approach but never reach 0 or 1.</p>
<h3>When the interval misleads</h3>
<p>Total uncertainty is the sum of random and systematic error. A confidence interval reflects only random error and is valid only if the predictions have <b>no systematic bias</b>. Miscalibration in a new setting, caused by different predictor coding, missed predictors with different distributions or truly different effects, is a systematic error that no confidence interval shows. Be cautious when a large development sample gives narrow intervals. Conversely, wide intervals from a small data set are a useful warning against over-interpreting predictions. For decisions, the point prediction remains of primary interest: if no better estimate is available, following the model's estimate is the best one can do.</p>
<h3>Calculation</h3>
<p>The standard error of a linear predictor comes from the covariance matrix V of the coefficients. For a patient with predictor vector x (with 1 for the intercept):</p>
<div class="formula">SE(lp) = √(xᵀ V x)</div>

<p>Each combination of predictor values has its own SE, even when two patients share the same linear predictor. This is easy in a formula or spreadsheet but awkward in a nomogram or score chart, where the mean or median SE for a given linear predictor value can be shown. If shrinkage was applied, the covariance matrix of the unshrunk model can still be used; a penalised model's own covariance matrix gives slightly smaller SEs.</p>

<p>A <b>score chart</b> assigns rounded points to each predictor; the user adds the points and converts the total to a probability using a small table or graph.</p>
<h3>Construction in four steps</h3>
<ol>
<li><b>Round the coefficients</b> of binary and categorical predictors. A simple approach is to multiply by 10 and round. Smaller multipliers often still give sufficiently refined predictions. Search for a <b>common denominator</b> across all coefficients.</li>
<li><b>Score continuous predictors</b>, kept continuous or categorised: choose a sensible reference value that scores 0 (age 0 is rarely sensible), find the values that score +1, +2 and so on given the coefficient and distribution, and add intermediate values (for example +0.5); other values are scored by linear interpolation.</li>
<li><b>Estimate the multiplication factor</b>: fit a logistic model with the total score as the only predictor. Its coefficient (log-odds per point) undoes the scaling; multiply it by any shrinkage factor.</li>
<li><b>Estimate the intercept</b> with the shrunk score as an offset, and present the chart with the conversion from total score to probability.</li>
</ol>
<div class="callout warn"><b>Pitfall</b><p>Dividing all coefficients by the smallest coefficient of a binary predictor (so that it scores 1) capitalises on the estimate of one coefficient and adds unnecessary uncertainty. Using <b>odds ratios</b> as points is wrong: the linear predictor adds log-odds, so points must be proportional to regression coefficients. With odds ratios, a predictor with no effect (OR 1.0) would earn 1 point, and the relative weights are distorted: ORs of 10 and 1.5 differ 6.7-fold, while their coefficients (2.30 and 0.41) differ 5.7-fold.</p></div>

<h3>Tables with predictions</h3>
<p>A table showing risk for combinations of predictor values is very easy to use, and treatment advice can be attached to its cells (for example, colour-coded statin recommendations by smoking, blood pressure, diabetes, cholesterol ratio and sex). The price is categorisation of continuous predictors and averaging within cells.</p>
<div class="callout book"><b>Book example</b><p>For the testicular cancer model, the c statistic was 0.839 for the formula, nomogram and graphical formats, 0.838 for the score chart with continuous predictors, 0.808 for categorised scores and 0.773 for a simple table (sum of five favourable characteristics against residual mass size).</p></div>
<h3>Decision rules</h3>
<ul>
<li><b>Regression tree</b>: classifies patients into a few groups by a sequence of splits, to which experts can attach treatment advice. Trees are easy to understand but data-hungry and unstable with limited data.</li>
<li><b>Score chart rule</b>: severely rounded coefficients, for example one point per risk factor or "major" and "minor" factors, with an action above a score. Such rules can be memorised, but predictions are less accurate and calibration in particular suffers.</li>
<li><b>Risk groups</b>: grouped predictions (for example good, intermediate and poor prognosis) linked to treatment intensity. Group-level predictions are stable, but the cut-offs often follow the distribution of risk rather than decision-analytic reasoning.</li>
<li><b>Meta-model</b>: a simple model (often a tree) that predicts the classification made by a more complex model, for example "treat" versus "do not treat" at a threshold. It inherits any shrinkage of the underlying model.</li>
</ul>
<div class="callout book"><b>Book example: a score chart rule</b><p>A rule for CT scanning after minor head injury recommended CT with at least one of ten major or two of eight minor risk factors, derived from rounded logistic coefficients and categorised predictors. Sensitivity for neurosurgical intervention was 100% in the development data, but bootstrap validation gave an average of 96%, with 100% in only 56% of bootstrap samples. Specificity was 25%.</p></div>
<div class="callout warn"><b>Pitfall</b><p>A decision rule reported with 100% sensitivity in its development data should not be expected to have 100% sensitivity in new patients. Internal validation of the rule itself is needed.</p></div>
<div class="callout mch"><b>Illustrative (synthetic)</b><p>A district programme wants a rule for referring women with suspected preeclampsia. Converting a well-calibrated model into "refer if score ≥ 3" requires choosing the threshold from the relative harms of unnecessary referral and missed disease. That is a clinical and programme decision; the rule's sensitivity and specificity should then be validated, not assumed.</p></div>
<p class="src">Source: Ch. 18, §18.2.5, §18.4 (Tables 18.3, 18.5)</p>

<p>Presentation deserves more attention than it usually receives. Some general points follow from the book.</p>
<ul>
<li><b>Match the audience.</b> Some clinical areas are more quantitative than others, and some formats have become standard in particular fields (for example nomograms in prostate cancer). Specific formats can serve specific users: for radiologists, iso-probability curves of risk against pre- and post-treatment mass size were drawn for the testicular cancer model.</li>
<li><b>Know the cost of simplification.</b> Each step from formula to rounded score chart to categorised chart to table can reduce discrimination. Rounding with continuous predictors costs little (c 0.839 to 0.838 in the book example); categorisation and tabulation cost more (0.808 and 0.773).</li>
<li><b>Evidence on preference is limited.</b> There is no convincing evidence that one format communicates individual predictions better than another.</li>
<li><b>Computerised presentation</b> through electronic records and calculators makes complex models easy to apply, and is likely to become more common.</li>
</ul>
<h3>Minimum reporting for any format</h3>
<p>Whatever simplified format is offered, publish the information that allows others to calculate predictions and validate the model:</p>
<ol>
<li>The intercept (or baseline survival at stated time points) and all coefficients, after any shrinkage, with the intercept re-estimated.</li>
<li>Coding of every predictor: 0/1 meaning, reference categories, units, transformations, centring values and spline knot positions.</li>
<li>The outcome definition and time horizon.</li>
<li>For score charts: points per predictor, interpolation rules, and the conversion from score to probability (multiplier and intercept).</li>
</ol>
<div class="callout key"><b>Key idea</b><p>A presentation format is a translation of the model. It must reproduce the model's absolute risks closely enough for its purpose, and the full formula should remain available, because external validation and updating depend on it.</p></div>
<p class="src">Source: Ch. 18, §18.2.6, §18.3.5, §18.5</p>
`

    { id: 's2', title: 'Stages 1 and 2: aim and sample size', html: `
<h3>Stage 1. Define the aim</h3>
<p>Write down, before opening the Lab, the five elements that frame any prediction model.</p>
<ol>
<li>Decision: whom will the prediction change management for? Here, referral of a woman at booking to enhanced surveillance.</li>
<li>Outcome: preterm birth, delivery before 37 completed weeks, a binary outcome. State when and how it is ascertained, as accurately as in a trial.</li>
<li>Predictors: only those known at the first visit. Variables that appear later in pregnancy would not be available when the decision is made.</li>
<li>Type of model: logistic regression for a binary outcome, producing an absolute risk for each woman.</li>
<li>Threshold: the risk above which referral is worthwhile. A threshold equals harm / (harm + benefit). If the team judges that one unnecessary referral is one quarter as bad as one missed preterm birth is good, the threshold is 1 / (1 + 4) = 20%, which gives threshold odds w = 0.20 / 0.80 = 0.25. Use 20% throughout the project, and state it before you see any result.</li>

<div class="callout warn"><b>Critical</b><p>The threshold belongs to the clinical problem, not to the modeller. Do not choose it after seeing where the model performs best; that converts the decision analysis into another form of data dredging.</p></div>

<p>Events per variable (EPV) is the number of events divided by the number of candidate predictor parameters. Count degrees of freedom for every term you will consider: a continuous predictor coded linearly uses 1 df, a restricted cubic spline with 3 knots uses 2 df, with 5 knots uses 4 df, and a categorical variable with k levels uses k − 1 df.</p>

<div class="callout key"><b>Key idea</b><p>EPV is judged against the candidate parameters, not the ones that survive selection. An EPV below 10 signals overfitting risk, 10 or more is a minimum, around 20 or more may make shrinkage unnecessary for a prespecified model, and around 50 is needed for reliable data-driven selection.</p></div>

<p>Haemoglobin is a strong and clinically accepted predictor, but it is missing for <span data-live="ptb_hb_missing_pct"></span> of women. In this cohort it is more often missing in women with fewer antenatal visits and in low socioeconomic status. That pattern is missing at random (MAR): missingness depends on other observed variables. It cannot be proved from the data, but it is the plausible mechanism, and it is the one that multiple imputation handles.</p>
<h3>Options in the Lab</h3>
<table class="data">
<thead><tr><th>Option</th><th>What it does</th><th>Main weakness</th></tr></thead>
<tbody>
<tr><td>Complete case</td><td>Drops women with any missing predictor</td><td>Loses events (lower EPV); biased if missingness is related to the outcome in ways not captured by the model</td></tr>
<tr><td>Single stochastic imputation</td><td>Fills each gap once using other predictors and the outcome, plus random error</td><td>Treats imputed values as real, so standard errors are too small</td></tr>
<tr><td>Multiple imputation (m = 5)</td><td>Five completed datasets, analysed separately and pooled</td><td>More complex; the imputation model must contain the predictors, the outcome and variables that explain missingness</td></tr>
</tbody></table>
<div class="callout warn"><b>Critical</b><p>If you impute, the imputation model must include the outcome (preterm birth) as well as all predictors. Imputing without the outcome weakens the estimated association of the imputed predictor with the outcome. Do not add a "missing" indicator category as a substitute; that approach is biased.</p></div>
<div data-widget="missingDemo"></div>
<ul class="try"><li>Choose MAR depending on Y for X2 with 40% missing. Compare complete case with multiple imputation. Observe the bias in the coefficients under complete case analysis.</li><li>Choose mean imputation and note the effect on the estimated coefficient and its standard error.</li></ul>
<p>Decision at this stage: choose a method and justify it in two sentences, naming the mechanism you assumed and the variables that must be in the imputation model. Then, in the Lab, set the missing-data handling to your choice and note the number of women and events that enter the analysis. Also check, from the imputed values, that they fall in a plausible haemoglobin range (the imputed values should not be physiologically impossible).</p>
<p class="src">Source: Ch. 7.</p>
`},
    { id: 's4', title: 'Stage 4: coding the predictors', html: `
<p>Each continuous predictor needs a functional form chosen without dichotomising. The decision uses subject knowledge first and data only for broad shape. Three predictors deserve attention.</p>
<ul>
<li>Maternal age: risk is expected to be high at both ends of the reproductive range (a U shape). A linear term cannot represent that.</li>
<li>Haemoglobin: risk rises as haemoglobin falls into the anaemic range, with little change at normal values. A straight line over the full range misrepresents this.</li>
<li>BMI: low BMI is associated with higher risk; the effect at higher values is small.</li>
</ul>
<div data-widget="codingExplorer"></div>
<ul class="try"><li>Compare dichotomised age at 35 years with linear, quadratic and a 4-knot spline. Read the model χ² and degrees of freedom of each.</li><li>Reduce the subsample size to 400 and see which flexible codings stay stable.</li></ul>
<p>Compare codings by the likelihood ratio χ² minus 2 × df (an AIC-type comparison), not by the p-value of one term. A spline with more knots always fits the sample better; the question is whether the gain exceeds its cost in degrees of freedom. With a limited number of events, give flexibility only to predictors whose effects are likely to be non-linear and strong, as spending df on every predictor lowers EPV.</p>
<div class="callout warn"><b>Critical</b><p>Dichotomising a continuous predictor, particularly at a cutpoint selected from the same data, discards information and biases the estimate. Do not report a model built on data-chosen cutpoints as if the cutpoints were known in advance.</p></div>
<p>Decision at this stage: record the coding for age, haemoglobin and BMI, with the df each uses and the total candidate df that results. Return to Stage 2 and recompute EPV if your total changed. Four variables in the data (antenatal visit count, fetal sex, season of conception and height) are of doubtful relevance as predictors of preterm birth; decide, on subject-matter grounds and before looking at their coefficients, whether they belong among the candidates.</p>
<p class="src">Source: Ch. 9, Ch. 10, Ch. 12.</p>
`},
    { id: 's5', title: 'Stages 5 and 6: strategy and shrinkage', html: `
<h3>Stage 5. Choose the modelling strategy</h3>
<p>The options are a prespecified full model (all candidates, no selection) or backward elimination with a stated stopping rule. The trade-off is as follows.</p>
<table class="data">
<thead><tr><th>Strategy</th><th>For</th><th>Against</th></tr></thead>
<tbody>
<tr><td>Full prespecified model</td><td>No selection bias; stable; standard errors are valid; asks one question (the coefficients)</td><td>Larger model; includes weak or irrelevant predictors</td></tr>
<tr><td>Backward, p &lt; 0.05</td><td>Smaller model; easy to replay in a bootstrap</td><td>Unstable selection; coefficients of retained predictors biased upwards (testimation); may drop true weak predictors</td></tr>
<tr><td>Backward, AIC-like (p ≈ 0.157)</td><td>Less underfitting than p &lt; 0.05</td><td>Same instability, in less extreme form</td></tr>
</tbody></table>
<div data-widget="stepwiseInstability"></div>
<ul class="try"><li>Run 100 bootstraps with backward p &lt; 0.05 at a sample size of 500. Note the selection frequency of predictors with weak effects and of the four noise candidates.</li><li>Repeat at 1600 and observe how much more stable selection becomes with more events.</li></ul>
<p>A smaller model does not reduce overfitting if the selection itself was driven by the data. Overfitting depends on the number of candidates examined, not the number retained. Default to the full prespecified model unless a practical reason (for example, a measurement is costly) argues for a smaller one; if you do select, plan to replay the selection in the bootstrap.</p>
<h3>Stage 6. Shrinkage</h3>
<p>Maximum likelihood coefficients are, on average, too extreme for new patients. Shrinkage pulls them towards zero. Two options exist in the Lab: uniform shrinkage by a bootstrap-estimated factor, and a ridge penalty with strength λ. Uniform shrinkage multiplies all coefficients by one factor s; the heuristic estimate is s = (model χ² − df) / model χ², with df equal to the candidate degrees of freedom. After shrinking, the intercept must be re-estimated so that the mean predicted risk matches the observed incidence.</p>
<div data-widget="shrinkageLab"></div>
<ul class="try"><li>At a development subsample of 400, run 30 replications and compare the mean calibration slope for standard maximum likelihood, uniform shrinkage and ridge.</li><li>At 1500, repeat and note how much shrinkage helps when events are plentiful.</li></ul>
<p>Shrinkage changes calibration far more than discrimination; the c statistic is almost unchanged, but the calibration slope moves towards 1.</p>
<p>Decision at these stages: state your strategy and shrinkage method in the Lab and the reason for each. Run the analysis and record the coefficient table, the model χ², the df, the EPV and the apparent c.</p>
<p class="src">Source: Ch. 11, Ch. 13.</p>
`},
    { id: 's6', title: 'Stage 7: bootstrap optimism', html: `
<p>The apparent c and calibration slope from Stage 6 are measured in the same women who built the model, so they are optimistic. The bootstrap estimates by how much.</p>
<ol>
<li>Develop the model in the original sample and record its apparent performance.</li>
<li>Draw a bootstrap sample of the same size, with replacement.</li>
<li>Repeat every modelling step in this sample: imputation, coding choices, selection and shrinkage. Record performance in the bootstrap sample (apparent) and then in the original sample (test).</li>
<li>Optimism = apparent in bootstrap sample − test in original sample.</li>
<li>Repeat at least 100 times and average the optimism.</li>
<li>Subtract the mean optimism from the apparent performance of the original model.</li>
</ol>
<div class="callout warn"><b>Critical</b><p>The bootstrap only measures the optimism of your strategy if the strategy is replayed in full in each sample. If you pick predictors or cutpoints by looking at the data first and then run a bootstrap on the final model alone, the optimism is understated.</p></div>
<div data-widget="optimismSim"></div>
<ul class="try"><li>Set n to 500, incidence 12%, 3 true predictors and 20 noise predictors, then run 40 simulations. Compare apparent and honest c.</li><li>Repeat with 2 noise predictors and watch EPV and the gap shrink.</li></ul>
<p>In the Analysis Lab set B between 100 and 200 and run the optimism-corrected performance. Record the apparent c, the optimism-corrected c, the optimism, and the corrected calibration slope. For the full 14-term model on the course data, the apparent c is <span data-live="ptb_full_apparent_c"></span>, the corrected c is <span data-live="ptb_full_corrected_c"></span>, the optimism is <span data-live="ptb_full_optimism_c"></span> and the shrinkage implied by the corrected slope is <span data-live="ptb_full_shrinkage"></span>. Your own result will differ if you chose a different strategy; compare the two.</p>
<p>Decision at this stage: report corrected performance, not apparent performance, as your internal estimate. State what the size of the optimism tells you about whether your model was too large for its data.</p>
<p class="src">Source: Ch. 5, Ch. 17.</p>
`},
    { id: 's7', title: 'Stages 8 and 9: external validation and decision curve', html: `
<h3>Stage 8. External validation</h3>
<p>Apply your final fixed model, with its shrunken coefficients and intercept, to <code>ptb_val</code> without refitting anything. In the Lab, use the external validation panel. Four numbers matter.</p>
<ul>
<li>Calibration-in-the-large: intercept a with the linear predictor as offset; ideal 0. A positive value means the model under-predicts.</li>
<li>Calibration slope b: ideal 1. Below 1 means predictions are too extreme, which can reflect overfitting or genuinely weaker predictor effects in the new setting.</li>
<li>c statistic with its confidence interval.</li>
<li>Net benefit at your pre-declared threshold.</li>
</ul>
<p>Haemoglobin is also missing in a small share of the validation women (about 5%), completely at random; handle it by imputation using the variables of the development model, without refitting the model.</p>
<p>The reported performance in this validation set is c = <span data-live="ptb_val_c"></span>, calibration slope <span data-live="ptb_val_slope"></span> and calibration-in-the-large <span data-live="ptb_val_citl"></span> for the 14-term model. These are provided so you can compare your own model with the course reference model.</p>
<div data-widget="calibrationLab"></div>
<ul class="try"><li>Set true slope 0.8 and intercept shift 0.5, n = 1200. Observe what such a calibration plot looks like and the verdict.</li></ul>
<div data-widget="caseMixLab"></div>
<ul class="try"><li>Compare the scenario "overfitted slope 0.8" with "more severe z". Note which scenario shifts calibration-in-the-large and which shifts the slope.</li></ul>
<p>Interpret changes against causes. A higher incidence in the tertiary hospital and an older, higher-risk population shift calibration-in-the-large. Weaker predictor effects lower the slope. Overfitting in development lowers the slope as well, and so it is useful to compare with your corrected slope from Stage 7. Discrimination is the least sensitive of the four to a shift in the intercept.</p>
<div class="callout warn"><b>Critical</b><p>Do not alter the model after seeing the validation result and then report the revised model's validation performance as external. Once you refit or recalibrate in <code>ptb_val</code>, those data have become development data. Updating methods lie outside this course.</p></div>
<h3>Stage 9. Decision curve</h3>
<p>Net benefit at threshold p<sub>t</sub> is NB = (TP − w × FP) / N with w = p<sub>t</sub> / (1 − p<sub>t</sub>). Compare the model with treating everyone and treating no one (NB = 0).</p>
<div data-widget="nbCalculator"></div>
<ul class="try"><li>Keep the prefilled preterm birth example. Change the threshold from 10% to 30% and note how the weight of false positives changes and which policy is best.</li></ul>
<div data-widget="decisionCurveLab"></div>
<ul class="try"><li>Set a calibration shift (CITL) of +1.0 and look at the model's curve relative to treat all. Then set the slope to 0.6.</li></ul>
<p>In the Lab, read the decision curve for the external validation, mark your 20% threshold, and state whether the model beats both default policies there and whether the useful range of thresholds is wide or narrow. If calibration is poor, net benefit can fall below the default policies even when the c statistic looks acceptable.</p>
<p class="src">Source: Ch. 15, Ch. 16, Ch. 17, Ch. 19.</p>
`},
    { id: 's8', title: 'Stage 10: write-up and self-assessment', html: `
<h3>Write-up</h3>
<p>Write a one-page report with these headings. Use plain words and give numbers with their uncertainty.</p>
<ol>
<li>Purpose and decision the model supports, with the declared threshold.</li>
<li>Data: sources, outcome definition, sample size, events, missing data and how it was handled.</li>
<li>Methods: candidate predictors and their coding, strategy, shrinkage, and how optimism was estimated.</li>
<li>Final model: the coefficients, the intercept and the coding, enough for someone to compute a risk.</li>
<li>Performance: apparent, optimism-corrected, and external (calibration-in-the-large, slope, c with interval, net benefit).</li>
<li>Limitations: events per variable, differences between the two hospitals, what was not validated.</li>
<li>Presentation: how a clinician would use it (formula, nomogram or score chart) and what is lost if a score chart is used.</li>
</ol>
<div class="callout key"><b>Key idea</b><p>A prediction model is judged on whether its predictions are valid in the setting where it will be used. A credible write-up reports the performance that was honestly estimated, not the best performance that was observed.</p></div>
<h3>Self-assessment rubric</h3>
<p>Score each row 0 (absent), 1 (partly) or 2 (fully). A total of 18 to 24 indicates a well-conducted project; below 12, return to the stages with the lowest scores.</p>
<table class="data">
<thead><tr><th>Criterion</th><th>2 points when</th></tr></thead>
<tbody>
<tr><td>1. Aim and threshold</td><td>Decision, outcome, predictors available at booking and a threshold with its harm:benefit reasoning are stated before analysis.</td></tr>
<tr><td>2. Sample size</td><td>EPV is calculated from candidate df, including spline and quadratic terms, and its consequence is stated.</td></tr>
<tr><td>3. Missing data</td><td>Mechanism is named, method justified, imputation model includes the outcome, and events retained are reported.</td></tr>
<tr><td>4. Coding</td><td>Continuous predictors are not dichotomised; non-linear forms are chosen with an AIC-type comparison and a df budget.</td></tr>
<tr><td>5. Strategy</td><td>Candidates are restricted using subject knowledge before outcome analysis; selection, if used, is justified and replayed.</td></tr>
<tr><td>6. Shrinkage</td><td>A shrinkage method is applied and the intercept is re-estimated; the heuristic factor uses candidate df.</td></tr>
<tr><td>7. Optimism</td><td>Bootstrap with at least 100 replications replays every step; corrected performance is reported, not only apparent.</td></tr>
<tr><td>8. External validation</td><td>Model is applied unchanged; calibration-in-the-large, slope, c with interval and net benefit are all reported and interpreted by cause.</td></tr>
<tr><td>9. Decision curve</td><td>Net benefit is compared with treat all and treat none at the declared threshold, and the effect of calibration is discussed.</td></tr>
<tr><td>10. Write-up</td><td>Contains the full formula with intercept and coding, honest limitations and no claim beyond the validation done.</td></tr>
<tr><td>11. Critical errors avoided</td><td>No refitting in the validation data presented as validation; no data-chosen cutpoints; no missing-indicator method; no apparent performance as the headline.</td></tr>
<tr><td>12. Clarity</td><td>The report is short, precise and understandable to a clinician who has not seen the analysis.</td></tr>
</tbody></table>
`}
  ],
  keyPoints: [
    'Fix the decision, outcome, predictors available at booking and the threshold before any analysis.',
    'Count EPV against all candidate degrees of freedom, including spline and quadratic terms.',
    'Missing haemoglobin that depends on other observed variables is handled by multiple imputation with the outcome in the imputation model.',
    'Keep continuous predictors continuous and budget degrees of freedom for non-linearity.',
    'Prefer a prespecified model with shrinkage over data-driven selection; shrinkage fixes calibration, not discrimination.',
    'Bootstrap optimism is valid only if every modelling step is replayed in each sample.',
    'External validation uses the fixed model; interpret calibration-in-the-large and slope by cause before judging.',
    'Net benefit at the declared threshold, with miscalibration in view, is the test of clinical usefulness.'
  ],
  quiz: [
    { q: 'A development sample has 90 preterm births. The team wants to consider 14 predictors, of which age is coded with a 4-knot spline (3 df) and the rest are single-df terms. What is the EPV?',
      options: ['90 / 14 = 6.4', '90 / 3 = 30', '90 / 16 = 5.6', '90 / 13 = 6.9'],
      answer: 2,
      why: 'Candidate df = 13 single-df terms + 3 df for the spline = 16, so EPV = 90 / 16 = 5.6. Counting predictors (14) rather than parameters is the commonest error. Dividing by the spline df alone ignores the other terms.' },
    { q: 'Haemoglobin is missing in 15% of women, more often in women with few antenatal visits and low socioeconomic status. Which approach is most defensible?',
      options: ['Multiple imputation using all predictors, the outcome and antenatal visits and socioeconomic status', 'Complete case analysis, because 85% of values are available', 'Replace missing values with the mean haemoglobin', 'Add a "missing" category for haemoglobin'],
      answer: 0,
      why: 'Missingness depends on observed variables (MAR), so imputation using those variables and the outcome is appropriate. Complete case analysis loses events and ignores the pattern; mean imputation shrinks variability and the association; the missing indicator method is biased. The 85% figure refers to values, but the share of women with all values complete is smaller.' },
    { q: 'A team selects predictors by backward elimination in the whole sample, then bootstraps only the final model and reports a small optimism. What is wrong?',
      options: ['Bootstrap cannot be used with logistic regression', 'The number of bootstrap samples was too large', 'Optimism should be calculated in the bootstrap sample only', 'Selection was not replayed in each bootstrap sample, so optimism is understated'],
      answer: 3,
      why: 'Selection uses the outcome and contributes to optimism. Each bootstrap sample must repeat the selection. The bootstrap works with logistic models, and more replications do not bias it. Optimism is the difference between apparent performance in the bootstrap sample and test performance in the original sample.' },
    { q: 'In an external validation, c is 0.70 (corrected development value 0.72), the calibration slope is 0.75, and calibration-in-the-large is +0.5. Which conclusion is best?',
      options: ['The model is valid because c barely changed', 'Predictions are too extreme and, on average, too low in this hospital, so the model needs caution before use there', 'The model should be refitted in the validation data and reported as externally validated', 'Only the slope matters; calibration-in-the-large can be ignored'],
      answer: 1,
      why: 'A slope below 1 means too extreme predictions; a positive intercept means under-prediction on average, consistent with higher incidence. A stable c does not show good calibration. Refitting in the validation data makes them development data. Both calibration measures matter for decisions.' },
    { q: 'At a 20% threshold in a validation sample of 400 women, the model gives TP = 50 and FP = 90. What is the net benefit?',
      options: ['50 / 400 = 0.125', '(50 − 90) / 400 = −0.100', '(50 − 0.25 × 90) / 400 = 0.069', '(50 − 0.20 × 90) / 400 = 0.080'],
      answer: 2,
      why: 'The weight is the threshold odds, 0.20 / 0.80 = 0.25, so NB = (50 − 22.5) / 400 = 0.069. Ignoring false positives gives 0.125; using weight 1 treats a false positive as equal to a missed case; using the probability 0.20 as the weight is the common mistake.' },
    { q: 'A prespecified model has 15 candidate df and model χ² of 45. Backward selection later keeps terms using 6 df with χ² 38. Which shrinkage factor is correct for the selected model?',
      options: ['(38 − 6) / 38 = 0.84', '(45 − 15) / 45 = 0.67', '(45 − 6) / 45 = 0.87', '1.0, because selection removes noise'],
      answer: 1,
      why: 'The heuristic must use the candidate df and the χ² of the full candidate model, because selection also capitalised on chance. Using the retained model understates the overfitting. Selection does not remove the need for shrinkage.' }
  ],
  tasks: [
    { id: 't1', title: 'Hand calculation: sample size, shrinkage and net benefit', level: 'Apply',
      scenario: `<p>Illustrative (synthetic). A district hospital develops a preterm birth model in 1000 women with 120 preterm births. The candidate set has 12 predictors, one of which (age) is coded with a quadratic, so there are 13 candidate df. The full model has likelihood ratio χ² = 60 with 13 df, and the maternal haemoglobin coefficient is 0.80 per g/dL below 11. The model is later applied in 400 women at a tertiary centre with 70 preterm births. At a 20% threshold it gives 50 true positives and 90 false positives.</p>`,
      questions: [
        '<b>(a)</b> Calculate the EPV and say which events would be needed to reach EPV 10 and EPV 20.',
        '<b>(b)</b> Calculate the heuristic uniform shrinkage factor and the shrunken haemoglobin coefficient. What must be done with the intercept?',
        '<b>(c)</b> Calculate the net benefit of the model and of treating all at the 20% threshold in the tertiary sample. Which policy is best?'
      ],
      answer: `<p><b>(a)</b> EPV = 120 / 13 = 9.2, just below the minimum of 10 and well below 20. EPV 10 needs 13 × 10 = 130 events; EPV 20 needs 13 × 20 = 260 events. The model is at risk of overfitting and shrinkage is advisable.</p>
<p><b>(b)</b> s = (60 − 13) / 60 = 47 / 60 = 0.783. Shrunken coefficient = 0.80 × 0.783 = 0.627. All coefficients are multiplied by the same factor, and the intercept must then be re-estimated (with the shrunken linear predictor as an offset) so that the mean predicted risk equals the observed incidence; multiplying the linear predictor alone leaves calibration-in-the-large wrong.</p>
<p><b>(c)</b> Threshold odds w = 0.20 / 0.80 = 0.25. Model: NB = (50 − 0.25 × 90) / 400 = 27.5 / 400 = 0.069. Treat all: incidence = 70 / 400 = 0.175, NB = 0.175 − 0.825 × 0.25 = 0.175 − 0.206 = −0.031. Treat none: NB = 0. The model is best: its net benefit is positive and about 0.10 above treating all. Interpretation: per 100 women, using the model yields about 6.9 net true positives (preterm births correctly referred, after weighting the unnecessary referrals), whereas referring everyone yields a net loss.</p>` },
    { id: 't2', title: 'Full project in the Analysis Lab', level: 'Evaluate',
      scenario: `<p>Open the Analysis Lab and carry out the ten stages on <code>ptb_dev</code>, with external validation on <code>ptb_val</code>. Use a 20% referral threshold. Record your decision and the key numbers at every stage, and finish with the one-page write-up. Then score yourself with the rubric.</p>`,
      questions: [
        '<b>(a)</b> Give your EPV and your chosen coding for age, haemoglobin and BMI, with the total candidate df.',
        '<b>(b)</b> State your missing-data method, strategy and shrinkage method, with one sentence of justification each.',
        '<b>(c)</b> Report apparent c, optimism-corrected c and corrected calibration slope.',
        '<b>(d)</b> Report external calibration-in-the-large, slope, c with interval and net benefit at 20%, and interpret each cause.',
        '<b>(e)</b> Write the final one-page report and score yourself with the rubric.'
      ],
      answer: `<p>Model answer sketch. Your numbers will depend on your choices; the pattern is what to check.</p>
<ol>
<li><b>Aim.</b> Decision: refer at booking to enhanced surveillance; outcome preterm birth before 37 weeks; predictors available at the first visit; threshold 20% (harm:benefit 1:4, w = 0.25), declared before analysis.</li>
<li><b>EPV.</b> Full candidate model has 15 df. With <span data-live="ptb_dev_events"></span> events in all women, EPV is the events divided by 15; in complete cases (<span data-live="ptb_cc_events"></span> events) it is lower. If you give haemoglobin or BMI a spline, add its df and recompute. The data-generating truth, revealed here for teaching, is that antenatal visits, fetal sex, season of conception and height have no effect. If you dropped them on subject-matter grounds before analysis, the candidate df falls and EPV improves.</li>
<li><b>Missing haemoglobin.</b> MAR on antenatal visits and socioeconomic status. Multiple imputation (m = 5) with predictors, outcome and those two variables; complete case analysis loses events and risks bias. Single stochastic imputation is acceptable for point estimates but understates standard errors.</li>
<li><b>Coding.</b> The data-generating process, which is revealed here for teaching, has a U-shaped age effect (a quadratic captures it), a risk that rises below haemoglobin 11 g/dL and a rise below BMI 20. A linear age term is clearly inferior and dichotomised age is poorest, as the model χ² in the coding explorer shows. A 3-knot spline for haemoglobin and BMI is a reasonable, df-economical choice; a linear term for each gives a poor but not disastrous fit. Compare by χ² − 2 df.</li>
<li><b>Strategy.</b> A prespecified model with subject-matter restriction is preferred. If you select (p &lt; 0.05), the selection frequencies from the stepwise lab show unstable inclusion of weak true predictors and sporadic inclusion of the noise candidates; that instability is the reason to avoid it with this EPV.</li>
<li><b>Shrinkage.</b> Uniform bootstrap shrinkage or ridge. The factor is below 1 and, for the full model, is about <span data-live="ptb_full_shrinkage"></span>. The c statistic hardly changes; calibration slope improves in the validation setting; the intercept is re-estimated.</li>
<li><b>Optimism.</b> Apparent c for the full 14-term model is <span data-live="ptb_full_apparent_c"></span>, corrected c <span data-live="ptb_full_corrected_c"></span>, optimism <span data-live="ptb_full_optimism_c"></span>. Optimism comes from selection as well as from estimation, so both must be replayed in each bootstrap sample. Report corrected values.</li>
<li><b>External validation.</b> The validation hospital has higher incidence, an older and higher-risk case-mix and predictor effects about 20% weaker. Expect a positive calibration-in-the-large (under-prediction on average), a calibration slope below 1 (weaker true effects plus any development overfitting) and a c statistic of the same order as the corrected development value, possibly somewhat lower (reference model: c <span data-live="ptb_val_c"></span>, slope <span data-live="ptb_val_slope"></span>, calibration-in-the-large <span data-live="ptb_val_citl"></span>). Interpret the intercept as a setting difference, and the slope as weaker effects plus overfitting. The model should not be refitted and re-labelled as validated.</li>
<li><b>Decision curve.</b> At 20%, the model should show higher net benefit than treat all and treat none over a range of thresholds; the under-prediction at the tertiary hospital narrows that range and may lower net benefit compared with the development setting, even though c is stable.</li>
<li><b>Write-up.</b> Includes the full coefficients, intercept and coding; corrected rather than apparent performance; EPV and the differences between hospitals as limitations; and no claim of use in other settings.</li>
</ol>
<p>Rubric check: lowest-scoring items for most learners are 2 (EPV counted by predictors rather than df), 3 (outcome omitted from imputation model) and 7 (selection not replayed). Items 1 and 11 relate to critical errors.</p>` },
    { id: 't3', title: 'Critique a published-style preterm birth model study', level: 'Analyze',
      scenario: `<p>Illustrative (synthetic). A group reports a preterm birth prediction model. Methods as described: 300 women at one district hospital, 36 preterm births. Forty candidate variables were screened by univariate p-value, and those with p &lt; 0.10 were entered into a backward stepwise logistic model, leaving 7 predictors. Haemoglobin (missing in 30%) was dichotomised at 11 g/dL and women with missing values were excluded. The reported c statistic was 0.86 in the same 300 women, and the model was called validated because a Hosmer-Lemeshow test was not significant (p = 0.51). The authors recommend a risk of 50% or more as the referral threshold and report accuracy of 91%. They then present the model for use in tertiary hospitals.</p>`,
      questions: [
        '<b>(a)</b> List every flaw, grouped as critical or serious, with the principle each violates.',
        '<b>(b)</b> State what analysis you would do instead, in order.'
      ],
      answer: `<p><b>(a) Flaws</b></p>
<ul>
<li><b>Critical: sample size.</b> With 36 events and 40 candidates, EPV is below 1. Even the 7 retained predictors give EPV about 5. The model is very likely overfitted.</li>
<li><b>Critical: apparent performance as validation.</b> c = 0.86 is measured in the development women. There is no internal validation (bootstrap with all steps replayed) and no external validation, so the figure is optimistic by an unknown, probably large amount.</li>
<li><b>Critical: univariate screening plus stepwise selection.</b> Both are data-driven and both capitalise on chance; coefficients of retained predictors are biased upwards (testimation) and the selected set would be unstable.</li>
<li><b>Serious: missing data.</b> Excluding the 30% with missing haemoglobin removes about 30% of women and events (or more if missingness relates to the outcome); imputation including the outcome should have been used.</li>
<li><b>Serious: dichotomising haemoglobin.</b> This discards information; the risk is expected to change smoothly with haemoglobin.</li>
<li><b>Serious: Hosmer-Lemeshow test.</b> A non-significant result in a small development sample reflects low power, and is not evidence of good calibration. Calibration-in-the-large and slope, with a calibration plot, are needed.</li>
<li><b>Serious: threshold and accuracy.</b> A 50% cutoff implies that a false positive is as bad as a missed case, which is rarely true for a referral decision. With 12% incidence, accuracy of 91% is reachable by classifying everyone as low risk (88%); accuracy is misleading. Net benefit at a threshold from the decision context is needed.</li>
<li><b>Serious: transportability.</b> A model built in one district hospital is proposed for tertiary hospitals, with a different case-mix and incidence, without any validation there.</li>
<li><b>Not reported:</b> shrinkage; the full model formula with intercept and coding; completeness of data per predictor.</li>
</ul>
<p><b>(b) Better analysis</b></p>
<ol>
<li>Fix the aim, outcome and threshold; restrict candidates by subject knowledge to a number the 36 events support (the data would allow about 3 df at EPV 10, and honestly the sample is too small for a multivariable model; collect more data).</li>
<li>Impute haemoglobin and BMI with the outcome in the imputation model; keep continuous predictors continuous.</li>
<li>Fit a prespecified model, apply shrinkage and re-estimate the intercept.</li>
<li>Estimate optimism with a bootstrap that replays all steps; report corrected c and slope.</li>
<li>Validate in a tertiary-hospital sample with at least 100 events, reporting calibration-in-the-large, slope, c with interval and net benefit at the declared threshold.</li>
</ol>` }
  ]
});
